<!doctype html>
<!--
=====================================================================
  SMART PIZARRA - PANTALLA DE CONFIGURACIÓN (ORIENTACIÓN, LIGAS Y ESCALA)
  PARA ANDROID WEBVIEW
=====================================================================

  QUE HACE
  Permite MODIFICAR los settings compartidos que crea loading.html:
    - La orientación (0°, 90°, 180°, 270°) con la que se muestran las
      pantallas de la app.
    - El idioma (es / en), GLOBAL para todas las pantallas.
    - La escala para la app (10% a 300%, de 5 en 5) con los botones − / +.
      Es SOLO un valor que se guarda en "smartpizarra.scale" para un
      proceso de Kodular; NO cambia el tamaño de ninguna pantalla. El JSON
      la envía como factor (80% => 0.8).
  NO modifica el tamaño de las pantallas ("smartpizarra.<pantalla>.scale"):
  se define en loading.html (PAGES) y solo se cambia con su updateSettings().
  Esta página solo LEE el suyo ("smartpizarra.config.scale") para mostrarse.
  La página:
    - Lee los settings guardados al arrancar y muestra versión, web,
      email e id del dispositivo (solo lectura, también de localStorage).
    - Gira la propia pantalla en vivo al elegir una orientación, para
      que el usuario vea el resultado al instante.
    - Se ajusta sola al tamaño de la pantalla (responsive), en cualquier giro.
    - Se maneja con el control remoto (flechas + OK), con el mouse o
      con toques.
    - Envía UN SOLO JSON a la app, y solo al pulsar "Salir" (mismo
      formato que loading.html). Los demás botones no envían nada.

  VALORES POR DEFECTO: NO LOS CREA ESTA PÁGINA
  Los valores por defecto y la creación de las claves son responsabilidad
  de loading.html (CONFIG.settings). Esta página solo LEE y MODIFICA:
    - Si una clave no existe (loading.html nunca se abrió), su campo se
      muestra como "Sin configurar", no se escribe nada al guardar si el
      usuario no la eligió, y en el JSON de "Salir" va null.
    - "Guardar" solo escribe los settings que tienen valor.

  DÓNDE SE GUARDA LA CONFIGURACIÓN (localStorage, mismas claves que loading.html)
    "smartpizarra.orientation"             0, 90, 180 o 270 (GLOBAL: todas las pantallas)
    "smartpizarra.scale"                   10 a 300 (%): escala para la app (panel Escala)
    "smartpizarra.config.scale"            tamaño de ESTA pantalla: solo se lee
                                           (lo define loading.html)
    "smartpizarra.language"                es o en (GLOBAL: idioma de todas las pantallas;
                                           ver I18N, debe ser IGUAL a I18N de loading.html)
    "smartpizarra.routeUrl"     URL de la ruta de su usuario (panel > Rutas), con la
                                liga del equipo dentro (leagues=...); sin ruta = http://localhost/none.html. Se lee
                                para el JSON; si al consultar el servidor (Salir) llegó
                                otra, se actualiza. (La liga ya no se guarda aparte.)
    "smartpizarra.version" / ".url" / ".email" / ".deviceId"
                                solo se leen y se muestran (no se editan aquí;
                                se modifican con updateSettings() de loading.html)
  - El valor sobrevive al cierre de la app y al reinicio de la TV box.
  - Solo se borra si se borran los datos de la app en Android.
  - Si el WebView no permite localStorage, la pantalla muestra "No se
    pudo guardar la configuración" y el JSON de "Salir" llega con
    "status":"error" (ver contrato de salida).

  SALIDA AUTOMÁTICA POR INACTIVIDAD
    Si pasan 5 min sin teclas, clics, toques ni movimiento del ratón, la
    página hace lo mismo que el botón "Salir" (exitConfig): descarta lo no
    guardado y envía el JSON de salida. Ajuste => IDLE_EXIT_MS (sección 8b).
    No hay protector de pantalla.

  COMPATIBILIDAD / RENDIMIENTO (Android WebView 101 en TV box)
  - JavaScript ES5 (var / function) + Promise: funciona en cualquier WebView.
  - Sin librerías externas: iconos SVG escritos en el propio archivo.
  - Sin backdrop-filter ni filter (pesados en GPU de TV box).

  FLUJO GENERAL
  1. init(): lee los settings guardados (los que falten quedan "Sin
     configurar"), gira la pantalla, dibuja la UI y pone el foco en la
     orientación actual. No envía nada a la app ni escribe nada.
  2. El usuario elige la orientación (GLOBAL: vale para todas las
     pantallas; el contenido gira en vivo hacia ella), el idioma (GLOBAL;
     la página se traduce en vivo) y
     la escala para la app (solo un número guardado).
     Se abre con lo guardado en localStorage y vuelve a leerlo cada 1 s /
     al mostrarse (si no hay cambios sin guardar).
  3. "Guardar" => escribe en localStorage los settings con valor (no envía JSON).
  4. "Salir" => descarta lo que no se haya guardado y envía a la app
     el ÚNICO JSON de esta pantalla, con la configuración guardada.
     Si internet aún no se verificó, espera el resultado (máx. 3 s) para
     que "internetStatus" sea real. La app debe cerrar esta pantalla al recibirlo.
  5. En paralelo se verifica internet de forma periódica (mismo método
     que loading.html).

  CONTRATO DE SALIDA: UN SOLO mensaje, al pulsar "Salir"
  Ningún otro botón ni evento envía JSON (ni al abrir, ni al cambiar
  la orientación, ni al guardar, ni cuando cambia internet).
  Excepción: 5 min sin interacción => se envía este mismo JSON, igual que
  al pulsar "Salir" (ver SALIDA AUTOMÁTICA POR INACTIVIDAD).
  Mismo formato que loading.html. Al pulsar "Salir" se consulta en
  smartpizarra.cloud (api/device.php, a la vez que internet; máx. 5 s) si
  el equipo está autorizado, se actualiza "smartpizarra.authorized" y el
  JSON lleva "authorized" (true|false) y "authStatus" (authorized |
  pending | revoked | conflict | unknown | offline | no_device; ver
  "AUTORIZACIÓN EN smartpizarra.cloud" en el script):

      {"origin":"config","action":"exit","status":"saved",
       "internetStatus":"online","version":"3.0.14","url":"smartpizarra.com",
       "email":"smartpizarra@gmail.com","deviceId":"SP-XXXX-XXXX-XXXX",
       "routeUrl":"https://sport.grupoazar.do/PizarrasV2?agent=df&...&leagues=LIDOM,MLB,...",
       "orientation":90,"language":"en","scale":1,
       "authorized":true,"authStatus":"authorized"}

    origin          "config" (de dónde proviene la información).
    language        Idioma GLOBAL guardado (es, en; null si no existe).
    status          "saved"     => en esta visita se guardó la configuración.
                    "unchanged" => no se guardó nada en esta visita.
                    "error"     => el último intento de guardar falló
                                   (localStorage no disponible).
    internetStatus  "online" | "offline" (resultado real de la verificación).
    version, url, email, deviceId   Leídos de localStorage al salir.
    orientation     Orientación GLOBAL guardada (null si no existe).
    scale           Escala para la app GUARDADA, como factor % / 100
                    (null si no existe).
    routeUrl        URL de la ruta de su usuario con la liga del equipo dentro
                    (leagues=...); sin ruta = http://localhost/none.html. Se lee de localStorage tras la
                    consulta al servidor, que la actualiza si cambió.
    Lo que se cambió sin pulsar "Guardar" se descarta.

  FUNCIONES PUBLICAS (la app las llama con RunJavaScript)
    getConfig()             Devuelve un texto JSON con la configuración
                            en pantalla: {"orientation":90,"language":"en",
                            "scale":1,"routeUrl":"https://..."} (ruta: solo lectura)
    saveConfig()            Igual que pulsar "Guardar" (no envía JSON).
    exitConfig()            Igual que pulsar "Salir" (envía el JSON).
    checkConnection()       Fuerza una verificación de internet (no envía
                            JSON). Devuelve el último estado conocido.
    checkConnectionAsync()  Igual, pero devuelve Promise<boolean>.

  TECLADO Y CONTROL REMOTO (la pantalla está pensada para usarse con flechas)
    Flechas            Pensado para una TV montada GIRADA físicamente (el
                       texto se lee derecho). Las flechas siguen al contenido
                       tal como se lee, en cualquier orientación:
                         → botón de la derecha    ← botón de la izquierda
                         ↑ fila de arriba         ↓ fila de abajo
                       Si no hay ningún botón en esa dirección, el foco se queda.
                       Al subir/bajar se mantiene la columna. Mantener una
                       flecha pulsada mueve como máximo cada 150 ms.
                       (En un monitor de PC SIN girar, con la página a 90°,
                       las flechas parecerán "giradas": es lo esperado.)
    OK / Enter / Espacio  Pulsan el botón con foco. Mantenerlas pulsadas
                       no repite la acción.
    1, 2, 3, 4         Eligen 0°, 90°, 180° y 270° directamente.
    Esc                Lleva el foco a "Salir" (para salir hay que pulsar OK).
    El foco nunca se pierde: si se hace clic en el fondo o se vuelve a la
    app, se recupera en el botón de la orientación actual.

  ARQUITECTURA (bloque <script>, en este orden)
    1. Configuración        Orientaciones, valores por defecto y tiempos.
    2. Estado               Valor guardado, valor en pantalla, etc.
    3. Comunicación         sendToAppInventor(), send() (solo los usa "Salir").
    4. Orientación          layoutManager (gira la página y la ajusta para
                            que siempre quepa en pantalla).
    5. Configuración        setOrientation(), setLanguage(), changeScale(),
                            saveConfig(), exitConfig().
    6. UI                   render(): refleja el estado en los botones.
    7. Teclado              Búsqueda del botón vecino en el contenido
                            (findNeighbor) y atajos (onKeyDown).
    8. Conexión             Verificación de internet (igual que fingerprint).
    9. API pública          Funciones window.* para la app.
   10. Inicio               init().

  COMO MODIFICAR (guía rápida)
    Orientaciones disponibles
      => ORIENTATIONS (sección 1) y los botones .orient del HTML
         (cada botón lleva su valor en data-orientation).
    Valores por defecto
      => NO están aquí: CONFIG.settings de loading.html.
    Límites o paso de la escala (botones − / +)
      => SCALE_LIMITS (sección 1).
    Ruta del equipo (solo lectura, para el JSON; la liga va dentro)
      => readDeviceRoute() / storeDeviceRoute() (sección 1). Se asigna en
         el panel (Rutas) y la liga en smartpizarra.cloud/cuenta/.
    Agregar un botón nuevo
      => ponerlo en el HTML con class="btn" y añadirlo a su fila en
         el.rows (init()). Las flechas recorren esas filas.
    Teclas y atajos
      => onKeyDown() (sección 7).
    Cómo eligen las flechas el siguiente botón
      => findNeighbor() (sección 7).
    Nombres de las claves de localStorage
      => ORIENTATION_KEY, LANGUAGE_KEY, SCALE_KEY, OWN_SCALE_KEY, DEVICE_ROUTE_KEY
         (sección 1). Deben ser IGUALES a CONFIG.settings de loading.html.
    Mensaje que se envía a la app al salir
      => exitConfig().
    Textos que ve el usuario / idiomas
      => I18N (sección 1): un diccionario por idioma. Los textos fijos del
         HTML llevan data-i18n="clave" (y data-i18n-aria para aria-label);
         los dinámicos se piden con t("clave") en render().
         Para agregar un idioma: añadirlo a I18N aquí y en loading.html, y
         un botón .lang en el HTML.
    Colores, tamaños o estilo del foco
      => bloque <style> (cada sección está numerada y comentada).

  COMO PROBAR EN UN NAVEGADOR DE PC
    Abrir antes loading.html en el mismo navegador (crea los settings).
    Abrir este archivo, abrir la consola (F12) y escribir:
      window.AppInventor = { setWebViewString: function (m) { console.log(m); } };
    Luego usar las flechas del teclado y Enter como si fuera el control
    remoto, o hacer clic en los botones. El JSON aparece en la consola
    solo al pulsar "Salir". Tras "Guardar", abrir
    loading.html, connection.html o fingerprint.html en el mismo
    navegador: se verán con la orientación guardada.
    Para ver o borrar el valor guardado (consola):
      localStorage.getItem("smartpizarra.orientation")
      localStorage.removeItem("smartpizarra.orientation")
      localStorage.getItem("smartpizarra.routeUrl")   (ruta del equipo, la pone el servidor)
      localStorage.getItem("smartpizarra.config.scale")
      localStorage.removeItem("smartpizarra.config.scale")

  ARCHIVOS RELACIONADOS
    loading.html  Crea los settings con sus valores por defecto, los aplica
                  y los muestra. Usa las mismas claves.
    example2.html Versión original de esta pantalla (referencia).
=====================================================================
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Configuración - Smart Pizarra</title>
    <style>
      /* ==============================================================
           1. BASE: reinicio de estilos, colores globales y fondo
           ============================================================== */

      /* Quita márgenes por defecto y hace que el padding cuente dentro del ancho */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent; /* sin resaltado azul al tocar */
      }

      :root {
        --accent: #00e5ff; /* color de selección y foco */
        --accent-soft: rgba(0, 229, 255, 0.18);
        --ok: #4caf50; /* "guardado" */
        --warn: #ff9800; /* "sin guardar" */
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1a237e;
      }

      body {
        font-family: "Segoe UI", Roboto, Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1a237e 0%, #311b92 100%);
        color: #e8eaf6;
        position: relative;
        user-select: none; /* evita seleccionar texto por accidente */
      }

      /* ==============================================================
           2. ESCENARIO Y AJUSTE A PANTALLA (rotación)
           Los dimensiona y transforma layoutManager desde JavaScript.
           ============================================================== */

      /* #stage: se rota 0/90/180/270. Su ancho y alto los fija el JS
           (se intercambian al rotar 90 o 270) */
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* #scaler: el JS lo escala (agranda o reduce) para que la tarjeta ocupe
           FIT_RATIO de la pantalla en cualquier orientación. Escala desde su
           centro; flex-shrink:0 para medir su tamaño natural sin recortes. */
      #scaler {
        display: flex;
        justify-content: center;
        flex-shrink: 0;
        transform-origin: 50% 50%;
      }

      /* ==============================================================
           3. TARJETA PRINCIPAL Y CABECERA
           ============================================================== */
      .config-container {
        width: 640px;
        background: rgba(30, 40, 100, 0.88);
        padding: 32px 36px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(100, 150, 255, 0.3);
      }

      .header {
        display: flex;
        align-items: center;
        margin-bottom: 24px;
      }

      .logo {
        width: 64px;
        height: 64px;
        min-width: 64px;
        margin-right: 18px;
        border-radius: 14px;
        background: linear-gradient(45deg, #2196f3, #21cbf3);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 26px;
        font-weight: bold;
        color: #fff;
        box-shadow: 0 8px 20px rgba(33, 150, 243, 0.4);
      }

      .header-text {
        flex: 1;
      }

      h1 {
        font-size: 1.9rem;
        line-height: 1.2;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
      }

      /* Líneas con versión · sitio web · email e id (leídos de localStorage) */
      .app-info {
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.6);
        margin-top: 4px;
      }
      .app-info span:empty,
      .app-info:empty {
        display: none;
      } /* campo sin datos: no se muestra */
      .app-info .website {
        color: hsl(187, 100%, 38%);
      }

      /* Indicador de internet (punto + texto) */
      .net {
        display: flex;
        align-items: center;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.7);
        white-space: nowrap;
      }
      .net-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 6px;
        background: #ffc107; /* verificando */
      }
      .net.online .net-dot {
        background: var(--ok);
      }
      .net.offline .net-dot {
        background: #f44336;
      }

      /* ==============================================================
           4. SECCIONES Y BOTONES
           ============================================================== */
      .section {
        margin-bottom: 22px;
      }

      .section-title {
        font-size: 1.05rem;
        color: rgba(255, 255, 255, 0.75);
        margin-bottom: 10px;
        letter-spacing: 0.5px;
      }

      /* Fila de botones repartidos a lo ancho */
      .row {
        display: flex;
        gap: 10px;
      }
      .row > .btn {
        flex: 1;
      }

      /* Botón base (orientación y acciones) */
      .btn {
        font: inherit;
        color: inherit;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 12px 10px;
        font-size: 1.05rem;
        cursor: pointer;
        outline: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s,
          border-color 0.15s,
          box-shadow 0.15s;
      }

      /* Opción elegida (orientación actual) */
      .btn.selected {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: #fff;
      }

      /* FOCO: muy visible para manejar con el control remoto desde el sofá */
      .btn:focus {
        border-color: #fff;
        box-shadow:
          0 0 0 4px var(--accent),
          0 0 18px rgba(0, 229, 255, 0.6);
        background: rgba(255, 255, 255, 0.18);
      }

      /* Flecha SVG de los botones de orientación (el HTML la gira con style:
           0° => ↑, 90° => →, 180° => ↓, 270° => ←, tal como se lee el contenido). */
      .orient-icon {
        width: 30px;
        height: 30px;
        margin-bottom: 4px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .orient-label {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.6);
      }

      /* Escala: botones − / + y el valor en el centro (el valor no recibe foco) */
      .row > .btn.scale-btn {
        flex: 0 0 90px;
        font-size: 1.6rem;
        font-weight: bold;
        padding: 8px 10px;
      }
      .scale-value {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        font-weight: bold;
        color: var(--accent);
      }
      .scale-note {
        margin-top: 8px;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.6);
        text-align: center;
      }

      /* ==============================================================
           5. ACCIONES Y MENSAJE DE ESTADO
           ============================================================== */
      .actions {
        margin-top: 6px;
      }

      .btn.primary {
        background: rgba(76, 175, 80, 0.25);
        border-color: rgba(76, 175, 80, 0.7);
      }

      /* Botón "Salir": rojizo para distinguirlo de las demás acciones */
      .btn.exit {
        background: rgba(244, 67, 54, 0.2);
        border-color: rgba(244, 67, 54, 0.6);
      }

      .status {
        margin-top: 16px;
        min-height: 1.5em;
        text-align: center;
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.6);
      }
      .status.dirty {
        color: var(--warn);
      } /* hay cambios sin guardar */
      .status.saved {
        color: var(--ok);
      } /* configuración guardada */

      .hint {
        margin-top: 6px;
        text-align: center;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.45);
      }
    </style>
  </head>
  <body>
    <!-- #stage  => se rota según la orientación elegida (vista previa en vivo)
         #scaler => ajusta la tarjeta para que siempre quepa en pantalla -->
    <div id="stage">
      <div id="scaler">
        <div class="config-container" id="configContainer">
          <!-- CABECERA: logo, título, datos de la app e indicador de internet -->
          <div class="header">
            <div class="logo">SP</div>
            <div class="header-text">
              <h1 data-i18n="heading">Configuración de pantalla</h1>
              <!-- Los llena renderInfo() desde localStorage; vacíos no se muestran -->
              <div class="app-info">
                <span id="versionText"></span>
                <span class="website" id="websiteUrl"></span>
                <span id="emailContact"></span>
              </div>
              <div class="app-info" id="deviceIdText"></div>
            </div>
            <div class="net" id="netStatus">
              <div class="net-dot"></div>
              <span id="netText">Verificando…</span>
            </div>
          </div>

          <!-- ORIENTACIÓN (GLOBAL, todas las pantallas): cada botón lleva su valor en
             data-orientation. La flecha apunta hacia donde quedará la parte
             superior del contenido. -->
          <div class="section">
            <div class="section-title" id="orientTitle">Orientación</div>
            <div class="row" id="orientRow">
              <button class="btn orient" data-orientation="0">
                <svg
                  class="orient-icon"
                  viewBox="0 0 24 24"
                  style="transform: rotate(0deg)"
                >
                  <path d="M12 20V4M5 11l7-7 7 7" />
                </svg>
                0°<span class="orient-label" data-i18n="orient.0">Normal</span>
              </button>
              <button class="btn orient" data-orientation="90">
                <svg
                  class="orient-icon"
                  viewBox="0 0 24 24"
                  style="transform: rotate(90deg)"
                >
                  <path d="M12 20V4M5 11l7-7 7 7" />
                </svg>
                90°<span class="orient-label" data-i18n="orient.90"
                  >Derecha</span
                >
              </button>
              <button class="btn orient" data-orientation="180">
                <svg
                  class="orient-icon"
                  viewBox="0 0 24 24"
                  style="transform: rotate(180deg)"
                >
                  <path d="M12 20V4M5 11l7-7 7 7" />
                </svg>
                180°<span class="orient-label" data-i18n="orient.180"
                  >Invertida</span
                >
              </button>
              <button class="btn orient" data-orientation="270">
                <svg
                  class="orient-icon"
                  viewBox="0 0 24 24"
                  style="transform: rotate(270deg)"
                >
                  <path d="M12 20V4M5 11l7-7 7 7" />
                </svg>
                270°<span class="orient-label" data-i18n="orient.270"
                  >Izquierda</span
                >
              </button>
            </div>
          </div>

          <!-- IDIOMA (GLOBAL, todas las pantallas): cada botón lleva en data-language
             una clave de I18N (sección 1 del script). Su texto es el nombre del
             idioma en ese idioma y no se traduce. -->
          <div class="section">
            <div class="section-title" id="langTitle">Idioma</div>
            <div class="row" id="langRow">
              <button class="btn lang" data-language="es">Español</button>
              <button class="btn lang" data-language="en">English</button>
            </div>
          </div>

          <!-- ESCALA: − / + cambian el valor en pasos de SCALE_LIMITS.step.
             Es SOLO un valor que se guarda en "smartpizarra.scale" para un
             proceso de la app (Kodular). NO cambia el tamaño de ninguna pantalla:
             la escala de las pantallas solo se define en loading.html. -->
          <div class="section">

    <script>
      // Todo el código va dentro de una función (IIFE) para no crear variables
      // globales por accidente. Lo que la app necesita se publica en window.*
      (function () {
        "use strict";

        /* ==================================================================
           1. CONFIGURACIÓN (valores ajustables)
           ================================================================== */

        /** Orientaciones permitidas, en grados (mismas que las demás pantallas). */

        /*
         * RUTA DEL EQUIPO (2026-11-12). El ADMINISTRADOR crea rutas en el
         * panel (Gestión de Rutas: URL base + agent, pageIndex, timer,
         * showParams, otherQ, pageSize) y las asigna a USUARIOS; todos los
         * equipos del usuario la heredan. api/device.php y api/media.php
         * envían la URL final (campo deviceRoute; leagues = códigos de la liga
         * de ESTE equipo) o null = sin ruta, y se guarda en localStorage:
         *   "smartpizarra.routeUrl" = URL completa; SIN RUTA (null del servidor,
         *   o clave vacía/no válida) => NO_ROUTE_URL: la pantalla LOCAL none.html
         *   (assets de Kodular) que dice que el equipo no puede mostrar el
         *   contenido y que se comunique con su supervisor, y que sigue
         *   consultando el servidor. Así la app siempre recibe una URL.
         * Va en el JSON a la app como "routeUrl".
         * LA LIGA YA NO SE GUARDA EN LA TV (2026-11-12): va DENTRO de esta URL
         * (parámetro leagues); storeDeviceRoute borra las claves viejas
         * smartpizarra.league / .leagues / .leagueOptions.
         * MISMO bloque en loading, config, connection, fingerprint, mirror y none.
         */
        var DEVICE_ROUTE_KEY = "smartpizarra.routeUrl";
        /** URL por defecto SIN ruta: la pantalla local none.html (assets de Kodular). */
        var NO_ROUTE_URL = "http://localhost/none.html";
        /** URL "sin ruta" de la versión anterior (en el servidor): se sustituye por NO_ROUTE_URL. */
        var OLD_NO_ROUTE_RE = /^https?:\/\/(www\.)?smartpizarra\.cloud\/none\/?$/i;

        /** @returns {string} URL http(s) válida (sin espacios ni comillas, máx. 2000) o "". */
        function cleanRouteUrl(value) {
          var v = typeof value === "string" ? value.trim() : "";
          if (OLD_NO_ROUTE_RE.test(v)) return ""; // antigua página del servidor => NO_ROUTE_URL
          return /^https?:\/\/[^\s"'<>]{1,2000}$/.test(v) ? v : "";
        }

        /** @returns {string} URL de la ruta guardada (NO_ROUTE_URL si no hay o no es válida). */
        function readDeviceRoute() {
          try {
            return cleanRouteUrl(window.localStorage.getItem(DEVICE_ROUTE_KEY)) || NO_ROUTE_URL;
          } catch (e) {
            return NO_ROUTE_URL; // sin localStorage: sin ruta
          }
        }

        /* ------------------------------------------------------------------
         * CONTENIDO HABILITADO (2026-11-12)
         * El permiso de CONTENIDO del equipo (imágenes/videos de mirror.html),
         * que da o quita el administrador aparte de la autorización. Llega en
         * las respuestas de api/device.php y api/media.php ("mediaEnabled":
         * true/false) y se guarda en "smartpizarra.mediaEnabled" ("1" / "0").
         * TODAS las páginas lo envían en su JSON a la app como "mediaEnabled"
         * (true / false; false si todavía no se sabe).
         * MISMO bloque en loading, config, connection, fingerprint, mirror y none.
         * ---------------------------------------------------------------- */
        var MEDIA_ENABLED_KEY = "smartpizarra.mediaEnabled";

        /**
         * Guarda el permiso de contenido de una respuesta del servidor (solo si
         * la respuesta lo trae).
         * @returns {boolean} true si cambió.
         */
        function storeMediaEnabled(res) {
          if (!res || typeof res !== "object" || typeof res.mediaEnabled !== "boolean") return false;
          var v = res.mediaEnabled ? "1" : "0";
          try {
            if (window.localStorage.getItem(MEDIA_ENABLED_KEY) === v) return false;
            window.localStorage.setItem(MEDIA_ENABLED_KEY, v);
            return true;
          } catch (e) {
            return false;
          }
        }

        /** @returns {boolean} Permiso de contenido guardado (false si no se sabe). */
        function readMediaEnabled() {
          try {
            return window.localStorage.getItem(MEDIA_ENABLED_KEY) === "1";
          } catch (e) {
            return false;
          }
        }

        /**
         * Guarda la ruta de una respuesta de api/device.php o api/media.php.
         * Solo si trae el campo deviceRoute (equipos autorizados); null = sin
         * ruta => NO_ROUTE_URL.
         * @returns {boolean} true si cambió.
         */
        function storeDeviceRoute(res) {
          if (!res || typeof res !== "object" || !Object.prototype.hasOwnProperty.call(res, "deviceRoute")) {
            return false;
          }
          var url = cleanRouteUrl(res.deviceRoute) || NO_ROUTE_URL;
          try {
            var ls = window.localStorage;
            // Restos de cuando la liga se guardaba aparte (ahora va en la URL)
            ls.removeItem("smartpizarra.league");
            ls.removeItem("smartpizarra.leagues");
            ls.removeItem("smartpizarra.leagueOptions");
            if (ls.getItem(DEVICE_ROUTE_KEY) === url) return false;
            ls.setItem(DEVICE_ROUTE_KEY, url);
          } catch (e) {
            return false;
          }
          return true;
        }

        /** Límites y paso (en %) de la escala que se elige con − / +.
            Mismos límites que acepta loading.html (10 a 300). */
        var SCALE_LIMITS = { min: 10, max: 300, step: 5 };

            NO se guarda sola: solo si el usuario la cambia y pulsa "Guardar". */
        var SCALE_START = 100;

        function toZoom(percent) {

        }

        var I18N = {
