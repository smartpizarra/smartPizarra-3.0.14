        }

        /**
         * Textos de la pantalla por idioma (GLOBAL: clave "smartpizarra.language").
         * Las claves de idioma (es, en) deben ser IGUALES a I18N de loading.html,
         * que crea el setting con su valor por defecto.
         * Para agregar un idioma: un diccionario aquí con TODAS las claves, otro
         * en loading.html y un botón .lang en el HTML.
         */
        var I18N = {
          es: {
            title: "Configuración - Smart Pizarra",
            heading: "Configuración de pantalla",
            "net.checking": "Verificando…",
            "net.online": "Con internet",
            "net.offline": "Sin internet",
            "orient.title": "Orientación · todas las pantallas",
            "orient.0": "Normal",
            "orient.90": "Derecha",
            "orient.180": "Invertida",
            "orient.270": "Izquierda",
            "lang.title": "Idioma · todas las pantallas",
            "league.title": "Ligas",
            "league.all": "TODOS",
            "league.allValues": "todas las ligas",
            "scale.title": "Escala",
            "scale.down": "Reducir escala",
            "scale.up": "Aumentar escala",
            "scale.note": "Valor para la app (no cambia el tamaño de las pantallas) · se envía como ",
            unset: "Sin configurar",
            unsetSuffix: " (sin configurar)",
            save: "Guardar",
            exit: "Salir",
            "status.error": "No se pudo guardar la configuración",
            "status.dirty": "Cambios sin guardar",
            "status.saved": "Configuración guardada ✓",
            "status.checking": "Verificando internet…",
            hint: "Flechas: moverse · OK / Enter: elegir · 1-4: orientación · Esc: ir a Salir",
            version: "Versión: ",
            id: "Id: ",
          },
          en: {
            title: "Settings - Smart Pizarra",
            heading: "Display settings",
            "net.checking": "Checking…",
            "net.online": "Online",
            "net.offline": "Offline",
            "orient.title": "Orientation · all screens",
            "orient.0": "Normal",
            "orient.90": "Right",
            "orient.180": "Inverted",
            "orient.270": "Left",
            "lang.title": "Language · all screens",
            "league.title": "Leagues",
            "league.all": "ALL",
            "league.allValues": "all leagues",
            "scale.title": "Scale",
            "scale.down": "Decrease scale",
            "scale.up": "Increase scale",
            "scale.note": "Value for the app (does not resize the screens) · sent as ",
            unset: "Not set",
            unsetSuffix: " (not set)",
            save: "Save",
            exit: "Exit",
            "status.error": "Settings could not be saved",
            "status.dirty": "Unsaved changes",
            "status.saved": "Settings saved ✓",
            "status.checking": "Checking internet…",
            hint: "Arrows: move · OK / Enter: select · 1-4: orientation · Esc: go to Exit",
            version: "Version: ",
            id: "Id: ",
          },
        };

        /** Idioma con el que se MUESTRA la pantalla si la clave aún no existe.
            NO se guarda (el valor por defecto lo crea loading.html). */
        var DISPLAY_LANGUAGE = "en"; // igual que DEFAULT_LANGUAGE de loading.html

        /**
         * Claves de localStorage. Deben ser IGUALES a CONFIG.settings de
         * loading.html (que es quien las crea con sus valores por defecto).
         * Esta página NO tiene valores por defecto: solo lee y modifica.
         */
        /** Orientación GLOBAL: una sola para todas las pantallas. */
        var ORIENTATION_KEY = "smartpizarra.orientation";
        /** Escala para la app (panel "Escala"): solo se guarda, no se aplica. */
        var SCALE_KEY = "smartpizarra.scale";
        /** Tamaño de ESTA pantalla: solo se LEE (se define en loading.html y se
            cambia con su updateSettings; esta página no lo modifica). */
        var OWN_SCALE_KEY = "smartpizarra.config.scale";
        var LEAGUE_KEY = "smartpizarra.league";
        /** Idioma GLOBAL: uno solo para todas las pantallas. */
        var LANGUAGE_KEY = "smartpizarra.language";
        /** Claves que solo se leen y se muestran (se editan desde loading.html). */
        var INFO_KEYS = {
          version: "smartpizarra.version",
          url: "smartpizarra.url",
          email: "smartpizarra.email",
          deviceId: "smartpizarra.deviceId",
        };

        /** Fracción de la pantalla (rotada) que ocupa la tarjeta (igual que loading.html). */
        var FIT_RATIO = 0.9;

        /** Cada cuántos ms se revisa el tamaño de la ventana (el WebView compilado
            puede arrancar con 0x0 y sin disparar "resize"; igual que loading.html). */
        var WATCH_MS = 1000;

        /** Espera máxima (ms) por la verificación de internet al pulsar "Salir". */
        var EXIT_WAIT_MS = 3000;

        // Verificación de internet (mismo método que connection.html y fingerprint.html)
        var CONNECTION_CONFIG = {
          // Cada endpoint responde con un JSON conocido (con CORS) que se LEE y se VALIDA.
          // Así un portal cautivo, el router o un DNS local que respondan con su propia
          // página NO cuentan como internet. Con que UNO sea válido, hay internet.
          endpoints: [
            {
              url: "https://1.1.1.1/dns-query?name=example.com&type=A&ct=application/dns-json",
              type: "dns",
            },
            {
              url: "https://8.8.8.8/resolve?name=example.com&type=A",
              type: "dns",
            },
            {
              url: "https://cloudflare-dns.com/dns-query?name=example.com&type=A&ct=application/dns-json",
              type: "dns",
            },
            {
              url: "https://dns.google/resolve?name=example.com&type=A",
              type: "dns",
            },
            { url: "https://api.ipify.org/?format=json", type: "ip" },
          ],
          timeoutMs: 5000, // tiempo máximo de espera por verificación
          onlineIntervalMs: 30000, // frecuencia de verificación cuando hay internet
          offlineIntervalMs: 5000, // frecuencia de verificación cuando no hay internet
          retryIntervalMs: 3000, // reintento rápido tras un fallo estando online
          failuresToOffline: 2, // fallos seguidos para declarar "offline"
        };

        /* ==================================================================
           2. ESTADO (variables que cambian mientras corre la página)
           ================================================================== */

        /** Configuración guardada (la que se informa al salir). Se lee de
            localStorage en init(); null = la clave no existe (sin defecto). */
        var saved = {
          orientation: null,
          language: null,
          league: null,
          scale: null,
        };

        /** Configuración en pantalla (la que se está editando). */
        var current = {
          orientation: null,
          language: null,
          league: null,
          scale: null, // escala para la app (%), no se aplica a la pantalla
        };

        /** Idioma cuyos textos están puestos ahora en el HTML (evita retocar el DOM). */
        var appliedLanguage = null;

        /** Tamaño (%) con el que se muestra ESTA pantalla, leído de OWN_SCALE_KEY
            (solo lectura; null => 100). No forma parte de lo que se edita. */
        var ownScale = null;

        /**
         * Copia una configuración en otra (from => to).
         * @param {{orientation:?number, language:?string, league:?string, scale:?number}} from
         * @param {{orientation:?number, language:?string, league:?string, scale:?number}} to
         */
        function copyConfig(from, to) {
          to.orientation = from.orientation;
          to.language = from.language;
          to.league = from.league;
          to.scale = from.scale;
        }

        /** true justo después de guardar (para mostrar "Configuración guardada"). */
        var justSaved = false;

        /** true si el último intento de guardar falló (localStorage no disponible). */
        var saveError = false;

        /** true si en esta visita se guardó al menos una vez con éxito (para el JSON de "Salir"). */
        var savedThisSession = false;

        /** true mientras "Salir" espera la verificación de internet (evita dobles envíos). */
        var exiting = false;

        var internetStatus = "unknown"; // 'unknown' | 'online' | 'offline'
        var currentCheck = null; // Promise de la verificación en curso
        var checkTimer = null; // temporizador de la próxima verificación
        var failures = 0; // fallos de verificación seguidos (histéresis)
        var lastLatency = 0; // ms que tardó la última verificación

        // Referencias DOM cacheadas. Se llenan en init().
        // el.focusables = todos los botones a los que se llega con las flechas.
        var el = {};

        /* ==================================================================
           3. COMUNICACIÓN CON LA APP (Kodular / App Inventor)
           ================================================================== */

        /**
         * Envía un texto a la app probando 4 métodos, del más específico al
         * más general. Se usa el primero que esté disponible.
         * En Kodular el bloque "WebViewer.WebViewStringChange" recibe el texto.
         * @param {string} message Texto a enviar (normalmente un JSON).
         */
        function sendToAppInventor(message) {
          try {
            if (window.AppInventor && window.AppInventor.setWebViewString) {
              window.AppInventor.setWebViewString(message); // Kodular / App Inventor
            } else if (window.android && window.android.onReceiveValue) {
              window.android.onReceiveValue(message); // Android (versiones nuevas)
            } else if (
              window.androidInterface &&
              window.androidInterface.onReceiveValue
            ) {
              window.androidInterface.onReceiveValue(message); // Interface estándar
            } else {
              window.postMessage(message, "*"); // Navegador normal (pruebas)
            }
          } catch (e) {
            console.log("Error enviando a AppInventor:", e);
          }
          console.log("Enviado a AppInventor:", message);
        }

        /**
         * Arma y envía un mensaje estándar de esta pantalla (mismo formato que
         * loading.html): origen, acción, resultado, internet y los datos de
         * la app leídos de localStorage en ese momento.
         * IMPORTANTE: en esta pantalla SOLO lo usa exitConfig() (botón "Salir").
         * @param {string} action  Qué pasó ('exit').
         * @param {string} status  Resultado ('saved', 'unchanged' o 'error').
         * @param {object} [extra] Campos adicionales (orientation, scale, league...).
         */
        function send(action, status, extra) {
          var info = readInfo();
          var msg = {
            origin: "config", // de dónde proviene la información
            action: action,
            status: status,
            internetStatus: internetStatus === "unknown" ? "" : internetStatus,
            version: info.version,
            url: info.url,
            email: info.email,
            deviceId: info.deviceId,
          };
          if (extra) {
            for (var key in extra) {
              if (Object.prototype.hasOwnProperty.call(extra, key))
                msg[key] = extra[key];
            }
          }
          sendToAppInventor(JSON.stringify(msg));
        }

        /* ==================================================================
           4. ORIENTACIÓN Y AJUSTE A PANTALLA
           Igual que en las demás pantallas, y además #scaler se reduce lo
           justo para que la tarjeta quepa siempre en pantalla.

           Cómo funciona la rotación:
            - #stage se gira con CSS transform alrededor de su esquina superior
              izquierda y luego se desplaza (translate) para volver a cubrir la pantalla.
            - Con 90° y 270° el escenario "se acuesta": ancho y alto se intercambian.
           ================================================================== */
        var layoutManager = {
          stage: null, // elemento #stage
          scaler: null, // elemento #scaler
          card: null, // tarjeta de configuración (para medir su tamaño)
          orientation: 0, // grados aplicados ahora
          scale: 100, // escala (%) aplicada ahora
          _lastState: "", // "orientación|escala|anchoxalto|tarjeta" aplicado por última vez

          /**
           * Aplica orientación y escala, y las vuelve a aplicar si la pantalla
           * cambia de tamaño (eventos + revisión cada WATCH_MS).
           * @param {number|null} orientation Grados iniciales (null => 0).
           * @param {number|null} scale       Escala (%) inicial (null => 100).
           *        Los null son solo para mostrar: no se guarda nada.
           */
          init: function (orientation, scale) {
            var self = this;
            this.stage = document.getElementById("stage");
            this.scaler = document.getElementById("scaler");
            this.card = document.getElementById("configContainer");
            this.apply(orientation, scale);
            var reapply = function () {
              self.apply(self.orientation, self.scale);
            };
            window.addEventListener("resize", reapply);
            window.addEventListener("orientationchange", reapply);
            window.addEventListener("load", reapply);
            window.addEventListener("pageshow", reapply);
            setInterval(reapply, WATCH_MS);
          },

          /**
           * Gira la página y escala la tarjeta para que ocupe FIT_RATIO del
           * espacio (responsive: agranda en pantallas grandes, reduce en
           * pequeñas). Solo toca el DOM si cambió la orientación, el tamaño
           * de la ventana o el de la tarjeta. Con la ventana 0x0 no aplica.
           * @param {number|null} orientation 0, 90, 180 o 270 (null => 0).
           * @param {number|null} scale       % sobre el ajuste (null => 100).
           */
          apply: function (orientation, scale) {
            this.orientation = orientation === null ? 0 : orientation;
            this.scale = scale === null || scale === undefined ? 100 : scale;
            orientation = this.orientation;

            var width =
              window.innerWidth || document.documentElement.clientWidth;
            var height =
              window.innerHeight || document.documentElement.clientHeight;
            if (!width || !height) return;
            var state =
              orientation +
              "|" +
              this.scale +
              "|" +
              width +
              "x" +
              height +
              "|" +
              this.card.offsetWidth +
              "x" +
              this.card.offsetHeight;
            if (state === this._lastState) return;
            this._lastState = state;

            var stageWidth = width;
            var stageHeight = height;
            var transform = "none";

            // Para cada giro: medidas del escenario y desplazamiento que lo devuelve a la pantalla
            if (orientation === 90) {
              stageWidth = height;
              stageHeight = width;
              transform = "translate(" + width + "px, 0px) rotate(90deg)";
            } else if (orientation === 180) {
              transform =
                "translate(" + width + "px, " + height + "px) rotate(180deg)";
            } else if (orientation === 270) {
              stageWidth = height;
              stageHeight = width;
              transform = "translate(0px, " + height + "px) rotate(270deg)";
            }

            this.stage.style.width = stageWidth + "px";
            this.stage.style.height = stageHeight + "px";
            this.stage.style.transformOrigin = "0 0";
            this.stage.style.transform = transform;

            // Ajuste a pantalla: offsetWidth/Height miden la tarjeta SIN transformaciones
            var fit = Math.min(
              (stageWidth * FIT_RATIO) / this.card.offsetWidth,
              (stageHeight * FIT_RATIO) / this.card.offsetHeight,
            );
            // Igual que loading.html: la escala multiplica el ajuste (100 % = FIT_RATIO)
            this.scaler.style.transform =
              "scale(" + ((fit * this.scale) / 100).toFixed(4) + ")";
          },
        };

        /**
         * Vista previa: gira el contenido a la orientación global EN EDICIÓN,
         * para ver hacia dónde quedarán todas las pantallas. El tamaño es el
         * de esta pantalla (OWN_SCALE_KEY, definido en loading.html).
         */
        function applyOwnLayout() {
          layoutManager.apply(current.orientation, ownScale);
        }

        /**
         * Vuelve a leer de localStorage la orientación e idioma globales, la
         * liga, la escala para la app, el tamaño de esta pantalla y los datos
         * de la cabecera. Así se ve lo que guardó otra página aunque esta se
         * haya cargado antes (WebView oculto en la app).
         * Si hay cambios sin guardar no se tocan: se respeta lo que se edita
         * (el tamaño de esta pantalla sí, porque aquí no se edita).
         */
        function reloadFromStorage() {
          renderInfo();
          var own = readOwnScale();
          if (own !== ownScale) {
            ownScale = own;
            applyOwnLayout();
          }
          if (isDirty()) return;
          var orientation = readSavedOrientation();
          var language = readSavedLanguage();
          var league = readSavedLeague();
          var scale = readSavedScale();
          if (
            orientation === saved.orientation &&
            language === saved.language &&
            league === saved.league &&
            scale === saved.scale
          )
            return;
          saved.orientation = orientation;
          saved.language = language;
          saved.league = league;
          saved.scale = scale;
          copyConfig(saved, current);
          render();
        }

        /* ==================================================================
           5. LÓGICA DE CONFIGURACIÓN
           ================================================================== */

        /**
         * Normaliza una orientación. Acepta números o textos numéricos;
         * 360 = 0 y los negativos se normalizan (-90 equivale a 270).
         * @param {*} value
         * @returns {number|null} Grados válidos, o null si no es válido.
         */
        function normalizeOrientation(value) {
          if (value === undefined || value === null || value === "")
            return null;
          var degrees = parseInt(value, 10);
          if (isNaN(degrees)) return null;
          degrees = ((degrees % 360) + 360) % 360; // lleva cualquier valor al rango 0-359
          return ORIENTATIONS.indexOf(degrees) === -1 ? null : degrees;
        }

        /**
         * Lee un valor de localStorage.
         * @param {string} key
         * @returns {string|null} null si no existe o el WebView no permite localStorage.
         */
        function readStorage(key) {
          try {
            return window.localStorage.getItem(key);
          } catch (e) {
            console.log("No se pudo leer localStorage:", e);
            return null;
          }
        }

        /**
         * Escribe un valor en localStorage y comprueba que quedó guardado.
         * @param {string} key
         * @param {string} value
         * @returns {boolean} true si se guardó.
         */
        function writeStorage(key, value) {
          try {
            window.localStorage.setItem(key, value);
            return window.localStorage.getItem(key) === value;
          } catch (e) {
            console.log("No se pudo escribir localStorage:", e);
            return false;
          }
        }

        /**
         * Valida una opción de ligas.
         * @param {*} value Clave de LEAGUE_OPTIONS (mlb, nba, nflnhl, none).
         * @returns {string|null} La clave si es válida, o null.
         */
        function normalizeLeague(value) {
          // Sin distinguir mayúsculas, igual que loading.html ("NBA" => "nba")
          var option =
            typeof value === "string" ? value.trim().toLowerCase() : "";
          return Object.prototype.hasOwnProperty.call(LEAGUE_OPTIONS, option)
            ? option
            : null;
        }

        /**
         * Lee de localStorage los datos de solo lectura (version, url, email, deviceId).
         * @returns {{version:?string, url:?string, email:?string, deviceId:?string}}
         *          null en los que no existen o están vacíos.
         */
        function readInfo() {
          var info = {};
          for (var name in INFO_KEYS) {
            if (!Object.prototype.hasOwnProperty.call(INFO_KEYS, name))
              continue;
            var value = null;
            try {
              value = window.localStorage.getItem(INFO_KEYS[name]);
            } catch (e) {
              console.log("No se pudo leer localStorage:", e);
            }
            value = value === null ? "" : String(value).trim();
            info[name] = value !== "" ? value : null;
          }
          return info;
        }

        /**
         * Lee la opción de ligas guardada en localStorage.
         * @returns {string|null} Clave guardada, o null si no hay ninguna
         *          (o si el WebView no permite localStorage).
         */
        function readSavedLeague() {
          return normalizeLeague(readStorage(LEAGUE_KEY));
        }

        /**
         * Valida una escala.
         * @param {*} value Porcentaje (número o texto numérico).
         * @returns {number|null} Porcentaje entero dentro de SCALE_LIMITS, o null si no es válido.
         */
        function normalizeScale(value) {
          var percent = parseInt(value, 10);
          if (
            isNaN(percent) ||
            percent < SCALE_LIMITS.min ||
            percent > SCALE_LIMITS.max
          )
            return null;
          return percent;
        }

        /**
         * Valida un idioma (sin distinguir mayúsculas: "EN" => "en").
         * @param {*} value Clave de I18N.
         * @returns {string|null} La clave si es válida, o null.
         */
        function normalizeLanguage(value) {
          var code =
            typeof value === "string" ? value.trim().toLowerCase() : "";
          return Object.prototype.hasOwnProperty.call(I18N, code) ? code : null;
        }

        /** @returns {string|null} Idioma global guardado (null si no existe). */
        function readSavedLanguage() {
          return normalizeLanguage(readStorage(LANGUAGE_KEY));
        }

        /**
         * Texto traducido al idioma EN EDICIÓN (vista previa). Si el idioma
         * aún no existe se usa DISPLAY_LANGUAGE; si falta la clave, el español.
         * @param {string} key Clave de I18N.
         * @returns {string}
         */
        function t(key) {
          var dict = I18N[current.language || DISPLAY_LANGUAGE];
          if (Object.prototype.hasOwnProperty.call(dict, key)) return dict[key];
          return Object.prototype.hasOwnProperty.call(I18N.es, key)
            ? I18N.es[key]
            : key;
        }

        /**
         * Pone en el HTML los textos fijos del idioma en edición: los
         * elementos con data-i18n (texto) y data-i18n-aria (aria-label),
         * el título del documento y <html lang>. Solo toca el DOM si el
         * idioma cambió.
         * @returns {boolean} true si cambió el idioma aplicado.
         */
        function applyLanguage() {
          var lang = current.language || DISPLAY_LANGUAGE;
          if (lang === appliedLanguage) return false;
          appliedLanguage = lang;
          var i;
          var nodes = document.querySelectorAll("[data-i18n]");
          for (i = 0; i < nodes.length; i++) {
            nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
          }
          nodes = document.querySelectorAll("[data-i18n-aria]");
          for (i = 0; i < nodes.length; i++) {
            nodes[i].setAttribute(
              "aria-label",
              t(nodes[i].getAttribute("data-i18n-aria")),
            );
          }
          document.title = t("title");
          document.documentElement.lang = lang;
          return true;
        }

        /** @returns {number|null} Orientación global guardada (null si no existe). */
        function readSavedOrientation() {
          return normalizeOrientation(readStorage(ORIENTATION_KEY));
        }

        /** @returns {number|null} Escala para la app guardada (null si no existe). */
        function readSavedScale() {
          return normalizeScale(readStorage(SCALE_KEY));
        }

        /** @returns {number|null} Tamaño de esta pantalla (solo lectura; null si no existe). */
        function readOwnScale() {
          return normalizeScale(readStorage(OWN_SCALE_KEY));
        }

        /** @returns {boolean} true si lo que hay en pantalla difiere de lo guardado. */
        function isDirty() {
          return (
            current.orientation !== saved.orientation ||
            current.language !== saved.language ||
            current.league !== saved.league ||
            current.scale !== saved.scale
          );
        }

        /**
         * Sube o baja la escala para la app (botones − / +), sin pasar de
         * SCALE_LIMITS. Solo cambia el número: no cambia el tamaño de ninguna
         * pantalla ni envía nada.
         * @param {number} delta Cuánto sumar (SCALE_LIMITS.step o -SCALE_LIMITS.step).
         */
        function changeScale(delta) {
          // Si la clave no existe se parte de SCALE_START (no se guarda hasta "Guardar")
          var base = current.scale === null ? SCALE_START : current.scale;
          var scale = Math.min(
            SCALE_LIMITS.max,
            Math.max(SCALE_LIMITS.min, base + delta),
          );
          if (scale === current.scale) return;
          current.scale = scale;
          justSaved = false;
          saveError = false;
          render();
        }

        /**
         * Cambia la opción de ligas en pantalla. No envía nada a la app.
         * @param {string} value Clave de LEAGUE_OPTIONS.
         */
        function setLeague(value) {
          var league = normalizeLeague(value);
          if (league === null || league === current.league) return;
          current.league = league;
          justSaved = false;
          saveError = false;
          render();
        }

        /**
         * Cambia el idioma GLOBAL (vale para todas las pantallas). Esta
         * página se traduce en vivo (vista previa). No envía nada; se guarda
         * con "Guardar" y las demás pantallas lo leen de localStorage.
         * @param {string} value Clave de I18N (es, en).
         */
        function setLanguage(value) {
          var language = normalizeLanguage(value);
          if (language === null || language === current.language) return;
          current.language = language;
          justSaved = false;
          saveError = false;
          render(); // render() traduce la página
        }

        /**
         * Cambia la orientación GLOBAL (vale para todas las pantallas). La
         * página gira en vivo hacia ella (vista previa). No envía nada.
         * @param {*} value Grados.
         */
        function setOrientation(value) {
          var degrees = normalizeOrientation(value);
          if (degrees === null || degrees === current.orientation) return;
          current.orientation = degrees;
          justSaved = false;
          saveError = false;
          render(); // render() aplica la vista previa de esta pantalla
        }

        /**
         * "Guardar": escribe la orientación e idioma globales, la opción de
         * ligas y la escala para la app en localStorage (las leen las demás
         * páginas y la app). El tamaño de las pantallas NO se toca aquí.
         * Solo escribe los que tienen valor: un setting que no existe y que el
         * usuario no eligió se deja sin crear (los valores por defecto son
         * cosa de loading.html).
         * No envía nada a la app: el resultado se informa al pulsar "Salir".
         */
        function saveConfig() {
          var stored =
            (current.orientation === null ||
              writeStorage(ORIENTATION_KEY, String(current.orientation))) &&
            (current.language === null ||
              writeStorage(LANGUAGE_KEY, current.language)) &&
            (current.league === null ||
              writeStorage(LEAGUE_KEY, current.league)) &&
            (current.scale === null ||
              writeStorage(SCALE_KEY, String(current.scale)));
          if (stored) {
            copyConfig(current, saved);
            justSaved = true;
            saveError = false;
            savedThisSession = true;
          } else {
            saveError = true;
          }
          render();
        }

        /**
         * "Salir": ÚNICO punto que envía un JSON a la app.
         * Los cambios sin guardar se descartan (la pantalla vuelve a lo
         * guardado) y se informa la configuración GUARDADA:
         *   status "saved"     => en esta visita se guardó la configuración.
         *   status "unchanged" => no se guardó nada en esta visita.
         *   status "error"     => el último intento de guardar falló.
         *   orientation       => orientación global guardada (null si no existe).
         *   language          => idioma global guardado (null si no existe).
         *   scale             => escala para la app guardada
         *                        (como factor 0.8, 1...; null si no existe).
         *   league / leagues  => opción guardada y sus ligas ("" = todas; null si no existe).
         * Si internet aún no se verificó, espera el resultado (máx. EXIT_WAIT_MS)
         * para que "internetStatus" sea real. La app debe cerrar esta pantalla al recibirlo.
         */
        function exitConfig() {
          if (exiting) return; // ya se está saliendo (OK pulsado dos veces)
          if (internetStatus === "unknown") {
            exiting = true;
            el.status.textContent = t("status.checking");
            var done = false;
            var finish = function () {
              if (done) return;
              done = true;
              exiting = false;
              sendExit();
            };
            runCheck(true).then(finish);
            setTimeout(finish, EXIT_WAIT_MS);
            return;
          }
          sendExit();
        }

        /** Descarta cambios sin guardar y envía el JSON de "Salir". */
        function sendExit() {
          var status = saveError
            ? "error"
            : savedThisSession
              ? "saved"
              : "unchanged";
          if (isDirty()) {
            // Descartar cambios sin guardar: volver a lo guardado
            copyConfig(saved, current);
            render();
          }
          send("exit", status, {
            orientation: saved.orientation, // global (null si no existe)
            language: saved.language, // global (null si no existe)
            league: saved.league,
            leagues:
              saved.league === null
                ? null
                : LEAGUE_OPTIONS[saved.league].values,
            scale: toZoom(saved.scale), // escala para la app (factor)
          });
        }

        /* ==================================================================
           6. UI (refleja el estado en pantalla)
           ================================================================== */

        /** Actualiza los botones de orientación y de ligas, y el mensaje de estado. */
        function render() {
          var i;

          // Idioma (vista previa): si cambió, traducir los textos fijos y la cabecera
          if (applyLanguage()) {
            renderInfo();
            renderNet();
          }
          for (i = 0; i < el.langButtons.length; i++) {
            el.langButtons[i].classList.toggle(
              "selected",
              el.langButtons[i].getAttribute("data-language") ===
                current.language,
            );
          }
          el.langTitle.textContent =
            t("lang.title") +
            (current.language === null ? t("unsetSuffix") : "");

          el.orientTitle.textContent = t("orient.title");

          // Botón de la orientación elegida (global)
          for (i = 0; i < el.orientButtons.length; i++) {
            var o = parseInt(
              el.orientButtons[i].getAttribute("data-orientation"),
              10,
            );
            el.orientButtons[i].classList.toggle(
              "selected",
              o === current.orientation,
            );
          }

          // Opción de ligas elegida y sus valores
          for (i = 0; i < el.leagueButtons.length; i++) {
            el.leagueButtons[i].classList.toggle(
              "selected",
              el.leagueButtons[i].getAttribute("data-league") ===
                current.league,
            );
          }
          el.leagueValues.innerHTML = "";
          if (current.league === null) {
            el.leagueValues.textContent = t("unset");
          } else {
            var option = LEAGUE_OPTIONS[current.league];
            var label = document.createElement("b");
            // "TODOS" se traduce; MLB, NBA... son nombres propios
            label.textContent =
              (current.league === "todos" ? t("league.all") : option.label) +
              ": ";
            el.leagueValues.appendChild(label);
            el.leagueValues.appendChild(
              document.createTextNode(
                option.values === ""
                  ? t("league.allValues")
                  : option.values.split(",").join(", "),
              ),
            );
          }

          // Escala para la app elegida
          if (current.scale === null) {
            el.scaleValue.textContent = "—";
            el.scaleNote.textContent = t("unset");
          } else {
            el.scaleValue.textContent = current.scale + "%";
            el.scaleNote.textContent = t("scale.note") + toZoom(current.scale);
          }
          if (current.orientation === null) {
            el.orientTitle.textContent += t("unsetSuffix");
          }

          // Mensaje de estado
          el.status.classList.remove("dirty", "saved");
          if (saveError) {
            el.status.textContent = t("status.error");
            el.status.classList.add("dirty");
          } else if (isDirty()) {
            el.status.textContent = t("status.dirty");
            el.status.classList.add("dirty");
          } else if (justSaved) {
            el.status.textContent = t("status.saved");
            el.status.classList.add("saved");
          } else {
            el.status.textContent = "";
          }

          // Vista previa de esta pantalla y reajuste (el contenido pudo cambiar de tamaño)
          if (layoutManager.stage) applyOwnLayout();
        }

        /** Muestra versión, web, email e id leídos de localStorage (solo lectura). */
        function renderInfo() {
          var info = readInfo();
          el.version.textContent = info.version
            ? t("version") + info.version
            : "";
          el.website.textContent = info.url ? " · " + info.url : "";
          el.email.textContent = info.email ? " · " + info.email : "";
          el.deviceId.textContent = info.deviceId
            ? t("id") + info.deviceId
            : "";
        }

        /** Actualiza el indicador de internet de la cabecera. */
        function renderNet() {
          el.net.className =
            "net " + (internetStatus === "unknown" ? "" : internetStatus);
          el.netText.textContent =
            internetStatus === "online"
              ? t("net.online")
              : internetStatus === "offline"
                ? t("net.offline")
                : t("net.checking");
        }

        /* ==================================================================
           7. TECLADO Y CONTROL REMOTO
           Pensado para una TV montada GIRADA físicamente: quien la mira lee
           el texto derecho. Por eso las flechas siguen al CONTENIDO tal como
           se lee, en cualquier orientación (0°, 90°, 180° o 270°):
             → botón de la derecha    ← botón de la izquierda
             ↑ fila de arriba         ↓ fila de abajo

           Cómo: las posiciones se miden SIN el giro de la página
           (offsetLeft/offsetTop ignoran las transformaciones CSS), así el
           resultado es el mismo en las 4 orientaciones.
           ================================================================== */

        /** Flechas según e.key (teclado y WebView modernos). */
        var KEY_DIRECTIONS = {
          ArrowUp: "up",
          ArrowDown: "down",
          ArrowLeft: "left",
          ArrowRight: "right",
          Up: "up",
          Down: "down",
          Left: "left",
          Right: "right", // nombres antiguos
        };

        /** Flechas según e.keyCode (por si e.key no viene informado). */
        var KEYCODE_DIRECTIONS = {
          37: "left",
          38: "up",
          39: "right",
          40: "down", // flechas del teclado / WebView
          21: "left",
          19: "up",
          22: "right",
          20: "down", // KEYCODE_DPAD_* de Android
        };

        /**
         * Traduce una tecla a dirección.
         * @param {KeyboardEvent} e
         * @returns {string|null} 'up' | 'down' | 'left' | 'right', o null si no es una flecha.
         */
        function getDirection(e) {
          return KEY_DIRECTIONS[e.key] || KEYCODE_DIRECTIONS[e.keyCode] || null;
        }

        /**
         * @param {KeyboardEvent} e
         * @returns {boolean} true si es una tecla de "aceptar":
         *          Enter, Espacio u OK del control remoto (DPAD_CENTER = 23).
         */
        function isOkKey(e) {
          return (
            e.key === "Enter" ||
            e.key === " " ||
            e.key === "Spacebar" ||
            e.key === "Select" ||
            e.keyCode === 13 ||
            e.keyCode === 32 ||
            e.keyCode === 23
          );
        }

        /**
         * Centro del elemento en coordenadas del CONTENIDO, tal como se lee
         * (sin el giro de la página). offsetLeft/offsetTop ignoran las
         * transformaciones CSS, así que da lo mismo en cualquier orientación.
         * @returns {{x:number, y:number}}
         */
        function contentCenter(element) {
          var x = element.offsetWidth / 2;
          var y = element.offsetHeight / 2;
          for (var node = element; node; node = node.offsetParent) {
            x += node.offsetLeft;
            y += node.offsetTop;
          }
          return { x: x, y: y };
        }

        /**
         * Busca el botón más cercano en una dirección del contenido.
         * Puntuación = distancia en la dirección pedida + 4 × desvío lateral,
         * así se prefiere el botón que está "en línea" (misma fila o columna)
         * antes que uno en diagonal, aunque esté más lejos.
         * @param {HTMLElement} from Botón con el foco.
         * @param {string} dir 'up' | 'down' | 'left' | 'right' (tal como se pulsó).
         * @returns {HTMLElement|null} null si no hay ninguno en esa dirección (borde).
         */
        function findNeighbor(from, dir) {
          var a = contentCenter(from);
          var best = null;
          var bestScore = Infinity;

          for (var i = 0; i < el.focusables.length; i++) {
            var btn = el.focusables[i];
            if (btn === from || btn.disabled) continue;

            var c = contentCenter(btn);
            var dx = c.x - a.x;
            var dy = c.y - a.y;
            var along =
              dir === "right"
                ? dx
                : dir === "left"
                  ? -dx
                  : dir === "down"
                    ? dy
                    : -dy;
            var across =
              dir === "left" || dir === "right" ? Math.abs(dy) : Math.abs(dx);
            if (along < 1) continue; // no está en esa dirección
            if (across > along) continue; // está más "al costado" que en la dirección (diagonal)

            var score = along + across * 4;
            if (score < bestScore) {
              best = btn;
              bestScore = score;
            }
          }
          return best;
        }

        /** Pone el foco en el botón de la orientación actual (punto de partida). */
        function focusDefault() {
          // Sin orientación guardada (null) => primer botón
          var index = ORIENTATIONS.indexOf(current.orientation);
          el.orientButtons[index === -1 ? 0 : index].focus();
        }

        /**
         * Mueve el foco en una dirección del contenido. Si ningún botón
         * tiene el foco (por ejemplo tras un clic en el fondo), lo recupera.
         * @param {string} dir 'up' | 'down' | 'left' | 'right'
         */
        function moveFocus(dir) {
          var from = document.activeElement;
          if (el.focusables.indexOf(from) === -1) {
            focusDefault();
            return;
          }
          var target = findNeighbor(from, dir);
          if (target) target.focus();
        }

        /**
         * Atiende el teclado y el control remoto:
         *   Flechas        mover el foco según el contenido tal como se lee.
         *   OK/Enter/Espacio  pulsar el botón con foco (mantenerla no repite).
         *   1 a 4          elegir 0°, 90°, 180° o 270° directamente.
         *   Esc            llevar el foco a "Salir" (no sale: hay que pulsar OK).
         */
        function onKeyDown(e) {
          var dir = getDirection(e);
          if (dir) {
            e.preventDefault(); // evita que la página se desplace
            moveFocus(dir);
            return;
          }

          if (isOkKey(e)) {
            e.preventDefault(); // evita el "clic" nativo (sería una pulsación doble)
            if (e.repeat) return; // mantener OK pulsado no repite la acción
            var active = document.activeElement;
            if (el.focusables.indexOf(active) !== -1) active.click();
            else focusDefault();
            return;
          }

          // Atajos numéricos: 1 = 0°, 2 = 90°, 3 = 180°, 4 = 270°
          var n = parseInt(e.key, 10);
          if (n >= 1 && n <= ORIENTATIONS.length) {
            e.preventDefault();
            setOrientation(ORIENTATIONS[n - 1]);
            el.orientButtons[n - 1].focus();
            return;
          }

          if (e.key === "Escape" || e.key === "Esc" || e.keyCode === 27) {
            e.preventDefault();
            el.exitBtn.focus();
          }
        }

        /* ==================================================================
           8. CONEXIÓN A INTERNET (mismo método que fingerprint.html)
           Ciclo: runCheck() -> probeInternet() -> applyResult()
                  -> setInternetStatus() -> scheduleNextCheck()
           ================================================================== */

        /**
         * Comprueba que el contenido recibido sea realmente el esperado del servidor de internet.
         * @param {string} type "dns" | "ip"
         * @param {string} text Cuerpo de la respuesta.
         * @returns {boolean}
         */
        function validateResponse(type, text) {
          try {
            var data = JSON.parse(text);
            if (type === "dns") {
              return (
                !!data &&
                data.Status === 0 &&
                Array.isArray(data.Answer) &&
                data.Answer.length > 0
              );
            }
            if (type === "ip") {
              return (
                !!data &&
                typeof data.ip === "string" &&
                /^[0-9a-fA-F:.]{7,45}$/.test(data.ip)
              );
            }
          } catch (e) {
            /* respuesta no JSON = no es internet real */
          }
          return false;
        }

        /**
         * Prueba UN servidor.
         * @param {{url:string, type:string}} ep
         * @param {number} timeoutMs
         * @returns {Promise<boolean>} true solo si respondió 200 Y el contenido es el esperado.
         */
        function pingEndpoint(ep, timeoutMs) {
          return new Promise(function (resolve) {
            var done = false;
            var xhr = null;
            var timer = setTimeout(function () {
              finish(false);
            }, timeoutMs);

            // Termina una sola vez (respuesta, error o tiempo agotado)
            function finish(ok) {
              if (done) return;
              done = true;
              clearTimeout(timer);
              if (!ok && xhr) {
                try {
                  xhr.abort();
                } catch (e) {
                  /* ignorar */
                }
              }
              resolve(ok);
            }

            try {
              var sep = ep.url.indexOf("?") === -1 ? "?" : "&";
              // Parámetro aleatorio para evitar respuestas en caché (falso "online")
              var pad = Math.random().toString(36).slice(2, 12);
              xhr = new XMLHttpRequest();
              xhr.open("GET", ep.url + sep + "random_padding=" + pad, true);
              xhr.timeout = timeoutMs;
              if (ep.type === "dns")
                xhr.setRequestHeader("Accept", "application/dns-json");
              xhr.onload = function () {
                finish(
                  xhr.status === 200 &&
                    validateResponse(ep.type, xhr.responseText),
                );
              };
              xhr.onerror = function () {
                finish(false);
              };
              xhr.ontimeout = function () {
                finish(false);
              };
              xhr.onabort = function () {
                finish(false);
              };
              xhr.send();
            } catch (e) {
              finish(false);
            }
          });
        }

        /**
         * Prueba todos los servidores en paralelo; basta con que uno sea válido.
         * @returns {Promise<boolean>} true si hay internet.
         */
        function probeInternet() {
          var eps = CONNECTION_CONFIG.endpoints;
          return new Promise(function (resolve) {
            var pending = eps.length;
            var resolved = false;
            if (!pending) {
              resolve(false);
              return;
            }
            eps.forEach(function (ep) {
              pingEndpoint(ep, CONNECTION_CONFIG.timeoutMs).then(function (ok) {
                if (resolved) return;
                if (ok) {
                  resolved = true;
                  resolve(true);
                } else if (--pending === 0) {
                  resolved = true;
                  resolve(false);
                }
              });
            });
          });
        }

        /**
         * Cambia el estado de internet y actualiza la cabecera. No envía nada
         * a la app: el estado viaja en "internetStatus" del JSON de "Salir".
         * @param {string} next 'online' | 'offline'
         */
        function setInternetStatus(next) {
          if (next === internetStatus) return;
          internetStatus = next;
          renderNet();
        }

        /**
         * Decide el nuevo estado. Histéresis: un fallo aislado no declara
         * "offline"; un éxito sí declara "online".
         * @param {boolean} ok        Resultado de la verificación.
         * @param {boolean} immediate true = aplicar sin histéresis.
         */
        function applyResult(ok, immediate) {
          if (ok) {
            failures = 0;
            setInternetStatus("online");
          } else {
            failures++;
            if (
              immediate ||
              internetStatus !== "online" ||
              failures >= CONNECTION_CONFIG.failuresToOffline
            ) {
              setInternetStatus("offline");
            }
          }
        }

        /** Programa la próxima verificación según el estado. */
        function scheduleNextCheck() {
          var delay;
          if (internetStatus === "online") {
            delay =
              failures > 0
                ? CONNECTION_CONFIG.retryIntervalMs
                : CONNECTION_CONFIG.onlineIntervalMs;
          } else {
            delay = CONNECTION_CONFIG.offlineIntervalMs;
          }
          clearTimeout(checkTimer);
          checkTimer = setTimeout(function () {
            runCheck(false);
          }, delay);
        }

        /**
         * Ejecuta una verificación real (sin solapes: si ya hay una en curso,
         * devuelve esa misma).
         * @param {boolean} immediate true = aplicar el resultado sin histéresis.
         * @returns {Promise<boolean>} true si hay internet.
         */
        function runCheck(immediate) {
          if (currentCheck) return currentCheck;

          clearTimeout(checkTimer);

          // Sin red local (Wi-Fi/cable desconectado) no hace falta consultar servidores
          if (!navigator.onLine) {
            lastLatency = 0;
            applyResult(false, true);
            scheduleNextCheck();
            return Promise.resolve(false);
          }

          var started = Date.now();
          currentCheck = probeInternet().then(function (ok) {
            currentCheck = null;
            lastLatency = Date.now() - started;
            applyResult(ok, !!immediate);
            scheduleNextCheck();
            return internetStatus === "online";
          });
          return currentCheck;
        }

        /** Escucha los eventos de red y hace la primera verificación. */
        function startConnectionMonitoring() {
          // Los eventos del navegador solo disparan una verificación real
          window.addEventListener("online", function () {
            runCheck(false);
          });
          window.addEventListener("offline", function () {
            runCheck(false);
          });
          document.addEventListener("visibilitychange", function () {
            if (!document.hidden) runCheck(false);
          });
          if (navigator.connection && navigator.connection.addEventListener) {
            navigator.connection.addEventListener("change", function () {
              runCheck(false);
            });
          }
          runCheck(false);
        }

        /* ==================================================================
           9. API PÚBLICA (llamada desde Kodular con RunJavaScript)
           Ver la lista completa en "FUNCIONES PUBLICAS" al inicio del archivo.
           ================================================================== */

        // updateData() de example2.html ya no existe: versión, web, email e id
        // se leen de localStorage (los crea loading.html y se modifican con
        // su updateSettings()).

        /** @returns {string} JSON con la configuración en pantalla:
            {"orientation":90,"language":"en","scale":1,
             "league":"mlb","leagues":"LIDOM,MLB,..."}
            (scale = escala para la app como factor; null en lo que no existe) */
        window.getConfig = function () {
          return JSON.stringify({
            orientation: current.orientation,
            language: current.language,
            scale: toZoom(current.scale),
            league: current.league,
            leagues:
              current.league === null
                ? null
                : LEAGUE_OPTIONS[current.league].values,
          });
        };

        window.saveConfig = saveConfig;
        window.exitConfig = exitConfig;

        // Fuerza una verificación real (no envía nada a la app).
        // Devuelve el último estado conocido ('online' | 'offline' | 'unknown').
        window.checkConnection = function () {
          runCheck(true);
          return internetStatus;
        };

        // Versión asíncrona: Promise<boolean> con el resultado real.
        window.checkConnectionAsync = function () {
          return runCheck(true);
        };

        /* ==================================================================
           10. INICIO
           ================================================================== */

        /** Arranca la pantalla. Se ejecuta una sola vez, cuando el HTML está listo. */
        function init() {
          el.orientTitle = document.getElementById("orientTitle");
          el.langTitle = document.getElementById("langTitle");
          el.langButtons = Array.prototype.slice.call(
            document.querySelectorAll(".lang"),
          );
          el.orientButtons = Array.prototype.slice.call(
            document.querySelectorAll(".orient"),
          );
          el.leagueButtons = Array.prototype.slice.call(
            document.querySelectorAll(".league"),
          );
          el.leagueValues = document.getElementById("leagueValues");
          el.scaleDownBtn = document.getElementById("scaleDownBtn");
          el.scaleUpBtn = document.getElementById("scaleUpBtn");
          el.scaleValue = document.getElementById("scaleValue");
          el.scaleNote = document.getElementById("scaleNote");
          el.status = document.getElementById("statusText");
          el.version = document.getElementById("versionText");
          el.website = document.getElementById("websiteUrl");
          el.email = document.getElementById("emailContact");
          el.deviceId = document.getElementById("deviceIdText");
          el.net = document.getElementById("netStatus");
          el.netText = document.getElementById("netText");

          el.saveBtn = document.getElementById("saveBtn");
          el.exitBtn = document.getElementById("exitBtn");

          // Botones a los que se llega con las flechas
          el.focusables = el.orientButtons.concat(
            el.langButtons,
            el.leagueButtons,
            [el.scaleDownBtn, el.scaleUpBtn, el.saveBtn, el.exitBtn],
          );

          // Clics / toques / OK del control remoto
          el.orientButtons.forEach(function (btn) {
            btn.addEventListener("click", function () {
              setOrientation(btn.getAttribute("data-orientation"));
            });
          });
          el.langButtons.forEach(function (btn) {
            btn.addEventListener("click", function () {
              setLanguage(btn.getAttribute("data-language"));
            });
          });
          el.leagueButtons.forEach(function (btn) {
            btn.addEventListener("click", function () {
              setLeague(btn.getAttribute("data-league"));
            });
          });
          el.scaleDownBtn.addEventListener("click", function () {
            changeScale(-SCALE_LIMITS.step);
          });
          el.scaleUpBtn.addEventListener("click", function () {
            changeScale(SCALE_LIMITS.step);
          });
          el.saveBtn.addEventListener("click", saveConfig);
          el.exitBtn.addEventListener("click", exitConfig);
          document.addEventListener("keydown", onKeyDown);

          // El foco nunca debe perderse: un clic en el fondo no se lo quita a
          // los botones, y al volver a la app se recupera
          document.addEventListener("mousedown", function (e) {
            if (
              el.focusables.indexOf(
                e.target.closest ? e.target.closest(".btn") : null,
              ) === -1
            ) {
              e.preventDefault();
            }
          });
          window.addEventListener("focus", function () {
            if (el.focusables.indexOf(document.activeElement) === -1)
              focusDefault();
          });

          // Orientación e idioma globales, ligas y escala para la app. Si no
          // existen quedan en null ("Sin configurar"): esta página no crea defaults.
          saved.orientation = readSavedOrientation();
          saved.language = readSavedLanguage();
          saved.league = readSavedLeague();
          saved.scale = readSavedScale();
          copyConfig(saved, current);
          ownScale = readOwnScale(); // tamaño de esta pantalla (solo lectura)

          applyLanguage(); // textos en el idioma guardado antes de medir la tarjeta
          renderInfo();
          // Esta pantalla se muestra con la orientación global y SU tamaño (de loading.html)
          layoutManager.init(current.orientation, ownScale);
          render();
          renderNet();

          // Foco inicial en la orientación actual (para empezar a usar el teclado)
          focusDefault();

          // Releer localStorage al volver a mostrarse, si otra página lo cambia
          // y cada WATCH_MS (en la app la página puede cargarse oculta antes
          // de que loading.html cree o cambie los valores)
          window.addEventListener("pageshow", reloadFromStorage);
          window.addEventListener("storage", reloadFromStorage);
          document.addEventListener("visibilitychange", function () {
            if (!document.hidden) reloadFromStorage();
          });
          setInterval(reloadFromStorage, WATCH_MS);

          // No se envía nada al arrancar: el único JSON sale con el botón "Salir"
          startConnectionMonitoring();
          console.log("Pantalla de configuración cargada.");
        }

        // Si el HTML aún se está cargando, esperar; si no, arrancar ya
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
