<!doctype html>
<!--
=====================================================================
  SMART PIZARRA - EQUIPO SIN RUTA DE CONTENIDO
  URL: https://smartpizarra.cloud/none   (=> /none/, esta carpeta)
=====================================================================
  La abre la TV cuando su usuario NO tiene una ruta asignada en el panel
  (Gestión de Rutas): loading.html y las demás páginas guardan esta URL
  en smartpizarra.routeUrl como valor por defecto ("routeUrl" del JSON a
  la app), y la app la carga en lugar de la pizarra.

  PROTECCIÓN DE LA PANTALLA (2026-11-12): esta página puede quedarse
  horas en el TV, así que nada se queda quieto ni con el mismo color:
    - DESPLAZAMIENTO: cada DRIFT_MS (60 s) todo el bloque (icono, textos y
      marca) salta a una posición al azar alrededor del centro, dentro del
      espacio libre (como el anti-quemado de connection.html).
    - PALETAS: cada THEME_MS (10 min) cambia la paleta (fondo, título y
      dirección del degradado), para que ninguna zona muestre siempre el
      mismo color.
    - BRILLO MODERADO: sin blanco puro ni amarillo saturado (los colores
      brillantes y fijos son los que más marcan la pantalla).
  CPU: sin animaciones ni transiciones; la pantalla solo se redibuja
  cuando hay un cambio (una vez por minuto). Sin recursos externos.
  ES5 (Android WebView 101). Se adapta a horizontal o vertical (vmin).
  Texto en español e inglés.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Contenido no disponible - Smart Pizarra</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Roboto, "Segoe UI", Tahoma, Arial, sans-serif;
      }

      /* PALETAS (las rota el JS cada THEME_MS). Sin blanco puro ni colores
         saturados al máximo; el degradado cambia de dirección. */
      body,
      body.theme-0 {
        background: linear-gradient(135deg, #141a5e 0%, #251570 100%);
        color: rgba(236, 238, 248, 0.85);
      }

      body.theme-1 {
        background: linear-gradient(315deg, #0f3346 0%, #182660 100%);
        color: rgba(232, 242, 246, 0.85);
      }

      body.theme-2 {
        background: linear-gradient(45deg, #2e1546 0%, #1b1c58 100%);
        color: rgba(244, 236, 244, 0.85);
      }

      body .accent,
      body.theme-0 .accent {
        color: #e8bf62; /* amarillo suave (antes #ffd166) */
      }

      body.theme-1 .accent {
        color: #86c7e8; /* celeste */
      }

      body.theme-2 .accent {
        color: #eaa98a; /* coral suave */
      }

      /* Pantalla completa; el bloque se centra y el JS lo desplaza */
      main {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6vmin;
        font-size: 4vmin; /* sigue al lado corto: igual en horizontal y vertical */
      }

      /* Bloque que se mueve (transform: solo recompone, no redibuja el texto) */
      #box {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 100%;
      }

      /* Icono de aviso (SVG en línea, toma el color de .accent) */
      .icon {
        width: 18vmin;
        height: 18vmin;
        margin-bottom: 4vmin;
      }

      h1 {
        font-size: 2em;
        font-weight: 700;
        line-height: 1.2;
        margin-bottom: 0.6em;
      }

      .text {
        font-size: 1.15em;
        line-height: 1.45;
        max-width: 32em;
      }

      .text strong {
        font-weight: 700;
      }

      /* Versión en inglés, más discreta */
      .en {
        margin-top: 2.2em;
        font-size: 0.8em;
        max-width: 36em;
        opacity: 0.65;
      }

      .brand {
        margin-top: 3em;
        font-size: 0.7em;
        letter-spacing: 0.08em;
        opacity: 0.5;
      }
    </style>
  </head>
  <body class="theme-0">
    <main>
      <div id="box">
        <svg class="icon accent" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12 2 1 21h22L12 2zm0 4.6L19.5 19h-15L12 6.6zM11 10v5h2v-5h-2zm0 6v2h2v-2h-2z" />
        </svg>
        <h1 class="accent">Este equipo no puede mostrar el contenido</h1>
        <p class="text">
          No tiene un contenido asignado en este momento.<br />
          Por favor, <strong>comuníquese con su supervisor</strong>.
        </p>
        <p class="en">This device cannot display the content because it has no content assigned. Please contact your supervisor.</p>
        <p class="brand">SMART PIZARRA</p>
      </div>
    </main>

    <script>
      /* Protección de la pantalla (ver cabecera). ES5, sin animaciones. */
      (function () {
        "use strict";

        var DRIFT_MS = 60000; // cada cuánto se mueve el bloque
        var THEME_MS = 600000; // cada cuánto cambia la paleta
        var THEMES = 3; // body.theme-0 .. theme-2 (CSS)
        var MAX_SHIFT = 0.12; // desplazamiento máximo: 12 % del lado corto (y nunca fuera del espacio libre)
        var MIN_STEP = 0.03; // cada salto mueve al menos un 3 % del lado corto

        var box = document.getElementById("box");
        var main = document.querySelector("main");
        var x = 0;
        var y = 0;
        var theme = 0;

        /** Mueve el bloque a una posición al azar dentro del espacio libre. */
        function drift() {
          var short = Math.min(window.innerWidth, window.innerHeight);
          var pad = short * 0.06; // padding de <main> (6vmin)
          // Espacio libre a cada lado del bloque centrado
          var freeX = Math.max(0, (main.clientWidth - 2 * pad - box.offsetWidth) / 2);
          var freeY = Math.max(0, (main.clientHeight - 2 * pad - box.offsetHeight) / 2);
          var limX = Math.min(freeX + pad * 0.5, short * MAX_SHIFT);
          var limY = Math.min(freeY + pad * 0.5, short * MAX_SHIFT);
          var nx = x;
          var ny = y;
          // Buscar un punto nuevo suficientemente lejos del actual (pocos intentos)
          for (var i = 0; i < 6; i++) {
            nx = Math.round((Math.random() * 2 - 1) * limX);
            ny = Math.round((Math.random() * 2 - 1) * limY);
            if (Math.abs(nx - x) + Math.abs(ny - y) >= short * MIN_STEP) break;
          }
          x = nx;
          y = ny;
          box.style.transform = "translate(" + x + "px," + y + "px)";
        }

        /** Siguiente paleta de colores. */
        function nextTheme() {
          theme = (theme + 1) % THEMES;
          document.body.className = "theme-" + theme;
        }

        // Punto de partida al azar (cada vez que se abre, otro sitio y otra paleta)
        theme = Math.floor(Math.random() * THEMES);
        document.body.className = "theme-" + theme;
        drift();
        setInterval(drift, DRIFT_MS);
        setInterval(nextTheme, THEME_MS);
        // Al girar o cambiar el tamaño, recolocar dentro del nuevo espacio
        window.addEventListener("resize", drift);

        // Para pruebas desde la consola
        window.noneDrift = drift;
        window.noneNextTheme = nextTheme;
      })();
    </script>
  </body>
</html>
