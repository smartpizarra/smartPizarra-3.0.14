<!doctype html>
<!--
=====================================================================
  SMART PIZARRA - ANIMACIÓN DE CARGA (solo animación)
=====================================================================
  Extraída de example1.html. Contiene únicamente la parte visual:
  logo flotante, barra de progreso, texto, 4 pasos, puntos "..." y
  fundido final hacia la pantalla de bienvenida.

  NO incluye: comprobación de internet, updateData() ni envío de
  mensajes a la app (Kodular).

  SETTINGS COMPARTIDOS (localStorage)
  Al iniciar, esta página verifica cada setting en localStorage: si no
  existe o es inválido, lo crea con su valor por defecto. Luego aplica
  la rotación y la escala. Cualquier otra página del mismo origen
  puede leerlos o modificarlos con estas claves (valores en texto):

    clave                                valores              defecto
    smartpizarra.orientation             0 | 90 | 180 | 270   90  (GLOBAL: todas las pantallas)
    smartpizarra.loading.scale           10 a 300 (%)         85
    smartpizarra.config.scale            10 a 300 (%)         90
    smartpizarra.connection.scale        10 a 300 (%)         85
    smartpizarra.fingerprint.scale       10 a 300 (%)         85
    smartpizarra.mirror.scale            10 a 300 (%)         100
    (cada pantalla tiene escala propia: ver PAGES)
    smartpizarra.language                es | en              en  (GLOBAL: idioma de todas
                                                                   las pantallas; ver I18N)
    smartpizarra.scale                   10 a 300 (%)         100 (escala para la app: solo
                                                                   se guarda, la edita config.html;
                                                                   NO es el tamaño de una pantalla)
    smartpizarra.version / url / email / deviceId
    smartpizarra.routeUrl (ruta de su usuario, Gestión de Rutas del panel, con la LIGA del equipo
      dentro (leagues=...); JSON "routeUrl"). SIN RUTA => "http://localhost/none.html" (pantalla
      local none.html: el equipo no puede mostrar el contenido, comuníquese con su supervisor).
      La liga ya no se guarda aparte.
    smartpizarra.deviceSecret            64 hex               generado (no se muestra ni cambia)
    smartpizarra.apiUrl                  URL                  https://smartpizarra.cloud/api/device.php
    smartpizarra.authorized              "1" | "0"            "0" (lo fija el servidor)

  AUTORIZACIÓN EN smartpizarra.cloud (ver server/README.md)
  Al arrancar consulta api/device.php con deviceId + deviceSecret (si el
  equipo es nuevo queda registrado como pendiente) y guarda la bandera
  "smartpizarra.authorized". Así una revocación se detecta en el siguiente
  arranque. Sin respuesta del servidor la bandera no cambia. El JSON a la
  app lleva "authorized": true | false.
  La consulta va con event=boot: el servidor anota el arranque en el
  historial del equipo (panel > Historial) y refresca su "última conexión".
  El JSON también lleva "deviceId" y "deviceSecret": la app NATIVA los usa
  para enviar cada cierto tiempo su señal "online" a api/ping.php.

  CAMBIAR UN VALOR POR DEFECTO EN ESTE ARCHIVO
  Si se edita un default (ej. version "3.0.14" => "3.0.16"), al abrir esta
  página el nuevo default REEMPLAZA el valor guardado y lo ven todas las
  páginas. Los defaults que NO se editaron conservan el valor guardado
  (lo elegido en config.html o con updateSettings). Los defaults usados
  se anotan en "smartpizarra.defaults". deviceId nunca se reemplaza.
  La RUTA (routeUrl) tampoco: su default (http://localhost/none.html)
  solo se pone si la clave NO existe o no es válida (onlyIfMissing); el
  valor lo actualiza el servidor. La liga del
  equipo ya no se guarda: va dentro de la URL de la ruta (leagues=...).

  Si otra página los modifica, esta los vuelve a leer al recibir el
  evento "storage", al volver a mostrarse o al cambiar el tamaño.
  Agregar un setting nuevo => una entrada en CONFIG.settings.

  COMPATIBILIDAD (Android WebView 101 en TV box)
  - Sin librerías externas ni backdrop-filter (pesado en GPU).
  - La barra avanza con transform: scaleX (sin recalcular el layout).
  - El DOM solo se toca cuando cambia el texto o los pasos.

  COMO MODIFICAR
    Duración o cantidad de pasos         => objeto CONFIG.
    Textos / idiomas                     => I18N (los fijos del HTML llevan
                                            data-i18n="clave").
    Colores, tamaños o animaciones       => bloque <style>.
=====================================================================
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin zoom: en un WebView la pantalla de carga debe verse siempre igual -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cargando...</title>
    <script>
      // updateSettings() provisional: existe desde el <head> para que una
      // llamada de la app mientras la página aún carga no se pierda. Se
      // guarda y se procesa al ARRANCAR (ver final del script principal).
      window.updateSettings = function (jsonData) {
        (window.__pendingSettings = window.__pendingSettings || []).push(
          jsonData,
        );
        return '{"ok":true,"queued":true}';
      };
    </script>

    <style>
      /* ==============================================================
           1. BASE: reinicio de estilos y fondo de pantalla completa
           ============================================================== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent; /* sin resaltado azul al tocar */
      }

      /* height:100% y no 100vh: en WebView "vh" puede fallar cuando cambia la barra del sistema */
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #002b4f;
      }

      body {
        position: relative;
        font-family: "Segoe UI", Roboto, Tahoma, Geneva, Verdana, sans-serif;
        color: #ffffff;
        user-select: none; /* evita seleccionar texto por accidente */
      }

      /* #stage: se rota 0/90/180/270. Ancho, alto y transform los fija
         LayoutManager (se intercambian ancho/alto con 90 y 270) */
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* #scaler: recibe la escala desde su centro. Sin ancho fijo y sin
         encogerse, para que su tamaño sea el natural del contenido: así
         LayoutManager lo mide y calcula cuánto escalar para llenar la pantalla */
      #scaler {
        display: flex;
        justify-content: center;
        flex-shrink: 0;
        transform-origin: 50% 50%;
      }

      /* ==============================================================
           2. TARJETA DE CARGA
           ============================================================== */
      .splash-container {
        text-align: center;
        max-width: 100%;
        width: 400px;
        padding: 0 20px;
      }

      /* --- Logo con movimiento flotante --- */
      .logo {
        width: 120px;
        height: 120px;
        margin: 0 auto 30px;
        border-radius: 20px;
        background: linear-gradient(45deg, #2196f3, #21cbf3);
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 10px 30px rgba(33, 150, 243, 0.4);
        animation: float 3s ease-in-out infinite;
        will-change: transform; /* capa propia en GPU: animar no repinta el resto */
      }

      .logo-icon {
        font-size: 48px;
        font-weight: bold;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 5px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }

      /* --- Datos tomados de localStorage (InfoPanel) --- */

      /* Si un dato está vacío no ocupa espacio */
      .info:empty {
        display: none;
      }

      .version {
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 8px;
      }

      .website {
        font-size: 1.1rem;
        color: #00e5ff;
        margin-bottom: 8px;
        font-weight: 300;
        letter-spacing: 1px;
      }

      .system-id {
        /* id del dispositivo (si es largo se parte en líneas) */
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 8px;
        word-break: break-all;
      }

      .email-contact {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 8px;
      }

      /* --- Barra de progreso --- */
      .loading-container {
        /* riel gris de la barra */
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 22px;
        margin-bottom: 20px;
      }

      /* Ocupa el 100% del riel y el JS la "estira" con scaleX(0..1) */
      .loading-bar {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #00e5ff, #2979ff);
        transform: scaleX(0);
        transform-origin: 0 50%;
        transition: transform 0.1s linear;
        will-change: transform;
      }

      .progress-text {
        /* texto bajo la barra */
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.7);
        margin-top: 10px;
      }

      /* --- Lista de pasos --- */
      .loading-steps {
        margin-top: 30px;
        text-align: left;
        /* Fondo semitransparente en vez de backdrop-filter (pesado en TV box) */
        background: rgba(255, 255, 255, 0.12);
        padding: 20px;
        border-radius: 10px;
      }

      .step {
        /* paso aún no alcanzado */
        margin: 10px 0;
        display: flex;
        align-items: center;
        opacity: 0.5;
        transition: opacity 0.3s ease;
      }

      .step.active {
        /* paso alcanzado */
        opacity: 1;
        color: #00e5ff;
      }

      .step-check {
        margin-right: 10px;
        font-size: 1.2rem;
      }

      /* --- Puntos "..." del último paso: 3 <span> que parpadean en secuencia
           (no se anima "content" porque en WebView no es fiable) --- */
      .dots span {
        opacity: 0;
        animation: dotBlink 1.5s linear infinite;
      }
      .dots span:nth-child(2) {
        animation-delay: 0.25s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.5s;
      }

      /* Al terminar (clase "done") los puntos se detienen y se ocultan */
      .done .dots span {
        animation: none;
        opacity: 0;
      }

      /* ==============================================================
           3. PANTALLA FINAL DE BIENVENIDA (oculta hasta el final)
           ============================================================== */
      .welcome {
        display: none;
        text-align: center;
        padding: 20px;
      }
      .welcome h2 {
        margin-bottom: 10px;
      }
      .welcome p {
        color: #00e5ff;
      }

      /* ==============================================================
           4. ANIMACIONES (@keyframes)
           ============================================================== */

      /* Logo: sube y baja 15px */
      @keyframes float {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(0, -15px, 0);
        }
      }

      /* Puntos: aparecen y desaparecen */
      @keyframes dotBlink {
        0%,
        100% {
          opacity: 0;
        }
        20%,
        80% {
          opacity: 1;
        }
      }

      /* Salida: la tarjeta se desvanece */
      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* Duración debe coincidir con CONFIG.fadeOutMs */
      .fade-out {
        animation: fadeOut 0.5s ease forwards;
      }

      /* Accesibilidad: si el sistema pide menos movimiento, el logo no flota */
      @media (prefers-reduced-motion: reduce) {
        .logo {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- #stage => rotación · #scaler => escala (ambos desde los settings) -->
    <div id="stage">
      <div id="scaler">
        <!-- TARJETA DE CARGA -->
        <div class="splash-container" id="splashContainer">
          <div class="logo">
            <div class="logo-icon">SP</div>
          </div>
          <h1>Smart Pizarra</h1>

          <!-- Los llena InfoPanel con los valores de localStorage (CONFIG.settings) -->
          <div class="info version" id="versionText"></div>
          <div class="info website" id="websiteUrl"></div>
          <div class="info email-contact" id="emailContact"></div>
          <div class="info system-id" id="systemId"></div>

          <!-- Barra de progreso: LoadingAnimation cambia el scaleX de #loadingBar -->
          <div class="loading-container">
            <div class="loading-bar" id="loadingBar"></div>
          </div>
          <div class="progress-text" id="progressText"></div>

          <!-- Pasos: ids consecutivos step1..stepN (ajustar CONFIG.animation.totalSteps).
               El texto de cada paso (data-i18n) lo pone Translator según el idioma. -->
          <div class="loading-steps" id="loadingSteps">
            <div class="step active" id="step1">
              <span class="step-check">&#10003;</span>
              <span data-i18n="step1">Cargando configuración...</span>
            </div>
            <div class="step" id="step2">
              <span class="step-check">&#10003;</span>
              <span data-i18n="step2">Inicializando módulos...</span>
            </div>
            <div class="step" id="step3">
              <span class="step-check">&#10003;</span>
              <span data-i18n="step3">Preparando interfaz...</span>
            </div>
            <div class="step" id="step4">
              <span class="step-check">&#10003;</span>
              <span data-i18n="step4">Carga completa</span
              ><span class="dots"
                ><span>.</span><span>.</span><span>.</span></span
              >
            </div>
          </div>
        </div>

        <!-- PANTALLA DE BIENVENIDA: se muestra tras el fundido final -->
        <div class="welcome" id="welcome">
          <h2 data-i18n="welcome">¡Bienvenido a Smart Pizarra!</h2>
          <p class="info" id="welcomeUrl"></p>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        /**
         * parse() de los settings de texto: válido si no está vacío.
         * @param {string|null} raw Texto guardado en localStorage.
         * @returns {string|null} Texto sin espacios sobrantes, o null si falta o está vacío.
         */
        function parseText(raw) {
          const text = raw === null ? "" : String(raw).trim();
          return text !== "" ? text : null;
        }

        /**
         * Genera un id de dispositivo con el formato SP-XXXX-XXXX-XXXX
         * (12 dígitos hexadecimales, 48 bits aleatorios).
         * Usa crypto.getRandomValues (funciona también fuera de HTTPS, a
         * diferencia de crypto.randomUUID); si no existe, usa Math.random.
         * @returns {string}
         */
        function generateDeviceId() {
          const bytes = new Uint8Array(6);
          if (window.crypto && window.crypto.getRandomValues) {
            window.crypto.getRandomValues(bytes);
          } else {
            for (let i = 0; i < bytes.length; i++) {
              bytes[i] = Math.floor(Math.random() * 256);
            }
          }
          let hex = "";
          for (let i = 0; i < bytes.length; i++) {
            hex += (bytes[i] < 16 ? "0" : "") + bytes[i].toString(16);
          }
          hex = hex.toUpperCase();
          return (
            "SP-" +
            hex.slice(0, 4) +
            "-" +
            hex.slice(4, 8) +
            "-" +
            hex.slice(8, 12)
          );
        }

        /**
         * Genera el SECRETO del dispositivo: 64 caracteres hex (32 bytes).
         * Junto con el ID identifica al equipo ante smartpizarra.cloud: el ID
         * se ve en pantalla y en el QR, el secreto nunca se muestra.
         * Se crea una sola vez (como el ID) y no cambia.
         * @returns {string}
         */
        function generateDeviceSecret() {
          const bytes = new Uint8Array(32);
          if (window.crypto && window.crypto.getRandomValues) {
            window.crypto.getRandomValues(bytes);
          } else {
            for (let i = 0; i < bytes.length; i++) {
              bytes[i] = Math.floor(Math.random() * 256);
            }
          }
          let hex = "";
          for (let i = 0; i < bytes.length; i++) {
            hex += (bytes[i] < 16 ? "0" : "") + bytes[i].toString(16);
          }
          return hex;
        }

        /**
         * Orientación GLOBAL por defecto (una sola para todas las pantallas).
         * Clave: "smartpizarra.orientation". Es el único default del proyecto:
         * config.html no tiene defaults.
         */
        const DEFAULT_ORIENTATION = 90;

        /**
         * Pantallas con escala PROPIA y su valor por defecto.
         * Claves: "smartpizarra.<pantalla>.scale".
         * Para agregar una pantalla: añadirla aquí (la pantalla lee su
         * clave "smartpizarra.<pantalla>.scale"; config.html no las usa).
         */
        const PAGES = Object.freeze({
          loading: { scale: 80 }, // esta página
          config: { scale: 98 }, // config.html
          connection: { scale: 100 }, // connection.html (pantalla "sin conexión")
          fingerprint: { scale: 100 }, // fingerprint.html (ID + código QR)
          mirror: { scale: 100 }, // mirror.html (imágenes/videos; 100 % = pantalla completa)
        });

        /**
         * parse() de orientación: 0, 90, 180 o 270 (360 => 0, -90 => 270).
         * @param {string|null} raw
         * @returns {number|null}
         */
        function parseOrientation(raw) {
          let degrees = parseInt(raw, 10);
          if (isNaN(degrees)) {
            return null;
          }
          degrees = ((degrees % 360) + 360) % 360;
          return degrees % 90 === 0 ? degrees : null;
        }

        /**
         * parse() de escala: entero de 10 a 300 (%).
         * @param {string|null} raw
         * @returns {number|null}
         */
        function parseScale(raw) {
          const percent = parseInt(raw, 10);
          return percent >= 10 && percent <= 300 ? percent : null;
        }

        /**
         * Crea la entrada de la orientación global y las entradas
         * "<pantalla>.scale" de cada pantalla de PAGES.
         * @param {object} pages PAGES
         * @returns {object} Entradas para CONFIG.settings.
         */
        function buildPageSettings(pages) {
          const settings = {
            orientation: {
              key: "smartpizarra.orientation",
              defaultValue: DEFAULT_ORIENTATION,
              parse: parseOrientation,
            },
          };
          Object.keys(pages).forEach((page) => {
            settings[page + ".scale"] = {
              key: "smartpizarra." + page + ".scale",
              defaultValue: pages[page].scale,
              parse: parseScale,
            };
          });
          return settings;
        }

        /*
         * RUTA DEL EQUIPO (2026-11-12). El ADMINISTRADOR crea rutas en el
         * panel (Gestión de Rutas: URL base + agent, pageIndex, timer,
         * showParams, otherQ, pageSize) y las asigna a USUARIOS; todos los
         * equipos del usuario la heredan. api/device.php y api/media.php
         * envían la URL final (campo deviceRoute; leagues = códigos de la liga
         * de ESTE equipo) o null = sin ruta, y se guarda en localStorage:
         *   "smartpizarra.routeUrl" = URL completa; SIN RUTA (null del servidor,
         *   o clave vacía/no válida) => NO_ROUTE_URL: la pantalla LOCAL none.html
         *   (assets de Kodular) que dice que el equipo no puede mostrar el
         *   contenido y que se comunique con su supervisor, y que sigue
         *   consultando el servidor. Así la app siempre recibe una URL.
         * Va en el JSON a la app como "routeUrl".
         * LA LIGA YA NO SE GUARDA EN LA TV (2026-11-12): va DENTRO de esta URL
         * (parámetro leagues); storeDeviceRoute borra las claves viejas
         * smartpizarra.league / .leagues / .leagueOptions.
         * MISMO bloque en loading, config, connection, fingerprint, mirror y none.
         */
        var DEVICE_ROUTE_KEY = "smartpizarra.routeUrl";
        /** URL por defecto SIN ruta: la pantalla local none.html (assets de Kodular). */
        var NO_ROUTE_URL = "none";
        /** URL "sin ruta" de la versión anterior (en el servidor): se sustituye por NO_ROUTE_URL. */
        var OLD_NO_ROUTE_RE =
          /^https?:\/\/(www\.)?smartpizarra\.cloud\/none\/?$/i;

        /** @returns {string} URL http(s) válida (sin espacios ni comillas, máx. 2000) o "". */
        function cleanRouteUrl(value) {
          var v = typeof value === "string" ? value.trim() : "";
          if (OLD_NO_ROUTE_RE.test(v)) return ""; // antigua página del servidor => NO_ROUTE_URL
          return /^https?:\/\/[^\s"'<>]{1,2000}$/.test(v) ? v : "";
        }

        /** @returns {string} URL de la ruta guardada (NO_ROUTE_URL si no hay o no es válida). */
        function readDeviceRoute() {
          try {
            return (
              cleanRouteUrl(window.localStorage.getItem(DEVICE_ROUTE_KEY)) ||
              NO_ROUTE_URL
            );
          } catch (e) {
            return NO_ROUTE_URL; // sin localStorage: sin ruta
          }
        }

        /**
         * Guarda la ruta de una respuesta de api/device.php o api/media.php.
         * Solo si trae el campo deviceRoute (equipos autorizados); null = sin
         * ruta => NO_ROUTE_URL.
         * @returns {boolean} true si cambió.
         */
        function storeDeviceRoute(res) {
          if (
            !res ||
            typeof res !== "object" ||
            !Object.prototype.hasOwnProperty.call(res, "deviceRoute")
          ) {
            return false;
          }
          var url = cleanRouteUrl(res.deviceRoute) || NO_ROUTE_URL;
          try {
            var ls = window.localStorage;
            // Restos de cuando la liga se guardaba aparte (ahora va en la URL)
            ls.removeItem("smartpizarra.league");
            ls.removeItem("smartpizarra.leagues");
            ls.removeItem("smartpizarra.leagueOptions");
            if (ls.getItem(DEVICE_ROUTE_KEY) === url) return false;
            ls.setItem(DEVICE_ROUTE_KEY, url);
          } catch (e) {
            return false;
          }
          return true;
        }

        /**
         * Textos por idioma (GLOBAL: "smartpizarra.language"). Las claves de
         * idioma deben ser IGUALES a I18N de config.html, que es donde el
         * usuario lo cambia. Para agregar un idioma: un diccionario aquí con
         * TODAS las claves, otro en config.html y su botón .lang.
         */
        const I18N = Object.freeze({
          es: {
            title: "Cargando...",
            version: "Versión: ",
            id: "Id: ",
            progress1: "Iniciando sistema...",
            progress2: "Cargando módulos...",
            progress3: "Preparando interfaz...",
            progress4: "Completando configuración...",
            step1: "Cargando configuración...",
            step2: "Inicializando módulos...",
            step3: "Preparando interfaz...",
            step4: "Carga completa",
            welcome: "¡Bienvenido a Smart Pizarra!",
          },
          en: {
            title: "Loading...",
            version: "Version: ",
            id: "Id: ",
            progress1: "Starting system...",
            progress2: "Loading modules...",
            progress3: "Preparing interface...",
            progress4: "Completing setup...",
            step1: "Loading configuration...",
            step2: "Initializing modules...",
            step3: "Preparing interface...",
            step4: "Loading complete",
            welcome: "Welcome to Smart Pizarra!",
          },
        });

        /** Idioma GLOBAL por defecto (lo crea esta página si no existe). */
        const DEFAULT_LANGUAGE = "en";

        /**
         * Clave donde se anotan los valores por defecto usados la última vez
         * ({clave: default}). Sirve para detectar que se editó un default en
         * este archivo y solo entonces aplicarlo (ver SettingsStore.init).
         */
        const DEFAULTS_KEY = "smartpizarra.defaults";

        /* ==================================================================
           CONFIG - valores ajustables de la animación
           ================================================================== */
        const CONFIG = Object.freeze({
          /** Duración (ms) del desvanecimiento final. Debe coincidir con .fade-out. */
          fadeOutMs: 500,

          animation: {
            durationMs: 8000, // duración total de la animación
            tickMs: 100, // cada cuántos ms se actualiza la barra (la transición CSS suaviza)
            totalSteps: 4, // cantidad de pasos (#step1 ... #step4)
            /** Se usa el primer texto cuyo "below" sea mayor al porcentaje
                actual. "key" es la clave de I18N (se traduce al idioma global). */
            progressTexts: [
              { below: 25, key: "progress1" },
              { below: 50, key: "progress2" },
              { below: 75, key: "progress3" },
              { below: Infinity, key: "progress4" },
            ],
          },

          /**
           * Settings compartidos en localStorage. Cada uno:
           *   key          clave de localStorage (igual en todas las páginas)
           *   defaultValue valor que se crea si no existe o es inválido
           *   parse(raw)   convierte el texto guardado; devuelve null si es inválido
           */
          settings: Object.assign(buildPageSettings(PAGES), {
            version: {
              key: "smartpizarra.version",
              defaultValue: "3.0.14",
              parse: parseText,
            },
            url: {
              key: "smartpizarra.url",
              defaultValue: "smartpizarra.com",
              parse: parseText,
            },
            email: {
              key: "smartpizarra.email",
              defaultValue: "smartpizarra@gmail.com",
              parse: parseText,
            },
            /** Id único del dispositivo: se genera una sola vez y no cambia. */
            deviceId: {
              key: "smartpizarra.deviceId",
              defaultValue: generateDeviceId,
              parse: parseText,
            },
            /** Secreto del dispositivo (no se muestra; no se cambia nunca). */
            deviceSecret: {
              key: "smartpizarra.deviceSecret",
              defaultValue: generateDeviceSecret,
              parse: function (raw) {
                const v = raw === null ? "" : String(raw).trim().toLowerCase();
                return /^[0-9a-f]{64}$/.test(v) ? v : null;
              },
            },
            /** API de registro/autorización de equipos en el hosting. */
            apiUrl: {
              key: "smartpizarra.apiUrl",
              defaultValue: "https://smartpizarra.cloud/api/device.php",
              parse: function (raw) {
                const v = raw === null ? "" : String(raw).trim();
                // Migración: el dominio antiguo (smartpizarra.org) se descarta
                // para que los equipos ya configurados pasen a smartpizarra.cloud.
                if (/\/\/(www\.)?smartpizarra\.org(\/|$)/i.test(v)) return null;
                return /^https?:\/\/\S+$/.test(v) ? v : null;
              },
            },
            /**
             * Bandera de autorización: "1" autorizado, "0" no. La escriben
             * esta página (al arrancar) y fingerprint.html con lo que diga
             * el servidor; sin respuesta del servidor se conserva.
             */
            authorized: {
              key: "smartpizarra.authorized",
              defaultValue: "0",
              parse: function (raw) {
                return raw === "1" || raw === "0" ? raw : null;
              },
            },
            /**
             * Escala para la app (%): SOLO un valor que usa un proceso de
             * Kodular; se cambia en el panel "Escala" de config.html. NO es
             * el tamaño de ninguna pantalla (eso es "<pantalla>.scale").
             */
            appScale: {
              key: "smartpizarra.scale",
              defaultValue: 60,
              parse: parseScale,
            },
            /** Idioma GLOBAL de todas las pantallas (clave de I18N). */
            language: {
              key: "smartpizarra.language",
              defaultValue: DEFAULT_LANGUAGE,
              parse: function (raw) {
                const code =
                  raw === null ? "" : String(raw).trim().toLowerCase();
                return Object.prototype.hasOwnProperty.call(I18N, code)
                  ? code
                  : null;
              },
            },
            /**
             * URL de la ruta de su usuario. La pone el servidor; aquí solo se
             * crea con NO_ROUTE_URL si falta, está vacía o no es válida (nunca
             * pisa una URL válida guardada).
             */
            routeUrl: {
              key: DEVICE_ROUTE_KEY,
              defaultValue: NO_ROUTE_URL,

          editableSettings: [

            "url",

            "orientation",
            "language",

          /** Pantalla que es esta página (sus claves de orientación/escala). */
          thisPage: "loading",

            scaler: "scaler",
            splashContainer: "splashContainer",
            welcome: "welcome",
            loadingBar: "loadingBar",
            progressText: "progressText",
            loadingSteps: "loadingSteps",
            stepPrefix: "step", // los pasos son step1, step2, ...
            versionText: "versionText",
            websiteUrl: "websiteUrl",
            emailContact: "emailContact",
            systemId: "systemId",
            welcomeUrl: "welcomeUrl",
          },

          cssClasses: {
            active: "active", // paso alcanzado
            done: "done", // animación terminada (detiene los puntos)
            fadeOut: "fade-out", // inicia el desvanecimiento

             * Basta con que UNO sea válido para "online".

            endpoints: [
              {
                url: "https://1.1.1.1/dns-query?name=example.com&type=A&ct=application/dns-json",

                type: "dns",

                type: "dns",

            readyTimeoutMs: 3000, // espera máxima por el resultado al terminar la animación
            recheckAtPercent: 60, // % de la animación en que se repite la comprobación

          auth: {

          message: {

            status: "true",

            actionUpdate: "updateSettings", // tras cada llamada a updateSettings()

        const INTERNET = Object.freeze({

        /**
         * Envía un texto a la app probando 4 métodos, del más específico al
         * más general; usa el primero disponible.
         * @param {string} message Texto a enviar (normalmente un JSON).
         */
        function sendToAppInventor(message) {
          try {
            if (window.AppInventor && window.AppInventor.setWebViewString) {
              window.AppInventor.setWebViewString(message); // Kodular / App Inventor
            } else if (window.android && window.android.onReceiveValue) {
              window.android.onReceiveValue(message); // Android (versiones nuevas)
            } else if (
              window.androidInterface &&
              window.androidInterface.onReceiveValue
            ) {
              window.androidInterface.onReceiveValue(message); // Interface estándar
            } else {
              window.postMessage(message, "*"); // Navegador normal (pruebas)
            }
          } catch (e) {
            console.log("Error enviando a AppInventor:", e);
          }
          console.log("Enviado a AppInventor:", message);
        }

        /**

         * @param {string} id

         */
        function requireElement(id) {
          const element = document.getElementById(id);
          if (!element) {
            throw new Error(
              'Loading: no se encontró el elemento HTML con id "' + id + '"',
            );
          }
          return element;
        }

        /* ==================================================================
           CLASE SettingsStore
           Responsabilidad: leer, validar y crear los settings compartidos
           en localStorage. Si el WebView no permite localStorage, trabaja
           solo en memoria con los valores por defecto.
           ================================================================== */
        class SettingsStore {
          /** @param {object} schema CONFIG.settings */
          constructor(schema) {
            this.schema = schema;
            /** Valores actuales ya validados, por nombre de setting. */
            this.values = {};
          }

          /**
           * Verifica cada setting: si no existe o es inválido lo crea
           * con su valor por defecto. Llamar una vez al iniciar.
           *
           * Defaults cambiados en este archivo: en DEFAULTS_KEY se guarda el
           * default con el que se trabajó la última vez. Si el default
           * actual es DISTINTO (se editó loading.html), el nuevo default
           * reemplaza el valor guardado, y todas las páginas lo leen de
           * localStorage. Si es igual, el valor guardado se respeta (aunque
           * se haya cambiado con config.html o updateSettings).
           * Sin registro previo (primera vez) no se pisa nada: solo se anota.
           * Los defaults que son función (deviceId) nunca se reemplazan.
           * Los settings con onlyIfMissing (la ruta) solo se crean si la clave
           * NO existe; lo guardado no se toca (lo actualiza el servidor).
           */
          init() {
            const previous = this._readDefaults();
            const current = {};
            Object.keys(this.schema).forEach((name) => {
              const def = this.schema[name];
              const raw = this._read(def.key);
              if (def.onlyIfMissing) {
                // Solo crear el default si no existe (o no es válido: parse => null);
                // un valor válido se respeta
                if (raw === null || def.parse(raw) === null)
                  this._write(def.key, def.defaultValue);
                const parsed = def.parse(raw === null ? def.defaultValue : raw);
                this.values[name] = parsed === null ? def.defaultValue : parsed;
                return; // no entra en el registro de defaults
              }
              let value = def.parse(raw);
              // defaultValue puede ser una función (ej. id generado al azar)
              const isFn = typeof def.defaultValue === "function";
              if (!isFn) {
                current[def.key] = String(def.defaultValue);
                const changed =
                  previous !== null &&
                  Object.prototype.hasOwnProperty.call(previous, def.key) &&
                  previous[def.key] !== current[def.key];
                if (changed) {
                  console.log(
                    "Default cambiado:",
                    def.key,
                    previous[def.key],
                    "=>",
                    current[def.key],
                  );
                  value = null; // se aplica el nuevo default
                }
              }
              if (value === null) {
                value = isFn ? def.defaultValue() : def.defaultValue;
                this._write(def.key, value);
              }
              this.values[name] = value;
            });
            // Anota los defaults actuales para detectar el próximo cambio
            this._write(DEFAULTS_KEY, JSON.stringify(current));
          }

          /**
           * Lee los defaults anotados en el arranque anterior.
           * @returns {object|null} {clave: default en texto}, o null si no hay.
           * @private
           */
          _readDefaults() {
            try {
              const data = JSON.parse(this._read(DEFAULTS_KEY));
              return data && typeof data === "object" && !Array.isArray(data)
                ? data
                : null;
            } catch (e) {
              return null; // ausente o dañado: se trata como primera vez
            }
          }

          /**
           * Vuelve a leer los settings (los pudo cambiar otra página).
           * Un valor inválido o borrado no se aplica: se conserva el actual.
           * @returns {boolean} true si algún valor cambió.
           */
          reload() {
            let changed = false;
            Object.keys(this.schema).forEach((name) => {
              const value = this.schema[name].parse(
                this._read(this.schema[name].key),
              );
              if (value !== null && value !== this.values[name]) {
                this.values[name] = value;
                changed = true;
              }
            });
            return changed;
          }

          /**
           * Modifica settings y los guarda en localStorage. Solo acepta los
           * nombres de `editable`; cada valor se valida con su parse() y se
           * guarda ya normalizado (ej. "NBA" => "nba", 360 => 0).
           * Un campo inválido se rechaza sin afectar a los demás.
           * @param {object} data      Campos a cambiar ({version:"3.0.14", ...}).
           * @param {string[]} editable Nombres de settings modificables.
           * @returns {{applied:string[], rejected:string[]}}
           */
          update(data, editable) {
            const result = { applied: [], rejected: [] };
            Object.keys(data).forEach((name) => {
              const def = this.schema[name];
              const raw = data[name];
              const value =
                def &&
                editable.indexOf(name) !== -1 &&
                raw !== null &&
                typeof raw !== "object"
                  ? def.parse(String(raw))
                  : null;
              if (value === null) {
                result.rejected.push(name);
                return;
              }
              this._write(def.key, value);
              this.values[name] = value;
              result.applied.push(name);
            });
            return result;
          }

          /**
           * Guarda un setting SIN pasar por editableSettings (uso interno de
           * esta página, p. ej. la bandera de autorización).
           * @param {string} name Nombre en CONFIG.settings.
           * @param {*} value     Se valida con su parse().
           * @returns {boolean} true si el valor era válido y se guardó.
           */
          set(name, value) {
            const def = this.schema[name];
            const parsed = def ? def.parse(String(value)) : null;
            if (parsed === null) {
              return false;
            }
            this._write(def.key, parsed);
            this.values[name] = parsed;
            return true;
          }

          /** @returns {boolean} true si la clave pertenece a algún setting. */
          isSettingKey(key) {
            return Object.keys(this.schema).some(
              (name) => this.schema[name].key === key,
            );
          }

          /** @private */
          _read(key) {
            try {
              return window.localStorage.getItem(key);
            } catch (e) {
              console.log("No se pudo leer localStorage:", e);
              return null;
            }
          }

          /** @private */
          _write(key, value) {
            try {
              window.localStorage.setItem(key, String(value));
            } catch (e) {
              console.log("No se pudo escribir localStorage:", e);
            }
          }
        }

        /* ==================================================================
           CLASE LayoutManager
           Responsabilidad: rotar #stage y escalar #scaler (responsive).
           #stage se gira desde su esquina superior izquierda y se desplaza
           para volver a cubrir la pantalla; con 90/270 se intercambian
           ancho y alto.
           Responsive: no se usan vw/vh (con la rotación se invertirían);
           se mide el tamaño natural del contenido (offsetWidth/Height, que
           no dependen de transform) y se escala para que quepa en el
           escenario rotado. La escala guardada multiplica ese ajuste.
           ================================================================== */
        class LayoutManager {
          /**
           * @param {HTMLElement} stage    Elemento que se rota.
           * @param {HTMLElement} scaler   Elemento que se escala.
           * @param {number}      fitRatio Fracción del escenario a ocupar (CONFIG.fitRatio).
           */
          constructor(stage, scaler, fitRatio) {
            this.stage = stage;
            this.scaler = scaler;
            this.fitRatio = fitRatio;
            /** "orientación|escala|ventana|contenido" aplicado por última vez. */
            this._lastState = "";
          }

          /**
           * Aplica rotación y escala solo si cambió algo (settings, tamaño de
           * la ventana o tamaño del contenido) desde la última vez.
           * Con la ventana aún sin tamaño (0x0) no aplica: se reintenta en
           * la siguiente revisión.
           * @param {number} orientation 0, 90, 180 o 270.
           * @param {number} scale       Porcentaje: 100 = el contenido ocupa
           *                             fitRatio de la pantalla.
           */
          apply(orientation, scale) {
            const width =
              window.innerWidth || document.documentElement.clientWidth;
            const height =
              window.innerHeight || document.documentElement.clientHeight;
            if (!width || !height) {
              return;
            }
            // Tamaño natural del contenido (sin la escala aplicada)
            const contentWidth = this.scaler.offsetWidth;
            const contentHeight = this.scaler.offsetHeight;
            const state =
              orientation +
              "|" +
              scale +
              "|" +
              width +
              "x" +
              height +
              "|" +
              contentWidth +
              "x" +
              contentHeight;
            if (state === this._lastState) {
              return;
            }
            this._lastState = state;

            let stageWidth = width;
            let stageHeight = height;
            let transform = "none";

            if (orientation === 90) {
              stageWidth = height;
              stageHeight = width;
              transform = "translate(" + width + "px, 0px) rotate(90deg)";
            } else if (orientation === 180) {
              transform =
                "translate(" + width + "px, " + height + "px) rotate(180deg)";
            } else if (orientation === 270) {
              stageWidth = height;
              stageHeight = width;
              transform = "translate(0px, " + height + "px) rotate(270deg)";
            }

            this.stage.style.width = stageWidth + "px";
            this.stage.style.height = stageHeight + "px";
            this.stage.style.transformOrigin = "0 0";
            this.stage.style.transform = transform;

            // Factor que hace caber el contenido en el escenario (ancho y alto)
            let fit = 1;
            if (contentWidth > 0 && contentHeight > 0) {
              fit = Math.min(
                (stageWidth * this.fitRatio) / contentWidth,
                (stageHeight * this.fitRatio) / contentHeight,
              );
            }
            this.scaler.style.transform =
              "scale(" + ((fit * scale) / 100).toFixed(4) + ")";
          }
        }

        /* ==================================================================
           CLASE Translator
           Responsabilidad: textos en el idioma global. Traduce los elementos
           con data-i18n, el título del documento y <html lang>. Solo toca
           el DOM cuando cambia el idioma.
           ================================================================== */
        class Translator {
          /**
           * @param {object} dictionaries I18N
           * @param {string} fallback     Idioma si falta el elegido o una clave.
           */
          constructor(dictionaries, fallback) {
            this.dictionaries = dictionaries;
            this.fallback = fallback;
            this.language = fallback;
            /** Idioma aplicado al DOM por última vez (null = nunca). */
            this._applied = null;
          }

          /**
           * Cambia el idioma y traduce la página si es distinto al aplicado.
           * @param {string} language Clave de I18N.
           * @returns {boolean} true si cambió.
           */
          setLanguage(language) {
            this.language = Object.prototype.hasOwnProperty.call(
              this.dictionaries,
              language,
            )
              ? language
              : this.fallback;
            if (this.language === this._applied) {
              return false;
            }
            this._applied = this.language;
            document.querySelectorAll("[data-i18n]").forEach((node) => {
              node.textContent = this.t(node.getAttribute("data-i18n"));
            });
            document.title = this.t("title");
            document.documentElement.lang = this.language;
            return true;
          }

          /**
           * @param {string} key Clave de I18N.
           * @returns {string} Texto en el idioma actual (o en el de respaldo).
           */
          t(key) {
            const dict = this.dictionaries[this.language];
            if (Object.prototype.hasOwnProperty.call(dict, key)) {
              return dict[key];
            }
            const base = this.dictionaries[this.fallback];
            return Object.prototype.hasOwnProperty.call(base, key)
              ? base[key]
              : key;
          }
        }

        /* ==================================================================
           CLASE InfoPanel
           Responsabilidad: mostrar versión, web y email tomados de los
           settings. Solo escribe en el DOM si el texto cambió.
           ================================================================== */
        class InfoPanel {
          /**
           * @param {Translator} translator Textos fijos ("Versión: ", "Id: ").
           * @param {object} elements
           * @param {HTMLElement} elements.version    #versionText
           * @param {HTMLElement} elements.url        #websiteUrl
           * @param {HTMLElement} elements.email      #emailContact
           * @param {HTMLElement} elements.deviceId   #systemId
           * @param {HTMLElement} elements.welcomeUrl #welcomeUrl (pantalla final)
           */
          constructor(translator, elements) {
            this.translator = translator;
            this.elements = elements;
          }

          /** @param {{version:string, url:string, email:string}} values SettingsStore.values */
          show(values) {
            const t = this.translator;
            this._setText(
              this.elements.version,
              t.t("version") + values.version,
            );
            this._setText(this.elements.url, values.url);
            this._setText(this.elements.email, values.email);
            this._setText(this.elements.deviceId, t.t("id") + values.deviceId);
            this._setText(this.elements.welcomeUrl, values.url);
          }

          /** @private */
          _setText(element, text) {
            if (element.textContent !== text) {
              element.textContent = text; // textContent: sin riesgo de XSS
            }
          }
        }

        /* ==================================================================
           CLASE LoadingAnimation
           Responsabilidad: barra de progreso, texto y pasos.
           ================================================================== */
        class LoadingAnimation {
          /**
           * @param {object} elements
           * @param {HTMLElement} elements.bar       Barra (#loadingBar).
           * @param {HTMLElement} elements.text      Texto de progreso (#progressText).
           * @param {HTMLElement} elements.stepsBox  Caja de pasos (#loadingSteps).
           * @param {HTMLElement[]} elements.steps   Pasos, en orden.
           * @param {object} settings   CONFIG.animation.
           * @param {object} cssClasses CONFIG.cssClasses.
           * @param {Translator} translator Traduce los textos de progreso.
           */
          constructor(elements, settings, cssClasses, translator) {
            this.elements = elements;
            this.settings = settings;
            this.cssClasses = cssClasses;
            this.translator = translator;
            /** Último porcentaje dibujado (para retraducir al cambiar idioma). */
            this._percent = 0;
            this._timer = null;
            /** Último texto y pasos dibujados: solo se toca el DOM si cambian. */
            this._lastText = null;
            this._lastReached = -1;
          }

          /**
           * Inicia la animación; al llegar a 100% se detiene y llama a onComplete.
           * @param {function():void} onComplete
           */
          start(onComplete) {
            if (this._timer) {
              return;
            } // ya está corriendo

            const startTime = Date.now();

            this._timer = setInterval(() => {
              const elapsed = Date.now() - startTime;
              const percent = Math.min(
                100,
                (elapsed / this.settings.durationMs) * 100,
              );

              this._render(percent);

              if (percent >= 100) {
                clearInterval(this._timer);
                this._timer = null;
                this.elements.stepsBox.classList.add(this.cssClasses.done);
                onComplete();
              }
            }, this.settings.tickMs);
          }

          /**
           * Dibuja el estado visual de un porcentaje (0 a 100).
           * @private
           */
          _render(percent) {
            this._percent = percent;
            // transform no recalcula el layout: solo la GPU recompone la barra
            this.elements.bar.style.transform =
              "scaleX(" + (percent / 100).toFixed(3) + ")";

            const text = this._textFor(percent);
            if (text !== this._lastText) {
              this._lastText = text;
              this.elements.text.textContent = text;
            }
            this._updateSteps(percent);
          }

          /** Vuelve a escribir el texto de progreso (tras cambiar el idioma). */
          refreshText() {
            this._lastText = null;
            this._render(this._percent);
          }

          /**
           * Elige el texto de progreso según el porcentaje, ya traducido.
           * @private
           */
          _textFor(percent) {
            const texts = this.settings.progressTexts;
            let key = texts[texts.length - 1].key;
            for (let i = 0; i < texts.length; i++) {
              if (percent < texts[i].below) {
                key = texts[i].key;
                break;
              }
            }
            return this.translator.t(key);
          }

          /**
           * Enciende los pasos alcanzados (con 4: 0%, 25%, 50%, 75%).
           * Solo actúa cuando cambia la cantidad de pasos alcanzados.
           * @private
           */
          _updateSteps(percent) {
            const stepSize = 100 / this.settings.totalSteps;
            const reached = Math.floor(percent / stepSize) + 1;
            if (reached === this._lastReached) {
              return;
            }
            this._lastReached = reached;

            this.elements.steps.forEach((step, index) => {
              step.classList.toggle(
                this.cssClasses.active,
                index + 1 <= reached,
              );
            });
          }
        }

        /* ==================================================================
           CLASE InternetChecker  (copiada de example1.html)
           Responsabilidad: saber si hay internet REAL. navigator.onLine solo
           indica si hay red (un Wi-Fi sin salida daría "true"), por eso se
           consultan servidores públicos y se valida su respuesta.
           ================================================================== */
        class InternetChecker {
          /** @param {object} settings CONFIG.internet */
          constructor(settings) {
            this.settings = settings;
            /** Último resultado: 'online' | 'offline' | null (aún sin resultado). */
            this.status = null;
            /** true mientras hay una comprobación en curso. */
            this.checking = false;
            /** Funciones que esperan el resultado de la comprobación en curso. */
            this._waiting = [];
          }

          /** Inicia una comprobación (si ya hay una en curso, no hace nada). */
          check() {
            if (this.checking) {
              return;
            }
            this.checking = true;

            const endpoints = this.settings.endpoints;
            if (navigator.onLine === false) {
              this._finish(INTERNET.OFFLINE); // sin red según el sistema
              return;
            }

            let remaining = endpoints.length; // endpoints que aún no responden
            let resolved = false; // true cuando ya se decidió el resultado
            endpoints.forEach((endpoint) => {
              this._ping(endpoint, (ok) => {
                if (resolved) {
                  return;
                }
                if (ok) {
                  resolved = true;
                  this._finish(INTERNET.ONLINE);
                } else if (--remaining === 0) {
                  resolved = true;
                  this._finish(INTERNET.OFFLINE);
                }
              });
            });
          }

          /**
           * Entrega el resultado: inmediato si no hay comprobación en curso;
           * si la hay, lo espera como máximo readyTimeoutMs.
           * @param {function(string):void} callback Recibe 'online' u 'offline'.
           */
          whenReady(callback) {
            if (!this.checking) {
              callback(this.lastStatus());
              return;
            }
            let called = false;
            const once = (status) => {
              if (!called) {
                called = true;
                callback(status);
              }
            };
            this._waiting.push(once);
            setTimeout(
              () => once(this.lastStatus()),
              this.settings.readyTimeoutMs,
            );
          }

          /**
           * Último resultado conocido o, si nunca hubo, lo que diga navigator.onLine.
           * @returns {string}
           */
          lastStatus() {
            return (
              this.status ||
              (navigator.onLine === false ? INTERNET.OFFLINE : INTERNET.ONLINE)
            );
          }

          /**
           * Hace UNA petición a un endpoint y valida su contenido.
           * @param {{url:string, type:string}} endpoint
           * @param {function(boolean):void} done true solo si respondió 200 con el contenido esperado.
           * @private
           */
          _ping(endpoint, done) {
            let finished = false;
            let xhr = null;
            const end = (ok) => {
              if (finished) {
                return;
              }
              finished = true;
              clearTimeout(timer);
              if (!ok && xhr) {
                try {
                  xhr.abort();
                } catch (e) {
                  /* ignorar */
                }
              }
              done(ok);
            };
            const timer = setTimeout(
              () => end(false),
              this.settings.requestTimeoutMs,
            );

            try {
              // Parámetro aleatorio para evitar respuestas en caché (falso "online")
              const separator = endpoint.url.indexOf("?") === -1 ? "?" : "&";
              const pad = Math.random().toString(36).slice(2, 12);
              xhr = new XMLHttpRequest();
              xhr.open(
                "GET",
                endpoint.url + separator + "random_padding=" + pad,
                true,
              );
              xhr.timeout = this.settings.requestTimeoutMs;
              if (endpoint.type === "dns") {
                xhr.setRequestHeader("Accept", "application/dns-json");
              }
              xhr.onload = () =>
                end(
                  xhr.status === 200 &&
                    this._isValid(endpoint.type, xhr.responseText),
                );
              xhr.onerror = () => end(false);
              xhr.ontimeout = () => end(false);
              xhr.onabort = () => end(false);
              xhr.send();
            } catch (e) {
              end(false);
            }
          }

          /**
           * Comprueba que la respuesta sea la del servidor real.
           * @param {string} type 'dns' | 'ip'
           * @param {string} text Cuerpo de la respuesta.
           * @returns {boolean}
           * @private
           */
          _isValid(type, text) {
            try {
              const data = JSON.parse(text);
              if (type === "dns") {
                return (
                  !!data &&
                  data.Status === 0 &&
                  Array.isArray(data.Answer) &&
                  data.Answer.length > 0
                );
              }
              if (type === "ip") {
                return (
                  !!data &&
                  typeof data.ip === "string" &&
                  /^[0-9a-fA-F:.]{7,45}$/.test(data.ip)
                );
              }
            } catch (e) {
              /* respuesta no JSON = no es internet real */
            }
            return false;
          }

          /** Guarda el resultado y avisa a quienes lo esperaban. @private */
          _finish(status) {
            this.status = status;
            this.checking = false;
            const waiting = this._waiting;
            this._waiting = [];
            waiting.forEach((fn) => fn(status));
          }
        }

        /* ==================================================================
           CLASE AuthClient
           Responsabilidad: preguntar a smartpizarra.cloud si este equipo está
           autorizado (y registrarlo como pendiente si es nuevo). Mismo
           protocolo que fingerprint.html: POST form-urlencoded (sin
           verificación previa CORS) con deviceId + secret + version, más
           event=boot (historial de arranques + última conexión).
           ================================================================== */
        class AuthClient {
          /** @param {object} settings CONFIG.auth */
          constructor(settings) {
            this.settings = settings;
          }

          /**
           * @param {string} apiUrl
           * @param {{deviceId:string, secret:string, version:string}} data
           * @returns {Promise<object|null>} La respuesta del servidor ({ok:true,
           *          authorized, status, deviceRoute?...}); null = sin
           *          respuesta válida (no cambiar nada).
           */
          check(apiUrl, data) {
            return new Promise((resolve) => {
              let xhr;
              try {
                xhr = new XMLHttpRequest();
                xhr.open("POST", apiUrl, true);
                xhr.timeout = this.settings.timeoutMs;
                xhr.setRequestHeader(
                  "Content-Type",
                  "application/x-www-form-urlencoded",
                );
                xhr.onload = () => {
                  try {
                    const res = JSON.parse(xhr.responseText);
                    resolve(
                      xhr.status === 200 && res && res.ok === true ? res : null,
                    );
                  } catch (e) {
                    resolve(null); // respuesta no JSON (portal cautivo, error)
                  }
                };
                xhr.onerror = () => resolve(null);
                xhr.ontimeout = () => resolve(null);
                xhr.send(
                  "deviceId=" +
                    encodeURIComponent(data.deviceId) +
                    "&secret=" +
                    encodeURIComponent(data.secret) +
                    "&version=" +
                    encodeURIComponent(data.version) +
                    // Arranque: el servidor lo anota en el historial del
                    // equipo y refresca su "última conexión" en el panel.
                    "&event=boot",
                );
              } catch (e) {
                resolve(null);
              }
            });
          }
        }

        /* ==================================================================
           CLASE LoadingScreen
           Responsabilidad: preparar los settings, aplicar el layout,
           arrancar la animación y, al terminar, hacer el fundido de salida
           y mostrar la bienvenida.
           ================================================================== */
        class LoadingScreen {
          /** @param {object} config Objeto CONFIG. */
          constructor(config) {
            this.config = config;
            const ids = config.ids;

            this.settings = new SettingsStore(config.settings);
            this.internet = new InternetChecker(config.internet);
            this.auth = new AuthClient(config.auth);
            this.layout = new LayoutManager(
              requireElement(ids.stage),
              requireElement(ids.scaler),
              config.fitRatio,
            );
            this.translator = new Translator(I18N, DEFAULT_LANGUAGE);
            this.info = new InfoPanel(this.translator, {
              version: requireElement(ids.versionText),
              url: requireElement(ids.websiteUrl),
              email: requireElement(ids.emailContact),
              deviceId: requireElement(ids.systemId),
              welcomeUrl: requireElement(ids.welcomeUrl),
            });
            this.container = requireElement(ids.splashContainer);
            this.welcome = requireElement(ids.welcome);

            const steps = [];
            for (let i = 1; i <= config.animation.totalSteps; i++) {
              steps.push(requireElement(ids.stepPrefix + i));
            }

            this.animation = new LoadingAnimation(
              {
                bar: requireElement(ids.loadingBar),
                text: requireElement(ids.progressText),
                stepsBox: requireElement(ids.loadingSteps),
                steps: steps,
              },
              config.animation,
              config.cssClasses,
              this.translator,
            );
          }

          /**
           * Crea/lee los settings, aplica el layout, inicia la animación y la
           * comprobación de internet (al inicio y al recheckAtPercent %).
           * Al terminar la animación envía el estado a la app.
           */
          start() {
            this.settings.init();
            this._applyLayout();
            this._listenForChanges();
            this._checkAuthorization();

            this.internet.check();
            setTimeout(
              () => this.internet.check(),
              (this.config.animation.durationMs *
                this.config.internet.recheckAtPercent) /
                100,
            );

            this.animation.start(() => {
              // Espera el resultado de internet (máx. readyTimeoutMs) y avisa a la app
              this.internet.whenReady((status) => {
                this._sendState(this.config.message.actionLoading, status);
                this._fadeOutAndShowWelcome();
              });
            });
          }

          /**
           * Consulta la autorización del equipo al arrancar (así se detecta
           * si se revocó) y guarda la bandera "smartpizarra.authorized" con
           * lo que diga el servidor. Sin respuesta se conserva la anterior.
           * @private
           */
          _checkAuthorization() {
            const v = this.settings.values;
            this.auth
              .check(v.apiUrl, {
                deviceId: v.deviceId,
                secret: v.deviceSecret,
                version: v.version,
              })
              .then((res) => {
                if (res === null) {
                  console.log("Autorización: sin respuesta del servidor");
                  return;
                }
                const authorized = res.authorized === true;
                this.settings.set("authorized", authorized ? "1" : "0");
                // Ruta de su usuario (Gestión de Rutas del panel; solo si está autorizado)
                if (storeDeviceRoute(res)) {
                  console.log(
                    "Ruta del equipo actualizada:",
                    readDeviceRoute(),
                  );
                }
                console.log("Autorización:", authorized);
              });
          }

          /**
           * Envía a la app el estado actual: origen, acción, internet y los
           * settings leídos de localStorage en ese momento.
           * @param {string} action Qué lo provocó (CONFIG.message.action*).
           * @param {string} internetStatus 'online' u 'offline'.
           * @param {object} [extra] Campos adicionales (ej. resultado de updateSettings).
           * @private
           */
          _sendState(action, internetStatus, extra) {
            this.settings.reload(); // por si otra página los cambió
            const v = this.settings.values;
            const message = {
              origin: this.config.message.origin,
              action: action,
              status: this.config.message.status,
              internetStatus: internetStatus,
              version: v.version,
              url: v.url,
              email: v.email,
              deviceId: v.deviceId,
              // Secreto del equipo: la app nativa lo usa para enviar su señal
              // "online" a api/ping.php. Solo viaja a la app (WebViewString,
              // dentro del equipo); nunca se muestra en pantalla.
              deviceSecret: v.deviceSecret,
              // Ruta de su usuario (URL completa, leagues = liga del equipo); sin ruta = http://localhost/none.html
              routeUrl: readDeviceRoute(),
              orientation: v.orientation, // global: todas las pantallas
              language: v.language, // global: todas las pantallas
              scale: v.appScale / 100, // escala para la app (factor), la edita config.html
              authorized: v.authorized === "1", // autorizado en smartpizarra.cloud
              // Tamaño de CADA pantalla, como factor (80 % => 0.8)
              pages: {},
            };
            Object.keys(PAGES).forEach((page) => {
              message.pages[page] = { scale: v[page + ".scale"] / 100 };
            });
            if (extra) {
              Object.keys(extra).forEach((k) => {
                message[k] = extra[k];
              });
            }
            sendToAppInventor(JSON.stringify(message));
          }

          /**
           * Modifica settings desde un JSON (texto u objeto), los guarda en
           * localStorage y actualiza la pantalla al momento.
           * @param {string|object} jsonData Ej. '{"version":"3.0.14","orientation":90}' ("league" ya no se acepta: la liga va dentro de la URL de la ruta)
           * @returns {{ok:boolean, applied:string[], rejected:string[], error?:string}}
           */
          updateSettings(jsonData) {
            const response = this._applySettingsJson(jsonData);
            // Confirma a la app con los settings ya guardados (internet: último conocido)
            this._sendState(
              this.config.message.actionUpdate,
              this.internet.lastStatus(),
              response,
            );
            return response;
          }

          /**
           * Valida y aplica el JSON de updateSettings() (sin avisar a la app).
           * @param {string|object} jsonData
           * @returns {{ok:boolean, applied:string[], rejected:string[], error?:string}}
           * @private
           */
          _applySettingsJson(jsonData) {
            let data;
            try {
              data =
                typeof jsonData === "string" ? JSON.parse(jsonData) : jsonData;
            } catch (e) {
              return {
                ok: false,
                applied: [],
                rejected: [],
                error: "JSON inválido",
              };
            }
            if (!data || typeof data !== "object" || Array.isArray(data)) {
              return {
                ok: false,
                applied: [],
                rejected: [],
                error: "Se esperaba un objeto JSON",
              };
            }
            // "orientation" es global. "page" indica de qué pantalla es "scale"
            // (sin "page" => esta pantalla); se traduce a "<page>.scale".
            const page =
              data.page === undefined
                ? this.config.thisPage
                : String(data.page);
            if (!Object.prototype.hasOwnProperty.call(PAGES, page)) {
              return {
                ok: false,
                applied: [],
                rejected: ["page"],
                error: "Pantalla desconocida: " + page,
              };
            }
            const fields = {};
            Object.keys(data).forEach((name) => {
              if (name === "scale") {
                fields[page + ".scale"] = data[name];
              } else if (name !== "page") {
                fields[name] = data[name];
              }
            });
            const result = this.settings.update(
              fields,
              this.config.editableSettings,
            );
            if (result.applied.length > 0) {
              this._applyLayout();
            }
            return {
              ok: result.rejected.length === 0,
              applied: result.applied,
              rejected: result.rejected,
            };
          }

          /** Aplica todos los settings: idioma, layout y textos. @private */
          _applyLayout() {
            const v = this.settings.values;
            const page = this.config.thisPage;
            if (this.translator.setLanguage(v.language)) {
              this.animation.refreshText(); // texto de progreso en el nuevo idioma
            }
            this.info.show(v);
            this.layout.apply(v.orientation, v[page + ".scale"]);
          }

          /**
           * Reaplica el layout si cambia el tamaño de la ventana o si otra
           * página modifica los settings.
           * @private
           */
          _listenForChanges() {
            const refresh = () => {
              this.settings.reload();
              this._applyLayout();
            };
            window.addEventListener("resize", refresh);
            window.addEventListener("orientationchange", refresh);
            window.addEventListener("load", refresh);
            window.addEventListener("pageshow", refresh);
            // Revisión periódica (ver CONFIG.watchMs): cubre el arranque sin
            // tamaño y cambios hechos por otro WebView sin evento "storage"
            setInterval(refresh, this.config.watchMs);
            document.addEventListener("visibilitychange", () => {
              if (!document.hidden) refresh();
            });
            // "storage" solo llega cuando OTRA página cambia localStorage
            window.addEventListener("storage", (e) => {
              if (
                (e.key === null || this.settings.isSettingKey(e.key)) &&
                this.settings.reload()
              ) {
                this._applyLayout();
              }
            });
          }

          /**
           * Desvanece la tarjeta y luego muestra la bienvenida.
           * @private
           */
          _fadeOutAndShowWelcome() {
            this.container.classList.add(this.config.cssClasses.fadeOut);

            setTimeout(() => {
              this.container.style.display = "none";
              this.welcome.style.display = "block";
              this._applyLayout(); // el contenido cambió de tamaño: reajustar ya
            }, this.config.fadeOutMs);
          }
        }

        /* ARRANQUE: inicia la animación cuando el HTML está listo, expone
           updateSettings() y procesa las llamadas que llegaron antes */
        function start() {
          const screen = new LoadingScreen(CONFIG);
          screen.start();

          /**
           * Función GLOBAL (la app la llama con RunJavaScript / EvaluateJavaScript):
           *   updateSettings('{"version":"3.0.14","url":"smartpizarra.com",
           *     "email":"a@b.com",
           *     "page":"config","orientation":90,"scale":100}')
           * "orientation" y "language" (es, en) son GLOBALES (valen para
           * todas las pantallas).
           * "page" (loading, config) dice de qué pantalla es "scale"; sin
           * "page" se aplica a loading. También se acepta "config.scale", etc.
           * Todos los campos son opcionales. Devuelve el resultado como texto JSON:
           *   {"ok":true,"applied":["version",...],"rejected":[]}
           * Reemplaza a la provisional del <head>.
           * @param {string|object} jsonData
           * @returns {string}
           */
          window.updateSettings = function (jsonData) {
            const result = JSON.stringify(screen.updateSettings(jsonData));
            console.log("updateSettings:", result);
            return result;
          };

          const pending = window.__pendingSettings || [];
          window.__pendingSettings = null;
          pending.forEach(function (jsonData) {
            window.updateSettings(jsonData);
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", start);
        } else {
          start();
        }
      })();
    </script>
  </body>
</html>
