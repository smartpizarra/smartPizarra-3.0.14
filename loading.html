<!doctype html>
<!--
=====================================================================
  SMART PIZARRA - ANIMACIÓN DE CARGA (solo animación)
=====================================================================
  Extraída de example1.html. Contiene únicamente la parte visual:
  logo flotante, barra de progreso, texto, 4 pasos, puntos "..." y
  fundido final hacia la pantalla de bienvenida.

  NO incluye: comprobación de internet, updateData() ni envío de
  mensajes a la app (Kodular).

  SETTINGS COMPARTIDOS (localStorage)
  Al iniciar, esta página verifica cada setting en localStorage: si no
  existe o es inválido, lo crea con su valor por defecto. Luego aplica
  la rotación y la escala. Cualquier otra página del mismo origen
  puede leerlos o modificarlos con estas claves (valores en texto):

    clave                                valores              defecto
    smartpizarra.loading.orientation     0 | 90 | 180 | 270   90
    smartpizarra.loading.scale           10 a 300 (%)         85
    smartpizarra.config.orientation      0 | 90 | 180 | 270   90
    smartpizarra.config.scale            10 a 300 (%)         100
    (cada pantalla tiene orientación y escala propias: ver PAGES)
    smartpizarra.version / url / email / deviceId / league

  Si otra página los modifica, esta los vuelve a leer al recibir el
  evento "storage", al volver a mostrarse o al cambiar el tamaño.
  Agregar un setting nuevo => una entrada en CONFIG.settings.

  COMPATIBILIDAD (Android WebView 101 en TV box)
  - Sin librerías externas ni backdrop-filter (pesado en GPU).
  - La barra avanza con transform: scaleX (sin recalcular el layout).
  - El DOM solo se toca cuando cambia el texto o los pasos.

  COMO MODIFICAR
    Duración, textos o cantidad de pasos => objeto CONFIG.
    Colores, tamaños o animaciones       => bloque <style>.
=====================================================================
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin zoom: en un WebView la pantalla de carga debe verse siempre igual -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cargando...</title>
    <script>
      // updateSettings() provisional: existe desde el <head> para que una
      // llamada de la app mientras la página aún carga no se pierda. Se
      // guarda y se procesa al ARRANCAR (ver final del script principal).
      window.updateSettings = function (jsonData) {
        (window.__pendingSettings = window.__pendingSettings || []).push(
          jsonData,
        );
        return '{"ok":true,"queued":true}';
      };
    </script>

    <style>
      /* ==============================================================
           1. BASE: reinicio de estilos y fondo de pantalla completa
           ============================================================== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent; /* sin resaltado azul al tocar */
      }

      /* height:100% y no 100vh: en WebView "vh" puede fallar cuando cambia la barra del sistema */
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #002b4f;
      }

      body {
        position: relative;
        font-family: "Segoe UI", Roboto, Tahoma, Geneva, Verdana, sans-serif;
        color: #ffffff;
        user-select: none; /* evita seleccionar texto por accidente */
      }

      /* #stage: se rota 0/90/180/270. Ancho, alto y transform los fija
         LayoutManager (se intercambian ancho/alto con 90 y 270) */
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* #scaler: recibe la escala desde su centro. Sin ancho fijo y sin
         encogerse, para que su tamaño sea el natural del contenido: así
         LayoutManager lo mide y calcula cuánto escalar para llenar la pantalla */
      #scaler {
        display: flex;
        justify-content: center;
        flex-shrink: 0;
        transform-origin: 50% 50%;
      }

      /* ==============================================================
           2. TARJETA DE CARGA
           ============================================================== */
      .splash-container {
        text-align: center;
        max-width: 100%;
        width: 400px;
        padding: 0 20px;
      }

      /* --- Logo con movimiento flotante --- */
      .logo {
        width: 120px;
        height: 120px;
        margin: 0 auto 30px;
        border-radius: 20px;
        background: linear-gradient(45deg, #2196f3, #21cbf3);
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 10px 30px rgba(33, 150, 243, 0.4);
        animation: float 3s ease-in-out infinite;
        will-change: transform; /* capa propia en GPU: animar no repinta el resto */
      }

      .logo-icon {
        font-size: 48px;
        font-weight: bold;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 5px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }

      /* --- Datos tomados de localStorage (InfoPanel) --- */

      /* Si un dato está vacío no ocupa espacio */
      .info:empty {
        display: none;
      }

      .version {
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 8px;
      }

      .website {
        font-size: 1.1rem;
        color: #00e5ff;
        margin-bottom: 8px;
        font-weight: 300;
        letter-spacing: 1px;
      }

      .system-id {
        /* id del dispositivo (si es largo se parte en líneas) */
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 8px;
        word-break: break-all;
      }

      .email-contact {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 8px;
      }

      /* --- Barra de progreso --- */
      .loading-container {
        /* riel gris de la barra */
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 22px;
        margin-bottom: 20px;
      }

      /* Ocupa el 100% del riel y el JS la "estira" con scaleX(0..1) */
      .loading-bar {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #00e5ff, #2979ff);
        transform: scaleX(0);
        transform-origin: 0 50%;
        transition: transform 0.1s linear;
        will-change: transform;
      }

      .progress-text {
        /* texto bajo la barra */
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.7);
        margin-top: 10px;
      }

      /* --- Lista de pasos --- */
      .loading-steps {
        margin-top: 30px;
        text-align: left;
        /* Fondo semitransparente en vez de backdrop-filter (pesado en TV box) */
        background: rgba(255, 255, 255, 0.12);
        padding: 20px;
        border-radius: 10px;
      }

      .step {
        /* paso aún no alcanzado */
        margin: 10px 0;
        display: flex;
        align-items: center;
        opacity: 0.5;
        transition: opacity 0.3s ease;
      }

      .step.active {
        /* paso alcanzado */
        opacity: 1;
        color: #00e5ff;
      }

      .step-check {
        margin-right: 10px;
        font-size: 1.2rem;
      }

      /* --- Puntos "..." del último paso: 3 <span> que parpadean en secuencia
           (no se anima "content" porque en WebView no es fiable) --- */
      .dots span {
        opacity: 0;
        animation: dotBlink 1.5s linear infinite;
      }
      .dots span:nth-child(2) {
        animation-delay: 0.25s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.5s;
      }

      /* Al terminar (clase "done") los puntos se detienen y se ocultan */
      .done .dots span {
        animation: none;
        opacity: 0;
      }

      /* ==============================================================
           3. PANTALLA FINAL DE BIENVENIDA (oculta hasta el final)
           ============================================================== */
      .welcome {
        display: none;
        text-align: center;
        padding: 20px;
      }
      .welcome h2 {
        margin-bottom: 10px;
      }
      .welcome p {
        color: #00e5ff;
      }

      /* ==============================================================
           4. ANIMACIONES (@keyframes)
           ============================================================== */

      /* Logo: sube y baja 15px */
      @keyframes float {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        50% {
          transform: translate3d(0, -15px, 0);
        }
      }

      /* Puntos: aparecen y desaparecen */
      @keyframes dotBlink {
        0%,
        100% {
          opacity: 0;
        }
        20%,
        80% {
          opacity: 1;
        }
      }

      /* Salida: la tarjeta se desvanece */
      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* Duración debe coincidir con CONFIG.fadeOutMs */
      .fade-out {
        animation: fadeOut 0.5s ease forwards;
      }

      /* Accesibilidad: si el sistema pide menos movimiento, el logo no flota */
      @media (prefers-reduced-motion: reduce) {
        .logo {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- #stage => rotación · #scaler => escala (ambos desde los settings) -->
    <div id="stage">
      <div id="scaler">
        <!-- TARJETA DE CARGA -->
        <div class="splash-container" id="splashContainer">
          <div class="logo">
            <div class="logo-icon">SP</div>
          </div>
          <h1>Smart Pizarra</h1>

          <!-- Los llena InfoPanel con los valores de localStorage (CONFIG.settings) -->
          <div class="info version" id="versionText"></div>
          <div class="info website" id="websiteUrl"></div>
          <div class="info email-contact" id="emailContact"></div>
          <div class="info system-id" id="systemId"></div>

          <!-- Barra de progreso: LoadingAnimation cambia el scaleX de #loadingBar -->
          <div class="loading-container">
            <div class="loading-bar" id="loadingBar"></div>
          </div>
          <div class="progress-text" id="progressText">Starting system...</div>

          <!-- Pasos: ids consecutivos step1..stepN (ajustar CONFIG.animation.totalSteps) -->
          <div class="loading-steps" id="loadingSteps">
            <div class="step active" id="step1">
              <span class="step-check">&#10003;</span> Loading configuration...
            </div>
            <div class="step" id="step2">
              <span class="step-check">&#10003;</span> Initializing modules...
            </div>
            <div class="step" id="step3">
              <span class="step-check">&#10003;</span> Preparing interface...
            </div>
            <div class="step" id="step4">
              <span class="step-check">&#10003;</span> Loading complete<span
                class="dots"
                ><span>.</span><span>.</span><span>.</span></span
              >
            </div>
          </div>
        </div>

        <!-- PANTALLA DE BIENVENIDA: se muestra tras el fundido final -->
        <div class="welcome" id="welcome">
          <h2>¡Bienvenido a Smart Pizarra!</h2>
          <p class="info" id="welcomeUrl"></p>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        /**
         * parse() de los settings de texto: válido si no está vacío.
         * @param {string|null} raw Texto guardado en localStorage.
         * @returns {string|null} Texto sin espacios sobrantes, o null si falta o está vacío.
         */
        function parseText(raw) {
          const text = raw === null ? "" : String(raw).trim();
          return text !== "" ? text : null;
        }

        /**
         * Genera un id de dispositivo con el formato SP-XXXX-XXXX-XXXX
         * (12 dígitos hexadecimales, 48 bits aleatorios).
         * Usa crypto.getRandomValues (funciona también fuera de HTTPS, a
         * diferencia de crypto.randomUUID); si no existe, usa Math.random.
         * @returns {string}
         */
        function generateDeviceId() {
          const bytes = new Uint8Array(6);
          if (window.crypto && window.crypto.getRandomValues) {
            window.crypto.getRandomValues(bytes);
          } else {
            for (let i = 0; i < bytes.length; i++) {
              bytes[i] = Math.floor(Math.random() * 256);
            }
          }
          let hex = "";
          for (let i = 0; i < bytes.length; i++) {
            hex += (bytes[i] < 16 ? "0" : "") + bytes[i].toString(16);
          }
          hex = hex.toUpperCase();
          return (
            "SP-" +
            hex.slice(0, 4) +
            "-" +
            hex.slice(4, 8) +
            "-" +
            hex.slice(8, 12)
          );
        }

        /**
         * Pantallas con orientación y escala PROPIAS, y sus valores por
         * defecto (los únicos del proyecto: config.html no tiene defaults).
         * Claves: "smartpizarra.<pantalla>.orientation" y ".scale".
         * Para agregar una pantalla: añadirla aquí y en PAGES de config.html.
         */
        const PAGES = Object.freeze({
          loading: { orientation: 90, scale: 85 }, // esta página
          config: { orientation: 90, scale: 100 }, // config.html
        });

        /**
         * parse() de orientación: 0, 90, 180 o 270 (360 => 0, -90 => 270).
         * @param {string|null} raw
         * @returns {number|null}
         */
        function parseOrientation(raw) {
          let degrees = parseInt(raw, 10);
          if (isNaN(degrees)) {
            return null;
          }
          degrees = ((degrees % 360) + 360) % 360;
          return degrees % 90 === 0 ? degrees : null;
        }

        /**
         * parse() de escala: entero de 10 a 300 (%).
         * @param {string|null} raw
         * @returns {number|null}
         */
        function parseScale(raw) {
          const percent = parseInt(raw, 10);
          return percent >= 10 && percent <= 300 ? percent : null;
        }

        /**
         * Crea las entradas de settings "<pantalla>.orientation" y
         * "<pantalla>.scale" de cada pantalla de PAGES.
         * @param {object} pages PAGES
         * @returns {object} Entradas para CONFIG.settings.
         */
        function buildPageSettings(pages) {
          const settings = {};
          Object.keys(pages).forEach((page) => {
            settings[page + ".orientation"] = {
              key: "smartpizarra." + page + ".orientation",
              defaultValue: pages[page].orientation,
              parse: parseOrientation,
            };
            settings[page + ".scale"] = {
              key: "smartpizarra." + page + ".scale",
              defaultValue: pages[page].scale,
              parse: parseScale,
            };
          });
          return settings;
        }

        /**
         * Opciones de ligas: id guardado en "smartpizarra.league" => ligas.
         * Debe ser IGUAL en todas las páginas que lean ese setting.
         * "todos" = cadena vacía (sin filtro).
         */
        const LEAGUE_OPTIONS = Object.freeze({
          mlb: "LIDOM,MLB,KO,PRO,AAAI,AAAP,LMP,LVBP,CARIB",
          nba: "NBA,CBK,NBAPROP,WNBA,WCBK,EUBK",
          nflnhl: "NHL,NFL,CFB,CFBAA,CFL,SOC,SOCCER,BOX,BOXING,TEN,TENNIS",
          todos: "",
        });

        /* ==================================================================
           CONFIG - valores ajustables de la animación
           ================================================================== */
        const CONFIG = Object.freeze({
          /** Duración (ms) del desvanecimiento final. Debe coincidir con .fade-out. */
          fadeOutMs: 500,

          animation: {
            durationMs: 8000, // duración total de la animación
            tickMs: 100, // cada cuántos ms se actualiza la barra (la transición CSS suaviza)
            totalSteps: 4, // cantidad de pasos (#step1 ... #step4)
            /** Se usa el primer texto cuyo "below" sea mayor al porcentaje actual. */
            progressTexts: [
              { below: 25, text: "Starting system..." },
              { below: 50, text: "Loading modules..." },
              { below: 75, text: "Preparing interface..." },
              { below: Infinity, text: "Completing setup..." },
            ],
          },

          /**
           * Settings compartidos en localStorage. Cada uno:
           *   key          clave de localStorage (igual en todas las páginas)
           *   defaultValue valor que se crea si no existe o es inválido
           *   parse(raw)   convierte el texto guardado; devuelve null si es inválido
           */
          settings: Object.assign(buildPageSettings(PAGES), {
            version: {
              key: "smartpizarra.version",
              defaultValue: "3.0.14",
              parse: parseText,
            },
            url: {
              key: "smartpizarra.url",
              defaultValue: "smartpizarra.com",
              parse: parseText,
            },
            email: {
              key: "smartpizarra.email",
              defaultValue: "smartpizarra@gmail.com",
              parse: parseText,
            },
            /** Id único del dispositivo: se genera una sola vez y no cambia. */
            deviceId: {
              key: "smartpizarra.deviceId",
              defaultValue: generateDeviceId,
              parse: parseText,
            },
            /** Opción de ligas elegida (id de LEAGUE_OPTIONS), no la lista de ligas. */
            league: {
              key: "smartpizarra.league",
              defaultValue: "todos",
              parse: function (raw) {
                const option =
                  raw === null ? "" : String(raw).trim().toLowerCase();
                return Object.prototype.hasOwnProperty.call(
                  LEAGUE_OPTIONS,
                  option,
                )
                  ? option
                  : null;
              },
            },
          }),

          /**
           * Settings que puede modificar updateSettings() (deviceId NO: es fijo).
           * Incluye "<pantalla>.orientation" y "<pantalla>.scale" de cada PAGES.
           */
          editableSettings: ["version", "url", "email", "league"].concat(
            Object.keys(PAGES).reduce(
              (list, page) =>
                list.concat([page + ".orientation", page + ".scale"]),
              [],
            ),
          ),

          /** Pantalla que es esta página (sus claves de orientación/escala). */
          thisPage: "loading",

          ids: {
            stage: "stage",
            scaler: "scaler",
            splashContainer: "splashContainer",
            welcome: "welcome",
            loadingBar: "loadingBar",
            progressText: "progressText",
            loadingSteps: "loadingSteps",
            stepPrefix: "step", // los pasos son step1, step2, ...
            versionText: "versionText",
            websiteUrl: "websiteUrl",
            emailContact: "emailContact",
            systemId: "systemId",
            welcomeUrl: "welcomeUrl",
          },

          cssClasses: {
            active: "active", // paso alcanzado
            done: "done", // animación terminada (detiene los puntos)
            fadeOut: "fade-out", // inicia el desvanecimiento
          },

          /**
           * Cada cuántos ms se revisa si cambiaron los settings o el tamaño de
           * la ventana. En la app compilada el WebView puede cargar la página
           * sin tamaño (0x0) o con localStorage aún no listo, y no siempre
           * dispara "resize"; esta revisión lo corrige (solo toca el DOM si
           * algo cambió).
           */
          watchMs: 1000,

          /**
           * Fracción de la pantalla (rotada) que ocupa el contenido con
           * escala 100 %. 0.9 deja un 5 % de margen por cada lado.
           */
          fitRatio: 0.9,

          /** Comprobación de internet (mismo método que example1/connection.html). */
          internet: {
            /**
             * Cada endpoint responde un JSON conocido (con CORS) que se LEE y se
             * VALIDA: un portal cautivo o el router no cuentan como internet.
             * Los de IP (1.1.1.1 / 8.8.8.8) no dependen del DNS local.
             * Basta con que UNO sea válido para "online".
             */
            endpoints: [
              {
                url: "https://1.1.1.1/dns-query?name=example.com&type=A&ct=application/dns-json",
                type: "dns",
              },
              {
                url: "https://8.8.8.8/resolve?name=example.com&type=A",
                type: "dns",
              },
              {
                url: "https://cloudflare-dns.com/dns-query?name=example.com&type=A&ct=application/dns-json",
                type: "dns",
              },
              {
                url: "https://dns.google/resolve?name=example.com&type=A",
                type: "dns",
              },
              { url: "https://api.ipify.org/?format=json", type: "ip" },
            ],
            requestTimeoutMs: 4000, // espera máxima por endpoint
            readyTimeoutMs: 3000, // espera máxima por el resultado al terminar la animación
            recheckAtPercent: 60, // % de la animación en que se repite la comprobación
          },

          /** Campos fijos de los mensajes enviados a la app. */
          message: {
            origin: "loadingPage", // de dónde proviene la información
            status: "true",
            actionLoading: "loading", // al terminar la animación
            actionUpdate: "updateSettings", // tras cada llamada a updateSettings()
          },
        });

        /** Resultados posibles de la comprobación de internet. */
        const INTERNET = Object.freeze({ ONLINE: "online", OFFLINE: "offline" });

        /**
         * Envía un texto a la app probando 4 métodos, del más específico al
         * más general; usa el primero disponible.
         * @param {string} message Texto a enviar (normalmente un JSON).
         */
        function sendToAppInventor(message) {
          try {
            if (window.AppInventor && window.AppInventor.setWebViewString) {
              window.AppInventor.setWebViewString(message); // Kodular / App Inventor
            } else if (window.android && window.android.onReceiveValue) {
              window.android.onReceiveValue(message); // Android (versiones nuevas)
            } else if (
              window.androidInterface &&
              window.androidInterface.onReceiveValue
            ) {
              window.androidInterface.onReceiveValue(message); // Interface estándar
            } else {
              window.postMessage(message, "*"); // Navegador normal (pruebas)
            }
          } catch (e) {
            console.log("Error enviando a AppInventor:", e);
          }
          console.log("Enviado a AppInventor:", message);
        }

        /**
         * Busca un elemento por id y falla con un mensaje claro si no existe.
         * @param {string} id
         * @returns {HTMLElement}
         */
        function requireElement(id) {
          const element = document.getElementById(id);
          if (!element) {
            throw new Error(
              'Loading: no se encontró el elemento HTML con id "' + id + '"',
            );
          }
          return element;
        }

        /* ==================================================================
           CLASE SettingsStore
           Responsabilidad: leer, validar y crear los settings compartidos
           en localStorage. Si el WebView no permite localStorage, trabaja
           solo en memoria con los valores por defecto.
           ================================================================== */
        class SettingsStore {
          /** @param {object} schema CONFIG.settings */
          constructor(schema) {
            this.schema = schema;
            /** Valores actuales ya validados, por nombre de setting. */
            this.values = {};
          }

          /**
           * Verifica cada setting: si no existe o es inválido lo crea
           * con su valor por defecto. Llamar una vez al iniciar.
           */
          init() {
            Object.keys(this.schema).forEach((name) => {
              const def = this.schema[name];
              let value = def.parse(this._read(def.key));
              if (value === null) {
                // defaultValue puede ser una función (ej. id generado al azar)
                value =
                  typeof def.defaultValue === "function"
                    ? def.defaultValue()
                    : def.defaultValue;
                this._write(def.key, value);
              }
              this.values[name] = value;
            });
          }

          /**
           * Vuelve a leer los settings (los pudo cambiar otra página).
           * Un valor inválido o borrado no se aplica: se conserva el actual.
           * @returns {boolean} true si algún valor cambió.
           */
          reload() {
            let changed = false;
            Object.keys(this.schema).forEach((name) => {
              const value = this.schema[name].parse(
                this._read(this.schema[name].key),
              );
              if (value !== null && value !== this.values[name]) {
                this.values[name] = value;
                changed = true;
              }
            });
            return changed;
          }

          /**
           * Modifica settings y los guarda en localStorage. Solo acepta los
           * nombres de `editable`; cada valor se valida con su parse() y se
           * guarda ya normalizado (ej. "NBA" => "nba", 360 => 0).
           * Un campo inválido se rechaza sin afectar a los demás.
           * @param {object} data      Campos a cambiar ({version:"3.0.15", ...}).
           * @param {string[]} editable Nombres de settings modificables.
           * @returns {{applied:string[], rejected:string[]}}
           */
          update(data, editable) {
            const result = { applied: [], rejected: [] };
            Object.keys(data).forEach((name) => {
              const def = this.schema[name];
              const raw = data[name];
              const value =
                def &&
                editable.indexOf(name) !== -1 &&
                raw !== null &&
                typeof raw !== "object"
                  ? def.parse(String(raw))
                  : null;
              if (value === null) {
                result.rejected.push(name);
                return;
              }
              this._write(def.key, value);
              this.values[name] = value;
              result.applied.push(name);
            });
            return result;
          }

          /** @returns {boolean} true si la clave pertenece a algún setting. */
          isSettingKey(key) {
            return Object.keys(this.schema).some(
              (name) => this.schema[name].key === key,
            );
          }

          /** @private */
          _read(key) {
            try {
              return window.localStorage.getItem(key);
            } catch (e) {
              console.log("No se pudo leer localStorage:", e);
              return null;
            }
          }

          /** @private */
          _write(key, value) {
            try {
              window.localStorage.setItem(key, String(value));
            } catch (e) {
              console.log("No se pudo escribir localStorage:", e);
            }
          }
        }

        /* ==================================================================
           CLASE LayoutManager
           Responsabilidad: rotar #stage y escalar #scaler (responsive).
           #stage se gira desde su esquina superior izquierda y se desplaza
           para volver a cubrir la pantalla; con 90/270 se intercambian
           ancho y alto.
           Responsive: no se usan vw/vh (con la rotación se invertirían);
           se mide el tamaño natural del contenido (offsetWidth/Height, que
           no dependen de transform) y se escala para que quepa en el
           escenario rotado. La escala guardada multiplica ese ajuste.
           ================================================================== */
        class LayoutManager {
          /**
           * @param {HTMLElement} stage    Elemento que se rota.
           * @param {HTMLElement} scaler   Elemento que se escala.
           * @param {number}      fitRatio Fracción del escenario a ocupar (CONFIG.fitRatio).
           */
          constructor(stage, scaler, fitRatio) {
            this.stage = stage;
            this.scaler = scaler;
            this.fitRatio = fitRatio;
            /** "orientación|escala|ventana|contenido" aplicado por última vez. */
            this._lastState = "";
          }

          /**
           * Aplica rotación y escala solo si cambió algo (settings, tamaño de
           * la ventana o tamaño del contenido) desde la última vez.
           * Con la ventana aún sin tamaño (0x0) no aplica: se reintenta en
           * la siguiente revisión.
           * @param {number} orientation 0, 90, 180 o 270.
           * @param {number} scale       Porcentaje: 100 = el contenido ocupa
           *                             fitRatio de la pantalla.
           */
          apply(orientation, scale) {
            const width =
              window.innerWidth || document.documentElement.clientWidth;
            const height =
              window.innerHeight || document.documentElement.clientHeight;
            if (!width || !height) {
              return;
            }
            // Tamaño natural del contenido (sin la escala aplicada)
            const contentWidth = this.scaler.offsetWidth;
            const contentHeight = this.scaler.offsetHeight;
            const state =
              orientation +
              "|" +
              scale +
              "|" +
              width +
              "x" +
              height +
              "|" +
              contentWidth +
              "x" +
              contentHeight;
            if (state === this._lastState) {
              return;
            }
            this._lastState = state;

            let stageWidth = width;
            let stageHeight = height;
            let transform = "none";

            if (orientation === 90) {
              stageWidth = height;
              stageHeight = width;
              transform = "translate(" + width + "px, 0px) rotate(90deg)";
            } else if (orientation === 180) {
              transform =
                "translate(" + width + "px, " + height + "px) rotate(180deg)";
            } else if (orientation === 270) {
              stageWidth = height;
              stageHeight = width;
              transform = "translate(0px, " + height + "px) rotate(270deg)";
            }

            this.stage.style.width = stageWidth + "px";
            this.stage.style.height = stageHeight + "px";
            this.stage.style.transformOrigin = "0 0";
            this.stage.style.transform = transform;

            // Factor que hace caber el contenido en el escenario (ancho y alto)
            let fit = 1;
            if (contentWidth > 0 && contentHeight > 0) {
              fit = Math.min(
                (stageWidth * this.fitRatio) / contentWidth,
                (stageHeight * this.fitRatio) / contentHeight,
              );
            }
            this.scaler.style.transform =
              "scale(" + ((fit * scale) / 100).toFixed(4) + ")";
          }
        }

        /* ==================================================================
           CLASE InfoPanel
           Responsabilidad: mostrar versión, web y email tomados de los
           settings. Solo escribe en el DOM si el texto cambió.
           ================================================================== */
        class InfoPanel {
          /**
           * @param {object} elements
           * @param {HTMLElement} elements.version    #versionText
           * @param {HTMLElement} elements.url        #websiteUrl
           * @param {HTMLElement} elements.email      #emailContact
           * @param {HTMLElement} elements.deviceId   #systemId
           * @param {HTMLElement} elements.welcomeUrl #welcomeUrl (pantalla final)
           */
          constructor(elements) {
            this.elements = elements;
          }

          /** @param {{version:string, url:string, email:string}} values SettingsStore.values */
          show(values) {
            this._setText(this.elements.version, "Versión: " + values.version);
            this._setText(this.elements.url, values.url);
            this._setText(this.elements.email, values.email);
            this._setText(this.elements.deviceId, "Id: " + values.deviceId);
            this._setText(this.elements.welcomeUrl, values.url);
          }

          /** @private */
          _setText(element, text) {
            if (element.textContent !== text) {
              element.textContent = text; // textContent: sin riesgo de XSS
            }
          }
        }

        /* ==================================================================
           CLASE LoadingAnimation
           Responsabilidad: barra de progreso, texto y pasos.
           ================================================================== */
        class LoadingAnimation {
          /**
           * @param {object} elements
           * @param {HTMLElement} elements.bar       Barra (#loadingBar).
           * @param {HTMLElement} elements.text      Texto de progreso (#progressText).
           * @param {HTMLElement} elements.stepsBox  Caja de pasos (#loadingSteps).
           * @param {HTMLElement[]} elements.steps   Pasos, en orden.
           * @param {object} settings   CONFIG.animation.
           * @param {object} cssClasses CONFIG.cssClasses.
           */
          constructor(elements, settings, cssClasses) {
            this.elements = elements;
            this.settings = settings;
            this.cssClasses = cssClasses;
            this._timer = null;
            /** Último texto y pasos dibujados: solo se toca el DOM si cambian. */
            this._lastText = null;
            this._lastReached = -1;
          }

          /**
           * Inicia la animación; al llegar a 100% se detiene y llama a onComplete.
           * @param {function():void} onComplete
           */
          start(onComplete) {
            if (this._timer) {
              return;
            } // ya está corriendo

            const startTime = Date.now();

            this._timer = setInterval(() => {
              const elapsed = Date.now() - startTime;
              const percent = Math.min(
                100,
                (elapsed / this.settings.durationMs) * 100,
              );

              this._render(percent);

              if (percent >= 100) {
                clearInterval(this._timer);
                this._timer = null;
                this.elements.stepsBox.classList.add(this.cssClasses.done);
                onComplete();
              }
            }, this.settings.tickMs);
          }

          /**
           * Dibuja el estado visual de un porcentaje (0 a 100).
           * @private
           */
          _render(percent) {
            // transform no recalcula el layout: solo la GPU recompone la barra
            this.elements.bar.style.transform =
              "scaleX(" + (percent / 100).toFixed(3) + ")";

            const text = this._textFor(percent);
            if (text !== this._lastText) {
              this._lastText = text;
              this.elements.text.textContent = text;
            }
            this._updateSteps(percent);
          }

          /**
           * Elige el texto de progreso según el porcentaje.
           * @private
           */
          _textFor(percent) {
            const texts = this.settings.progressTexts;
            for (let i = 0; i < texts.length; i++) {
              if (percent < texts[i].below) {
                return texts[i].text;
              }
            }
            return texts[texts.length - 1].text;
          }

          /**
           * Enciende los pasos alcanzados (con 4: 0%, 25%, 50%, 75%).
           * Solo actúa cuando cambia la cantidad de pasos alcanzados.
           * @private
           */
          _updateSteps(percent) {
            const stepSize = 100 / this.settings.totalSteps;
            const reached = Math.floor(percent / stepSize) + 1;
            if (reached === this._lastReached) {
              return;
            }
            this._lastReached = reached;

            this.elements.steps.forEach((step, index) => {
              step.classList.toggle(
                this.cssClasses.active,
                index + 1 <= reached,
              );
            });
          }
        }

        /* ==================================================================
           CLASE InternetChecker  (copiada de example1.html)
           Responsabilidad: saber si hay internet REAL. navigator.onLine solo
           indica si hay red (un Wi-Fi sin salida daría "true"), por eso se
           consultan servidores públicos y se valida su respuesta.
           ================================================================== */
        class InternetChecker {
          /** @param {object} settings CONFIG.internet */
          constructor(settings) {
            this.settings = settings;
            /** Último resultado: 'online' | 'offline' | null (aún sin resultado). */
            this.status = null;
            /** true mientras hay una comprobación en curso. */
            this.checking = false;
            /** Funciones que esperan el resultado de la comprobación en curso. */
            this._waiting = [];
          }

          /** Inicia una comprobación (si ya hay una en curso, no hace nada). */
          check() {
            if (this.checking) {
              return;
            }
            this.checking = true;

            const endpoints = this.settings.endpoints;
            if (navigator.onLine === false) {
              this._finish(INTERNET.OFFLINE); // sin red según el sistema
              return;
            }

            let remaining = endpoints.length; // endpoints que aún no responden
            let resolved = false; // true cuando ya se decidió el resultado
            endpoints.forEach((endpoint) => {
              this._ping(endpoint, (ok) => {
                if (resolved) {
                  return;
                }
                if (ok) {
                  resolved = true;
                  this._finish(INTERNET.ONLINE);
                } else if (--remaining === 0) {
                  resolved = true;
                  this._finish(INTERNET.OFFLINE);
                }
              });
            });
          }

          /**
           * Entrega el resultado: inmediato si no hay comprobación en curso;
           * si la hay, lo espera como máximo readyTimeoutMs.
           * @param {function(string):void} callback Recibe 'online' u 'offline'.
           */
          whenReady(callback) {
            if (!this.checking) {
              callback(this.lastStatus());
              return;
            }
            let called = false;
            const once = (status) => {
              if (!called) {
                called = true;
                callback(status);
              }
            };
            this._waiting.push(once);
            setTimeout(() => once(this.lastStatus()), this.settings.readyTimeoutMs);
          }

          /**
           * Último resultado conocido o, si nunca hubo, lo que diga navigator.onLine.
           * @returns {string}
           */
          lastStatus() {
            return (
              this.status ||
              (navigator.onLine === false ? INTERNET.OFFLINE : INTERNET.ONLINE)
            );
          }

          /**
           * Hace UNA petición a un endpoint y valida su contenido.
           * @param {{url:string, type:string}} endpoint
           * @param {function(boolean):void} done true solo si respondió 200 con el contenido esperado.
           * @private
           */
          _ping(endpoint, done) {
            let finished = false;
            let xhr = null;
            const end = (ok) => {
              if (finished) {
                return;
              }
              finished = true;
              clearTimeout(timer);
              if (!ok && xhr) {
                try {
                  xhr.abort();
                } catch (e) {
                  /* ignorar */
                }
              }
              done(ok);
            };
            const timer = setTimeout(() => end(false), this.settings.requestTimeoutMs);

            try {
              // Parámetro aleatorio para evitar respuestas en caché (falso "online")
              const separator = endpoint.url.indexOf("?") === -1 ? "?" : "&";
              const pad = Math.random().toString(36).slice(2, 12);
              xhr = new XMLHttpRequest();
              xhr.open("GET", endpoint.url + separator + "random_padding=" + pad, true);
              xhr.timeout = this.settings.requestTimeoutMs;
              if (endpoint.type === "dns") {
                xhr.setRequestHeader("Accept", "application/dns-json");
              }
              xhr.onload = () =>
                end(xhr.status === 200 && this._isValid(endpoint.type, xhr.responseText));
              xhr.onerror = () => end(false);
              xhr.ontimeout = () => end(false);
              xhr.onabort = () => end(false);
              xhr.send();
            } catch (e) {
              end(false);
            }
          }

          /**
           * Comprueba que la respuesta sea la del servidor real.
           * @param {string} type 'dns' | 'ip'
           * @param {string} text Cuerpo de la respuesta.
           * @returns {boolean}
           * @private
           */
          _isValid(type, text) {
            try {
              const data = JSON.parse(text);
              if (type === "dns") {
                return !!data && data.Status === 0 && Array.isArray(data.Answer) && data.Answer.length > 0;
              }
              if (type === "ip") {
                return !!data && typeof data.ip === "string" && /^[0-9a-fA-F:.]{7,45}$/.test(data.ip);
              }
            } catch (e) {
              /* respuesta no JSON = no es internet real */
            }
            return false;
          }

          /** Guarda el resultado y avisa a quienes lo esperaban. @private */
          _finish(status) {
            this.status = status;
            this.checking = false;
            const waiting = this._waiting;
            this._waiting = [];
            waiting.forEach((fn) => fn(status));
          }
        }

        /* ==================================================================
           CLASE LoadingScreen
           Responsabilidad: preparar los settings, aplicar el layout,
           arrancar la animación y, al terminar, hacer el fundido de salida
           y mostrar la bienvenida.
           ================================================================== */
        class LoadingScreen {
          /** @param {object} config Objeto CONFIG. */
          constructor(config) {
            this.config = config;
            const ids = config.ids;

            this.settings = new SettingsStore(config.settings);
            this.internet = new InternetChecker(config.internet);
            this.layout = new LayoutManager(
              requireElement(ids.stage),
              requireElement(ids.scaler),
              config.fitRatio,
            );
            this.info = new InfoPanel({
              version: requireElement(ids.versionText),
              url: requireElement(ids.websiteUrl),
              email: requireElement(ids.emailContact),
              deviceId: requireElement(ids.systemId),
              welcomeUrl: requireElement(ids.welcomeUrl),
            });
            this.container = requireElement(ids.splashContainer);
            this.welcome = requireElement(ids.welcome);

            const steps = [];
            for (let i = 1; i <= config.animation.totalSteps; i++) {
              steps.push(requireElement(ids.stepPrefix + i));
            }

            this.animation = new LoadingAnimation(
              {
                bar: requireElement(ids.loadingBar),
                text: requireElement(ids.progressText),
                stepsBox: requireElement(ids.loadingSteps),
                steps: steps,
              },
              config.animation,
              config.cssClasses,
            );
          }

          /**
           * Crea/lee los settings, aplica el layout, inicia la animación y la
           * comprobación de internet (al inicio y al recheckAtPercent %).
           * Al terminar la animación envía el estado a la app.
           */
          start() {
            this.settings.init();
            this._applyLayout();
            this._listenForChanges();

            this.internet.check();
            setTimeout(
              () => this.internet.check(),
              (this.config.animation.durationMs *
                this.config.internet.recheckAtPercent) /
                100,
            );

            this.animation.start(() => {
              // Espera el resultado de internet (máx. readyTimeoutMs) y avisa a la app
              this.internet.whenReady((status) => {
                this._sendState(this.config.message.actionLoading, status);
                this._fadeOutAndShowWelcome();
              });
            });
          }

          /**
           * Envía a la app el estado actual: origen, acción, internet y los
           * settings leídos de localStorage en ese momento.
           * @param {string} action Qué lo provocó (CONFIG.message.action*).
           * @param {string} internetStatus 'online' u 'offline'.
           * @param {object} [extra] Campos adicionales (ej. resultado de updateSettings).
           * @private
           */
          _sendState(action, internetStatus, extra) {
            this.settings.reload(); // por si otra página los cambió
            const v = this.settings.values;
            const message = {
              origin: this.config.message.origin,
              action: action,
              status: this.config.message.status,
              internetStatus: internetStatus,
              version: v.version,
              url: v.url,
              email: v.email,
              deviceId: v.deviceId,
              league: v.league, // opción guardada (mlb, nba, nflnhl, todos)
              leagues: LEAGUE_OPTIONS[v.league], // ligas de esa opción ("" = todas)
              // Orientación y escala de CADA pantalla; scale como factor (80 % => 0.8)
              pages: {},
            };
            Object.keys(PAGES).forEach((page) => {
              message.pages[page] = {
                orientation: v[page + ".orientation"],
                scale: v[page + ".scale"] / 100,
              };
            });
            if (extra) {
              Object.keys(extra).forEach((k) => {
                message[k] = extra[k];
              });
            }
            sendToAppInventor(JSON.stringify(message));
          }

          /**
           * Modifica settings desde un JSON (texto u objeto), los guarda en
           * localStorage y actualiza la pantalla al momento.
           * @param {string|object} jsonData Ej. '{"version":"3.0.15","league":"nba"}'
           * @returns {{ok:boolean, applied:string[], rejected:string[], error?:string}}
           */
          updateSettings(jsonData) {
            const response = this._applySettingsJson(jsonData);
            // Confirma a la app con los settings ya guardados (internet: último conocido)
            this._sendState(
              this.config.message.actionUpdate,
              this.internet.lastStatus(),
              response,
            );
            return response;
          }

          /**
           * Valida y aplica el JSON de updateSettings() (sin avisar a la app).
           * @param {string|object} jsonData
           * @returns {{ok:boolean, applied:string[], rejected:string[], error?:string}}
           * @private
           */
          _applySettingsJson(jsonData) {
            let data;
            try {
              data =
                typeof jsonData === "string" ? JSON.parse(jsonData) : jsonData;
            } catch (e) {
              return {
                ok: false,
                applied: [],
                rejected: [],
                error: "JSON inválido",
              };
            }
            if (!data || typeof data !== "object" || Array.isArray(data)) {
              return {
                ok: false,
                applied: [],
                rejected: [],
                error: "Se esperaba un objeto JSON",
              };
            }
            // "page" indica de qué pantalla son "orientation" y "scale"
            // (sin "page" => esta pantalla). Se traducen a "<page>.orientation"/".scale".
            const page =
              data.page === undefined ? this.config.thisPage : String(data.page);
            if (!Object.prototype.hasOwnProperty.call(PAGES, page)) {
              return {
                ok: false,
                applied: [],
                rejected: ["page"],
                error: "Pantalla desconocida: " + page,
              };
            }
            const fields = {};
            Object.keys(data).forEach((name) => {
              if (name === "orientation" || name === "scale") {
                fields[page + "." + name] = data[name];
              } else if (name !== "page") {
                fields[name] = data[name];
              }
            });
            const result = this.settings.update(
              fields,
              this.config.editableSettings,
            );
            if (result.applied.length > 0) {
              this._applyLayout();
            }
            return {
              ok: result.rejected.length === 0,
              applied: result.applied,
              rejected: result.rejected,
            };
          }

          /** Aplica todos los settings: layout y textos. @private */
          _applyLayout() {
            const v = this.settings.values;
            const page = this.config.thisPage;
            this.info.show(v);
            this.layout.apply(v[page + ".orientation"], v[page + ".scale"]);
          }

          /**
           * Reaplica el layout si cambia el tamaño de la ventana o si otra
           * página modifica los settings.
           * @private
           */
          _listenForChanges() {
            const refresh = () => {
              this.settings.reload();
              this._applyLayout();
            };
            window.addEventListener("resize", refresh);
            window.addEventListener("orientationchange", refresh);
            window.addEventListener("load", refresh);
            window.addEventListener("pageshow", refresh);
            // Revisión periódica (ver CONFIG.watchMs): cubre el arranque sin
            // tamaño y cambios hechos por otro WebView sin evento "storage"
            setInterval(refresh, this.config.watchMs);
            document.addEventListener("visibilitychange", () => {
              if (!document.hidden) refresh();
            });
            // "storage" solo llega cuando OTRA página cambia localStorage
            window.addEventListener("storage", (e) => {
              if (
                (e.key === null || this.settings.isSettingKey(e.key)) &&
                this.settings.reload()
              ) {
                this._applyLayout();
              }
            });
          }

          /**
           * Desvanece la tarjeta y luego muestra la bienvenida.
           * @private
           */
          _fadeOutAndShowWelcome() {
            this.container.classList.add(this.config.cssClasses.fadeOut);

            setTimeout(() => {
              this.container.style.display = "none";
              this.welcome.style.display = "block";
              this._applyLayout(); // el contenido cambió de tamaño: reajustar ya
            }, this.config.fadeOutMs);
          }
        }

        /* ARRANQUE: inicia la animación cuando el HTML está listo, expone
           updateSettings() y procesa las llamadas que llegaron antes */
        function start() {
          const screen = new LoadingScreen(CONFIG);
          screen.start();

          /**
           * Función GLOBAL (la app la llama con RunJavaScript / EvaluateJavaScript):
           *   updateSettings('{"version":"3.0.15","url":"smartpizarra.com",
           *     "email":"a@b.com","league":"nba",
           *     "page":"config","orientation":90,"scale":100}')
           * "page" (loading, config) dice de qué pantalla son orientation/scale;
           * sin "page" se aplican a loading. También se aceptan directamente
           * "loading.orientation", "config.scale", etc.
           * Todos los campos son opcionales. Devuelve el resultado como texto JSON:
           *   {"ok":true,"applied":["version",...],"rejected":[]}
           * Reemplaza a la provisional del <head>.
           * @param {string|object} jsonData
           * @returns {string}
           */
          window.updateSettings = function (jsonData) {
            const result = JSON.stringify(screen.updateSettings(jsonData));
            console.log("updateSettings:", result);
            return result;
          };

          const pending = window.__pendingSettings || [];
          window.__pendingSettings = null;
          pending.forEach(function (jsonData) {
            window.updateSettings(jsonData);
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", start);
        } else {
          start();
        }
      })();
    </script>
  </body>
</html>
