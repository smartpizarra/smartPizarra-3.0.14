<!doctype html>
<!--
=====================================================================
  SMART PIZARRA - PANTALLA "MIRROR": IMÁGENES Y VIDEOS DEL USUARIO
=====================================================================
  QUE HACE
  Muestra en carrusel (en orden) las imágenes y videos que el usuario
  dueño de este equipo subió en https://smartpizarra.cloud/cuenta/ y
  asignó a este equipo. Cada archivo se descarga UNA sola vez, se guarda
  en el propio equipo (Cache Storage del WebView) y se reproduce SIEMPRE
  desde ahí: el servidor solo recibe una consulta pequeña cada
  SYNC.everyMs (60 s) para saber si hay archivos nuevos o retirados.

  CICLO
    1. sync(): POST api/media.php action=list (deviceId + secret + "rev").
       Si la lista no cambió el servidor responde "unchanged" (unos bytes).
    2. Si cambió: guarda la lista (smartpizarra.mirror.manifest), descarga
       uno a uno los archivos que falten (action=file) y borra del equipo
       los que ya no están en la lista.
    3. player: muestra los archivos YA descargados, en orden. Imagen =
       sus "seconds"; video = hasta que termina (sin sonido: el WebView no
       permite reproducción automática con sonido).
  Sin internet o sin respuesta: sigue mostrando lo guardado.
  Equipo NO autorizado (pendiente / revocado / otro secreto), SIN el
  permiso de contenido (el administrador lo habilita por equipo en el
  panel) o con la VIGENCIA de su usuario vencida (días que el
  administrador suma/resta al usuario): deja de mostrar y enseña un
  aviso con el ID; lo descargado se conserva y se vuelve a mostrar al
  autorizarlo / habilitarlo / renovar la vigencia.
  VIGENCIA SIN INTERNET: el servidor envía "secondsLeft"; el equipo guarda
  la hora de fin (manifest.expiresAt, reloj del equipo) y al llegar deja
  de mostrar el contenido aunque no pueda consultar al servidor.

  SETTINGS (localStorage). Los crea loading.html.
    Lee:  "smartpizarra.orientation"   0/90/180/270  GLOBAL: gira la página
          "smartpizarra.language"      es | en       GLOBAL: idioma de los avisos
          "smartpizarra.mirror.scale"  10 a 300 (%)  tamaño (100 % = pantalla completa)
          "smartpizarra.deviceId" / ".deviceSecret" / ".apiUrl"   para hablar con el servidor
          (la API de contenido es la misma ruta que apiUrl con media.php
           en lugar de device.php)
    Escribe: "smartpizarra.authorized"        "1" | "0" (respuesta del servidor,
                                              como las demás páginas)
             "smartpizarra.mirror.manifest"   última lista recibida (JSON)
  Para cambiar el tamaño: updateSettings('{"page":"mirror","scale":95}')
  en loading.html. Los settings se releen cada 1 s.

  RENDIMIENTO (TV box, Android WebView 101)
  - Sin animaciones ni transiciones: cambio directo de un archivo al
    siguiente (la imagen se decodifica ANTES de cambiarla: sin parpadeo).
    Con una sola imagen la pantalla no se redibuja nunca.
  - Videos con el decodificador del equipo (MP4 H.264 recomendado,
    1080p o menos).
  - Descargas de una en una; se para todo en segundo plano.
  - JavaScript ES5 (var / function) + Promise / fetch / Cache Storage
    (requiere origen seguro: http://localhost lo es).

  MENSAJE A LA APP (Kodular, WebViewer.WebViewStringChange): UN JSON tras
  CADA consulta a api/media.php (cada 60 s, o 30 s si no autorizado),
  con la misma estructura base que las demás páginas:
    {"origin":"mirror","action":"sync","status":"ok|error",
     "internetStatus":"online|offline",
     "authorized":true|false,"authStatus":"authorized|pending|revoked|conflict|
       not_registered|unknown|offline",
     "contentStatus":"showing|downloading|empty|media_disabled|expired|pending|
       revoked|conflict|not_registered",
     "mediaEnabled":true|false|null,"contentActive":true|false|null,
     "secondsLeft":N (vigencia restante, s),"changed":true|false (lista nueva),
     "items":N,"ready":N (descargados),"downloading":true|false,
     "httpStatus":200|403|404|0,"error":"" ,
     "version","url","email","deviceId","league","leagues","orientation",
     "language","scale" (settings leídos AHORA de localStorage, como
     connection.html; null si no existen)}
  status "error" = sin respuesta válida del servidor: authStatus "unknown"
  (u "offline" si el equipo no tiene red), authorized = última bandera
  guardada; internetStatus "online" si hubo respuesta HTTP (httpStatus,
  p. ej. 500) y "offline" si no la hubo (httpStatus 0).
  Sin deviceId/secreto no hay consulta y no se envía nada.

  FUNCIONES PÚBLICAS (para pruebas o para la app)
    mirrorSync()    fuerza una consulta al servidor ahora.
    mirrorStatus()  texto JSON con el estado (autorización, lista, descargados).
=====================================================================
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Mirror - Smart Pizarra</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: Roboto, "Segoe UI", Tahoma, Arial, sans-serif;
      }

      /* #stage: se rota 0/90/180/270 (ancho y alto se intercambian a 90/270) */
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
      }

      /* #frame: zona del contenido = pantalla × escala (lo calcula el JS) */
      #frame {
        position: relative;
        flex-shrink: 0;
        overflow: hidden;
        background: #000;
      }

      /* Imagen o video: ocupa el marco sin deformarse (bandas negras) */
      #frame img,
      #frame video {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }

      /* Aviso (sin contenido / no autorizado / descargando). El tamaño de
         letra lo fija el JS según la pantalla. */
      #notice {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 5%;
        background: linear-gradient(135deg, #141a5e 0%, #251570 100%);
      }

      #notice.show {
        display: flex;
      }

      #notice .title {
        font-size: 1.6em;
        font-weight: 700;
        margin-bottom: 0.6em;
      }

      #notice .title.bad {
        color: #ff8a80;
      }

      #notice .text {
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 0.8em;
        max-width: 30em;
      }

      #notice .id {
        font-family: ui-monospace, Consolas, monospace;
        color: #48dbfb;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <!-- #stage => se rota según la orientación global
         #frame => zona del contenido (escala) con la imagen/video actual -->
    <div id="stage">
      <div id="frame">
        <div id="notice">
          <div class="title" id="noticeTitle"></div>
          <div class="text" id="noticeText"></div>
          <div class="id" id="noticeId"></div>
        </div>
      </div>
    </div>

    <script>
      // Todo dentro de una IIFE; lo público se publica en window.*
      (function () {
        "use strict";

        /* ==================================================================
           1. CONFIGURACIÓN
           ================================================================== */

        /** Esta pantalla: su tamaño se lee de "smartpizarra.mirror.scale". */
        var THIS_PAGE = "mirror";

        /** Claves de localStorage (iguales a CONFIG.settings de loading.html). */
        var KEYS = {
          orientation: "smartpizarra.orientation", // GLOBAL
          language: "smartpizarra.language", // GLOBAL
          ownScale: "smartpizarra." + THIS_PAGE + ".scale", // tamaño de esta pantalla
          deviceId: "smartpizarra.deviceId",
          deviceSecret: "smartpizarra.deviceSecret", // nunca se muestra
          apiUrl: "smartpizarra.apiUrl", // https://smartpizarra.cloud/api/device.php
          authorized: "smartpizarra.authorized", // "1" | "0" (la escribe esta página también)
          manifest: "smartpizarra.mirror.manifest", // última lista del servidor (JSON)
          // Solo viajan en el JSON a la app (igual que en connection.html)
          version: "smartpizarra.version",
          url: "smartpizarra.url",
          email: "smartpizarra.email",
          league: "smartpizarra.league",
          appScale: "smartpizarra.scale", // escala para la app (factor % / 100)
        };

        /**
         * Ligas de cada opción (para "leagues" en el JSON). IGUALES a
         * LEAGUE_OPTIONS de loading.html. "todos" = "" (sin filtro).
         */
        var LEAGUE_OPTIONS = {
          mlb: "LIDOM,MLB,KO,PRO,AAAI,AAAP,LMP,LVBP,CARIB",
          nba: "NBA,CBK,NBAPROP,WNBA,WCBK,EUBK",
          nflnhl: "NHL,NFL,CFB,CFBAA,CFL,SOC,SOCCER,BOX,BOXING,TEN,TENNIS",
          todos: "",
        };

        var ORIENTATIONS = [0, 90, 180, 270];
        var SCALE_LIMITS = { min: 10, max: 300 };

        /** Cada cuántos ms se releen los settings y el tamaño de la ventana. */
        var WATCH_MS = 1000;

        /** Comunicación con el servidor. */
        var SYNC = {
          everyMs: 60000, // consulta normal (autorizado)
          unauthorizedMs: 30000, // pendiente/revocado: para enterarse antes de la autorización
          errorMs: 60000, // sin internet / error: reintento
          listTimeoutMs: 10000, // tiempo máximo de la consulta de la lista
          downloadBaseMs: 60000, // tiempo máximo de una descarga: base...
          downloadBytesPerMs: 25, // ...+ tamaño / 25 KB/s (conexión muy lenta)
          storageMargin: 0.9, // no llenar más del 90 % de la cuota del WebView
        };

        /** Nombre del almacén (Cache Storage) y prefijo de las claves. */
        var CACHE_NAME = "smartpizarra-media-v1";
        var CACHE_PREFIX = "/__smartpizarra_media/";

        /** Seguridad del reproductor. */
        var PLAYER = {
          minImageMs: 3000, // duración mínima de una imagen
          videoExtraMs: 5000, // margen sobre la duración del video antes de saltarlo
          videoMaxMs: 3600000, // tope si el video no informa su duración (1 h)
          errorSkipMs: 2000, // pausa antes de saltar un archivo que falla
        };

        /** GIF negro de 1x1 (póster de los videos). */
        var BLACK_PIXEL = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAkQBADs=";

        /** Textos por idioma (claves de idioma iguales a I18N de loading.html). */
        var I18N = {
          es: {
            title: "Mirror - Smart Pizarra",
            pending: "Equipo pendiente de autorización",
            revoked: "Autorización revocada",
            conflict: "Este ID está registrado con otro equipo",
            notRegistered: "Equipo no registrado",
            unauthorizedText: "El contenido se mostrará cuando el administrador autorice este equipo.",
            notRegisteredText: "Abre la pantalla de inicio de la aplicación para registrarlo.",
            expired: "Vigencia del contenido vencida",
            expiredText: "Pide al administrador que renueve la vigencia para volver a mostrar el contenido.",
            mediaDisabled: "Contenido no habilitado",
            mediaDisabledText: "El administrador aún no ha habilitado la función de imágenes y videos en este equipo.",
            noDevice: "Equipo sin identificar",
            noDeviceText: "Abre la pantalla de inicio de la aplicación para crear su identificación.",
            empty: "Sin contenido",
            emptyText: "Sube imágenes o videos desde tu cuenta en smartpizarra.cloud/cuenta y asígnalos a este equipo.",
            downloading: "Descargando contenido…",
            downloadingText: "{total} archivo(s) por descargar.",
            noStorage: "Almacenamiento no disponible",
            noStorageText: "Este navegador no permite guardar archivos en el equipo.",
            id: "ID: ",
          },
          en: {
            title: "Mirror - Smart Pizarra",
            pending: "Device pending authorization",
            revoked: "Authorization revoked",
            conflict: "This ID is registered to another device",
            notRegistered: "Device not registered",
            unauthorizedText: "Content will be shown once the administrator authorizes this device.",
            notRegisteredText: "Open the app's start screen to register it.",
            expired: "Content subscription expired",
            expiredText: "Ask the administrator to renew it to show the content again.",
            mediaDisabled: "Content not enabled",
            mediaDisabledText: "The administrator has not enabled the images and videos feature on this device yet.",
            noDevice: "Unidentified device",
            noDeviceText: "Open the app's start screen to create its identification.",
            empty: "No content",
            emptyText: "Upload images or videos from your account at smartpizarra.cloud/cuenta and assign them to this device.",
            downloading: "Downloading content…",
            downloadingText: "{total} file(s) to download.",
            noStorage: "Storage not available",
            noStorageText: "This browser does not allow saving files on the device.",
            id: "ID: ",
          },
        };

        /** Idioma si la clave aún no existe (no se guarda). */
        var DISPLAY_LANGUAGE = "en";

        /* ==================================================================
           2. SETTINGS (localStorage)
           ================================================================== */

        function readStorage(key) {
          try {
            return window.localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }

        function writeStorage(key, value) {
          try {
            window.localStorage.setItem(key, value);
          } catch (e) {
            console.log("No se pudo guardar en localStorage:", e);
          }
        }

        /** @returns {string|null} Texto sin espacios sobrantes, o null si falta. */
        function readText(key) {
          var raw = readStorage(key);
          var text = raw === null ? "" : String(raw).trim();
          return text !== "" ? text : null;
        }

        /** @returns {number|null} 0/90/180/270, o null. */
        function readOrientation() {
          var degrees = parseInt(readStorage(KEYS.orientation), 10);
          if (isNaN(degrees)) return null;
          degrees = ((degrees % 360) + 360) % 360;
          return ORIENTATIONS.indexOf(degrees) === -1 ? null : degrees;
        }

        /** @returns {number|null} Escala (%) dentro de SCALE_LIMITS, o null. */
        function readScale(key) {
          var percent = parseInt(readStorage(key), 10);
          return percent >= SCALE_LIMITS.min && percent <= SCALE_LIMITS.max ? percent : null;
        }

        /** @returns {string} Idioma guardado (clave de I18N) o DISPLAY_LANGUAGE. */
        function readLanguage() {
          var code = (readStorage(KEYS.language) || "").trim().toLowerCase();
          return Object.prototype.hasOwnProperty.call(I18N, code) ? code : DISPLAY_LANGUAGE;
        }

        function dict() {
          return I18N[readLanguage()];
        }

        /** @returns {string|null} Clave de LEAGUE_OPTIONS guardada, o null. */
        function readLeague() {
          var option = (readStorage(KEYS.league) || "").trim().toLowerCase();
          return Object.prototype.hasOwnProperty.call(LEAGUE_OPTIONS, option) ? option : null;
        }

        /**
         * Agrega a un mensaje los settings leídos AHORA de localStorage
         * (null en los que no existen). Mismos nombres que las demás páginas.
         */
        function withSettings(msg) {
          var league = readLeague();
          var appScale = readScale(KEYS.appScale);
          var code = (readStorage(KEYS.language) || "").trim().toLowerCase();
          msg.version = readText(KEYS.version);
          msg.url = readText(KEYS.url);
          msg.email = readText(KEYS.email);
          msg.deviceId = readText(KEYS.deviceId);
          msg.league = league;
          msg.leagues = league === null ? null : LEAGUE_OPTIONS[league];
          msg.orientation = readOrientation(); // global
          msg.language = Object.prototype.hasOwnProperty.call(I18N, code) ? code : null; // global
          msg.scale = appScale === null ? null : appScale / 100; // escala para la app (factor)
          return msg;
        }

        /**
         * Envía un texto a la app probando 4 métodos (igual que las demás
         * páginas). En Kodular lo recibe "WebViewer.WebViewStringChange".
         */
        function sendToAppInventor(message) {
          try {
            if (window.AppInventor && window.AppInventor.setWebViewString) {
              window.AppInventor.setWebViewString(message); // Kodular / App Inventor
            } else if (window.android && window.android.onReceiveValue) {
              window.android.onReceiveValue(message); // Android (versiones nuevas)
            } else if (window.androidInterface && window.androidInterface.onReceiveValue) {
              window.androidInterface.onReceiveValue(message); // Interface estándar
            } else {
              window.postMessage(message, "*"); // Navegador normal (pruebas)
            }
          } catch (e) {
            console.log("Error enviando a AppInventor:", e);
          }
        }

        /** URL de api/media.php a partir de smartpizarra.apiUrl (…/api/device.php). */
        function mediaApiUrl() {
          var api = readText(KEYS.apiUrl);
          if (!api) return null;
          return api.replace(/[^\/?#]*([?#].*)?$/, "media.php");
        }

        /* ==================================================================
           3. ORIENTACIÓN Y TAMAÑO
           #stage gira; #frame = pantalla girada × escala (100 % = completa).
           ================================================================== */
        var layoutManager = {
          stage: null,
          frame: null,
          _lastState: "",

          init: function () {
            this.stage = document.getElementById("stage");
            this.frame = document.getElementById("frame");
          },

          /** Aplica orientación y escala solo si cambió algo. */
          apply: function (orientation, scale) {
            orientation = orientation === null ? 0 : orientation;
            scale = scale === null ? 100 : scale;
            var width = window.innerWidth || document.documentElement.clientWidth;
            var height = window.innerHeight || document.documentElement.clientHeight;
            if (!width || !height) return; // WebView aún en 0x0
            var state = orientation + "|" + scale + "|" + width + "x" + height;
            if (state === this._lastState) return;
            this._lastState = state;

            var stageWidth = width;
            var stageHeight = height;
            var transform = "none";
            if (orientation === 90) {
              stageWidth = height;
              stageHeight = width;
              transform = "translate(" + width + "px, 0px) rotate(90deg)";
            } else if (orientation === 180) {
              transform = "translate(" + width + "px, " + height + "px) rotate(180deg)";
            } else if (orientation === 270) {
              stageWidth = height;
              stageHeight = width;
              transform = "translate(0px, " + height + "px) rotate(270deg)";
            }
            this.stage.style.width = stageWidth + "px";
            this.stage.style.height = stageHeight + "px";
            this.stage.style.transformOrigin = "0 0";
            this.stage.style.transform = transform;

            var frameWidth = Math.round((stageWidth * scale) / 100);
            var frameHeight = Math.round((stageHeight * scale) / 100);
            this.frame.style.width = frameWidth + "px";
            this.frame.style.height = frameHeight + "px";
            // Letra de los avisos proporcional a la zona (≈ 1/22 del lado corto)
            this.frame.style.fontSize = Math.max(12, Math.round(Math.min(frameWidth, frameHeight) / 22)) + "px";
          },
        };

        /* ==================================================================
           4. ALMACÉN LOCAL (Cache Storage del WebView)
           Clave de cada archivo: /__smartpizarra_media/<id>-<sha256>. Si el
           archivo cambia, cambia la huella => clave nueva.
           ================================================================== */
        var store = {
          available: typeof window.caches !== "undefined",
          ready: {}, // clave => true si está descargado y completo

          /** @returns {string} Clave (URL absoluta del mismo origen) de un elemento. */
          keyOf: function (item) {
            return location.origin + CACHE_PREFIX + item.id + "-" + item.sha256;
          },

          open: function () {
            return window.caches.open(CACHE_NAME);
          },

          /** Marca como listos los archivos que ya están guardados (al arrancar). */
          scan: function () {
            var self = this;
            if (!this.available) return Promise.resolve();
            return this.open()
              .then(function (cache) {
                return cache.keys();
              })
              .then(function (requests) {
                for (var i = 0; i < requests.length; i++) self.ready[requests[i].url] = true;
              })
              .catch(function (e) {
                console.log("No se pudo leer el almacén:", e);
              });
          },

          /** @returns {Promise<string|null>} URL blob: del archivo guardado (o null). */
          objectUrl: function (item) {
            var key = this.keyOf(item);
            return this.open()
              .then(function (cache) {
                return cache.match(key);
              })
              .then(function (res) {
                return res ? res.blob() : null;
              })
              .then(function (blob) {
                return blob ? URL.createObjectURL(blob) : null;
              });
          },

          /** Guarda la respuesta de una descarga y comprueba el tamaño. */
          put: function (item, response) {
            var self = this;
            var key = this.keyOf(item);
            var cache;
            return this.open()
              .then(function (c) {
                cache = c;
                return cache.put(key, response);
              })
              .then(function () {
                return cache.match(key);
              })
              .then(function (res) {
                return res.blob();
              })
              .then(function (blob) {
                if (blob.size !== item.size) {
                  // Descarga incompleta: se borra y se reintenta en la próxima consulta
                  return cache.delete(key).then(function () {
                    throw new Error("Tamaño incorrecto " + blob.size + " / " + item.size);
                  });
                }
                self.ready[key] = true;
              });
          },

          /** Borra los archivos guardados que ya no están en la lista. */
          purge: function (items) {
            var self = this;
            var keep = {};
            for (var i = 0; i < items.length; i++) keep[this.keyOf(items[i])] = true;
            return this.open()
              .then(function (cache) {
                return cache.keys().then(function (requests) {
                  var jobs = [];
                  for (var j = 0; j < requests.length; j++) {
                    if (!keep[requests[j].url]) {
                      delete self.ready[requests[j].url];
                      jobs.push(cache.delete(requests[j]));
                    }
                  }
                  return Promise.all(jobs);
                });
              })
              .catch(function (e) {
                console.log("No se pudo limpiar el almacén:", e);
              });
          },

          /** @returns {Promise<boolean>} true si cabe un archivo de "bytes" más. */
          hasRoom: function (bytes) {
            if (!navigator.storage || !navigator.storage.estimate) return Promise.resolve(true);
            return navigator.storage.estimate().then(
              function (e) {
                return !e.quota || e.usage + bytes <= e.quota * SYNC.storageMargin;
              },
              function () {
                return true;
              }
            );
          },
        };

        /* ==================================================================
           5. SINCRONIZACIÓN CON EL SERVIDOR (api/media.php)
           ================================================================== */

        /** Lista guardada: {revision, items:[{id,kind,mime,size,sha256,seconds}]} */
        function loadManifest() {
          try {
            var m = JSON.parse(readStorage(KEYS.manifest) || "null");
            if (m && Object.prototype.toString.call(m.items) === "[object Array]") return m;
          } catch (e) {}
          return { revision: "", items: [] };
        }

        var sync = {
          manifest: loadManifest(),
          // Autorización conocida: la bandera guardada hasta que responda el servidor
          auth: null, // se calcula en init (bandera guardada + manifest.mediaDisabled)
          busy: false,
          timer: null,
          downloading: false,
          lastError: "",

          /** POST form-urlencoded a api/media.php (petición simple: sin CORS previo). */
          post: function (fields, timeoutMs) {
            var body = [];
            for (var k in fields) {
              if (Object.prototype.hasOwnProperty.call(fields, k)) {
                body.push(encodeURIComponent(k) + "=" + encodeURIComponent(fields[k]));
              }
            }
            var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
            var timer = controller
              ? setTimeout(function () {
                  controller.abort();
                }, timeoutMs)
              : null;
            return fetch(mediaApiUrl(), {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: body.join("&"),
              cache: "no-store",
              signal: controller ? controller.signal : undefined,
            }).then(
              function (res) {
                if (timer) clearTimeout(timer);
                return res;
              },
              function (e) {
                if (timer) clearTimeout(timer);
                throw e;
              }
            );
          },

          /** Credenciales del equipo, o null si faltan. */
          credentials: function () {
            var id = readText(KEYS.deviceId);
            var secret = readText(KEYS.deviceSecret);
            if (!id || !secret || !mediaApiUrl()) return null;
            return { deviceId: id, secret: secret };
          },

          /** Programa la próxima consulta. */
          schedule: function (ms) {
            var self = this;
            if (this.timer) clearTimeout(this.timer);
            this.timer = setTimeout(function () {
              self.run();
            }, ms);
          },

          /**
           * Guarda el estado: authorized | media_disabled (autorizado sin el
           * permiso de contenido) | expired (vigencia del usuario vencida) |
           * pending | revoked | conflict | not_registered.
           * La bandera común "smartpizarra.authorized" solo refleja la autorización.
           */
          setAuth: function (state) {
            this.auth = state;
            this.watchExpiry(); // vigila el fin de la vigencia si está autorizado
            // Recordar el permiso de contenido para arrancar sin internet
            var disabled = state === "media_disabled";
            if (state === "authorized" || disabled) {
              if (!!this.manifest.mediaDisabled !== disabled) {
                this.manifest.mediaDisabled = disabled;
                writeStorage(KEYS.manifest, JSON.stringify(this.manifest));
              }
            }
            writeStorage(KEYS.authorized, state === "authorized" || state === "media_disabled" || state === "expired" ? "1" : "0");
            player.refresh();
          },

          /**
           * Vigilancia de la vigencia: al llegar manifest.expiresAt pasa a
           * "expired" aunque no haya internet (revisa como mucho cada hora).
           */
          expiryTimer: null,
          watchExpiry: function () {
            var self = this;
            if (this.expiryTimer) clearTimeout(this.expiryTimer);
            this.expiryTimer = null;
            if (this.auth !== "authorized") return;
            var left = (+this.manifest.expiresAt || 0) - Date.now();
            if (left <= 0) {
              this.setAuth("expired");
              return;
            }
            this.expiryTimer = setTimeout(function () {
              self.watchExpiry();
            }, Math.min(left, 3600000));
          },

          /**
           * JSON a la app tras una consulta al servidor (ver cabecera).
           * @param {number} http   Código HTTP (0 = sin respuesta).
           * @param {object|null} d Respuesta de api/media.php (null si falló).
           * @param {string} error  Motivo del fallo ("" si respondió).
           */
          report: function (http, d, error) {
            var ok = !error;
            var a = this.auth;
            var authStatus;
            if (!ok) authStatus = http || navigator.onLine !== false ? "unknown" : "offline";
            else if (a === "conflict" || a === "not_registered" || a === "pending" || a === "revoked") authStatus = a;
            else authStatus = "authorized"; // authorized / media_disabled / expired: el equipo SÍ está autorizado
            var ready = 0;
            var items = this.manifest.items;
            for (var i = 0; i < items.length; i++) if (store.ready[store.keyOf(items[i])]) ready++;
            var contentStatus = a;
            if (a === "authorized") contentStatus = ready ? "showing" : items.length ? "downloading" : "empty";
            sendToAppInventor(
              JSON.stringify(
                withSettings({
                  origin: "mirror",
                  action: "sync",
                  status: ok ? "ok" : "error",
                  // Hubo respuesta HTTP (aunque sea de error) => hay internet
                  internetStatus: ok || http ? "online" : "offline",
                  authorized: ok ? authStatus === "authorized" : readStorage(KEYS.authorized) === "1",
                  authStatus: authStatus,
                  contentStatus: contentStatus,
                  mediaEnabled: d && typeof d.mediaEnabled === "boolean" ? d.mediaEnabled : null,
                  contentActive: d && typeof d.contentActive === "boolean" ? d.contentActive : null,
                  secondsLeft: d ? Math.max(0, +d.secondsLeft || 0) : Math.max(0, Math.round(((+this.manifest.expiresAt || 0) - Date.now()) / 1000)),
                  // Lista nueva APLICADA (solo con autorización, permiso y vigencia)
                  changed: !!(d && d.items && !d.unchanged && a === "authorized"),
                  items: items.length,
                  ready: ready,
                  downloading: this.downloading,
                  httpStatus: http,
                  error: error || "",
                })
              )
            );
          },

          /** Una consulta: lista -> descargas -> limpieza. Nunca dos a la vez. */
          run: function () {
            var self = this;
            if (this.busy) return;
            if (document.hidden) {
              this.schedule(SYNC.everyMs);
              return;
            }
            var cred = this.credentials();
            if (!cred) {
              this.auth = "no_device";
              player.refresh();
              this.schedule(SYNC.errorMs);
              return;
            }
            this.busy = true;
            // Un JSON a la app por consulta (ver report())
            var reported = false;
            var lastHttp = 0; // código HTTP recibido (0 = sin respuesta)
            function sendReport(http, d, error) {
              reported = true;
              self.report(http, d, error || "");
            }
            this.post(
              { action: "list", deviceId: cred.deviceId, secret: cred.secret, rev: this.manifest.revision || "" },
              SYNC.listTimeoutMs
            )
              .then(function (res) {
                lastHttp = res.status;
                return res.json().then(function (data) {
                  return { http: res.status, data: data };
                });
              })
              .then(function (r) {
                var d = r.data || {};
                if (r.http === 403 && d.error === "secret_mismatch") {
                  self.setAuth("conflict");
                  sendReport(r.http, d);
                  return SYNC.unauthorizedMs;
                }
                if (r.http === 404 && d.error === "not_registered") {
                  self.setAuth("not_registered");
                  sendReport(r.http, d);
                  return SYNC.unauthorizedMs;
                }
                if (r.http !== 200 || !d.ok) throw new Error("Respuesta " + r.http + " " + (d.error || ""));
                if (!d.authorized) {
                  // Lo descargado se conserva: al autorizarlo se vuelve a mostrar
                  self.setAuth(d.status === "revoked" ? "revoked" : "pending");
                  sendReport(r.http, d);
                  return SYNC.unauthorizedMs;
                }
                if (d.mediaEnabled === false) {
                  // Autorizado pero sin el permiso de contenido: aviso; lo guardado se conserva
                  self.setAuth("media_disabled");
                  sendReport(r.http, d);
                  return SYNC.unauthorizedMs;
                }
                if (d.contentActive === false) {
                  // Vigencia del usuario vencida o sin asignar: aviso; lo guardado se conserva
                  self.manifest.expiresAt = Date.now();
                  writeStorage(KEYS.manifest, JSON.stringify(self.manifest));
                  self.setAuth("expired");
                  sendReport(r.http, d);
                  return SYNC.unauthorizedMs;
                }
                // Vigencia activa: hora de fin con el reloj de ESTE equipo
                var expiresAt = Date.now() + Math.max(0, +d.secondsLeft || 0) * 1000;
                if (!d.unchanged && d.items) {
                  self.manifest = { revision: d.revision, items: d.items, mediaDisabled: false };
                }
                self.manifest.expiresAt = expiresAt;
                writeStorage(KEYS.manifest, JSON.stringify(self.manifest));
                self.setAuth("authorized");
                // JSON en cuanto responde el servidor (antes de las descargas,
                // que pueden tardar): "downloading"/"ready" del momento
                self.downloading = store.available && self.playableMissing() > 0;
                sendReport(r.http, d);
                return self
                  .downloadMissing(cred)
                  .then(function () {
                    return store.purge(self.manifest.items);
                  })
                  .then(function () {
                    return SYNC.everyMs;
                  });
              })
              .then(
                function (next) {
                  self.lastError = "";
                  self.busy = false;
                  player.refresh();
                  self.schedule(next);
                },
                function (e) {
                  // Sin internet o error del servidor: se sigue con lo guardado
                  self.lastError = String(e && e.message ? e.message : e);
                  console.log("mirror sync:", self.lastError);
                  self.busy = false;
                  self.downloading = false;
                  // Sin respuesta válida del servidor: también se informa a la app
                  if (!reported) sendReport(lastHttp, null, self.lastError);
                  player.refresh();
                  self.schedule(SYNC.errorMs);
                }
              );
          },

          /** @returns {number} Archivos de la lista que aún no están descargados. */
          playableMissing: function () {
            var n = 0;
            for (var i = 0; i < this.manifest.items.length; i++) {
              if (!store.ready[store.keyOf(this.manifest.items[i])]) n++;
            }
            return n;
          },

          /** Descarga en orden, de uno en uno, los archivos que falten. */
          downloadMissing: function (cred) {
            var self = this;
            if (!store.available) return Promise.resolve();
            var items = this.manifest.items.slice();
            var i = 0;
            self.downloading = true;
            function next() {
              while (i < items.length && store.ready[store.keyOf(items[i])]) i++;
              if (i >= items.length || document.hidden) {
                self.downloading = false;
                return Promise.resolve();
              }
              var item = items[i++];
              return store
                .hasRoom(item.size)
                .then(function (room) {
                  if (!room) throw new Error("Sin espacio para el archivo " + item.id);
                  return self.post(
                    { action: "file", deviceId: cred.deviceId, secret: cred.secret, id: item.id },
                    SYNC.downloadBaseMs + item.size / SYNC.downloadBytesPerMs
                  );
                })
                .then(function (res) {
                  if (res.status !== 200) throw new Error("Descarga " + item.id + ": HTTP " + res.status);
                  return store.put(item, res);
                })
                .then(
                  function () {
                    player.refresh(); // ya se puede mostrar
                    return next();
                  },
                  function (e) {
                    // Este falla: se sigue con los demás y se reintenta en la próxima consulta
                    console.log("mirror descarga:", e && e.message ? e.message : e);
                    return next();
                  }
                );
            }
            return next();
          },
        };

        /* ==================================================================
           6. REPRODUCTOR (carrusel en orden, sin transiciones)
           ================================================================== */
        var player = {
          frame: null,
          current: null, // {key, el, url} en pantalla
          index: -1, // posición en la lista del último mostrado
          timer: null,
          paused: false,
          loading: false, // preparando el siguiente (evita dos a la vez)

          init: function () {
            this.frame = document.getElementById("frame");
          },

          /** Archivos que se pueden mostrar ya (descargados), en orden. */
          playable: function () {
            var out = [];
            var items = sync.manifest.items;
            for (var i = 0; i < items.length; i++) {
              if (store.ready[store.keyOf(items[i])]) out.push(items[i]);
            }
            return out;
          },

          /**
           * Decide qué mostrar tras un cambio (autorización, lista o
           * descarga): aviso o contenido. Si ya se está mostrando algo
           * que sigue en la lista, no lo interrumpe.
           */
          refresh: function () {
            if (this.paused) return;
            var t = dict();
            var id = readText(KEYS.deviceId);
            if (!store.available) return this.notice(t.noStorage, t.noStorageText, id, true);
            var a = sync.auth;
            if (a === "no_device") return this.notice(t.noDevice, t.noDeviceText, "", true);
            if (a === "not_registered") return this.notice(t.notRegistered, t.notRegisteredText, id, true);
            if (a === "conflict") return this.notice(t.conflict, "", id, true);
            if (a === "media_disabled") return this.notice(t.mediaDisabled, t.mediaDisabledText, id, true);
            if (a === "expired") return this.notice(t.expired, t.expiredText, id, true);
            if (a === "pending" || a === "revoked") {
              return this.notice(a === "revoked" ? t.revoked : t.pending, t.unauthorizedText, id, true);
            }
            var list = this.playable();
            if (!list.length) {
              var total = sync.manifest.items.length;
              if (total) {
                return this.notice(t.downloading, t.downloadingText.replace("{total}", String(total)), id, false);
              }
              return this.notice(t.empty, t.emptyText, id, false);
            }
            this.hideNotice();
            if (this.loading) return;
            // ¿Lo que se muestra sigue en la lista? Si no (o no hay nada), avanzar
            if (!this.current || !this.inList(this.current.key, list)) this.next();
          },

          inList: function (key, list) {
            for (var i = 0; i < list.length; i++) if (store.keyOf(list[i]) === key) return true;
            return false;
          },

          /** Muestra un aviso y quita el contenido. */
          notice: function (title, text, id, bad) {
            this.stopTimer();
            this.clearMedia();
            var titleEl = document.getElementById("noticeTitle");
            titleEl.textContent = title;
            titleEl.className = "title" + (bad ? " bad" : "");
            document.getElementById("noticeText").textContent = text;
            document.getElementById("noticeId").textContent = id ? dict().id + id : "";
            document.getElementById("notice").className = "show";
          },

          hideNotice: function () {
            document.getElementById("notice").className = "";
          },

          stopTimer: function () {
            if (this.timer) clearTimeout(this.timer);
            this.timer = null;
          },

          /** Quita la imagen/video actual y libera su memoria. */
          clearMedia: function () {
            if (!this.current) return;
            this.release(this.current);
            this.current = null;
          },

          release: function (cur) {
            if (cur.el.tagName === "VIDEO") {
              cur.el.onended = null;
              cur.el.pause();
              cur.el.removeAttribute("src");
              cur.el.load(); // libera el decodificador
            }
            if (cur.el.parentNode) cur.el.parentNode.removeChild(cur.el);
            URL.revokeObjectURL(cur.url);
          },

          /** Pone el elemento nuevo encima y quita el anterior (sin parpadeo). */
          swap: function (next) {
            var prev = this.current;
            this.frame.insertBefore(next.el, document.getElementById("notice"));
            this.current = next;
            this.loading = false;
            if (prev) this.release(prev);
          },

          /** Programa el siguiente archivo. */
          after: function (ms) {
            var self = this;
            this.stopTimer();
            this.timer = setTimeout(function () {
              self.next();
            }, ms);
          },

          /** Falló preparar un archivo: se salta tras una pausa. */
          fail: function (url) {
            if (url) URL.revokeObjectURL(url);
            this.loading = false;
            this.after(PLAYER.errorSkipMs);
          },

          /** Avanza al siguiente archivo descargado (en orden, en bucle). */
          next: function () {
            var self = this;
            this.stopTimer();
            if (this.paused) return;
            var list = this.playable();
            if (!list.length) return this.refresh();
            this.index = (this.index + 1) % list.length;
            var item = list[this.index];
            var key = store.keyOf(item);

            // El mismo archivo ya en pantalla (lista de 1): nada que redibujar
            if (this.current && this.current.key === key) {
              if (item.kind === "video") {
                this.current.el.currentTime = 0;
                this.current.el.play();
                this.watchVideo(this.current.el);
              } else {
                this.after(Math.max(PLAYER.minImageMs, item.seconds * 1000));
              }
              return;
            }

            this.loading = true;
            store.objectUrl(item).then(
              function (url) {
                if (!url) {
                  delete store.ready[key]; // ya no está: se descargará de nuevo
                  return self.fail(null);
                }
                if (self.paused) {
                  self.loading = false;
                  return URL.revokeObjectURL(url);
                }
                if (item.kind === "video") self.showVideo(item, key, url);
                else self.showImage(item, key, url);
              },
              function () {
                self.fail(null);
              }
            );
          },

          /** Imagen: se decodifica antes de mostrarla. */
          showImage: function (item, key, url) {
            var self = this;
            var img = new Image();
            img.alt = "";
            var done = false;
            var shown = function () {
              if (done) return;
              done = true;
              if (self.paused) {
                self.loading = false;
                return URL.revokeObjectURL(url);
              }
              self.swap({ key: key, el: img, url: url });
              self.after(Math.max(PLAYER.minImageMs, item.seconds * 1000));
            };
            img.onerror = function () {
              if (!done) {
                done = true;
                self.fail(url);
              }
            };
            img.src = url;
            if (img.decode) {
              img.decode().then(shown, function () {
                if (img.naturalWidth) shown();
              });
            } else {
              img.onload = shown;
            }
          },

          /** Video: sin sonido (autoplay permitido); se muestra al empezar a reproducirse. */
          showVideo: function (item, key, url) {
            var self = this;
            var video = document.createElement("video");
            video.muted = true;
            video.setAttribute("muted", "");
            video.setAttribute("playsinline", "");
            // Póster negro de 1 px: el WebView pinta si no un icono gris de "play"
            video.poster = BLACK_PIXEL;
            video.preload = "auto";
            var started = false;
            var failed = false;
            function failOnce() {
              if (started || failed) return;
              failed = true;
              video.removeAttribute("src");
              self.fail(url);
            }
            video.addEventListener("playing", function () {
              if (started || failed) return;
              started = true;
              self.swap({ key: key, el: video, url: url });
              self.watchVideo(video);
            });
            video.addEventListener("error", function () {
              if (started) self.after(PLAYER.errorSkipMs);
              else failOnce();
            });
            video.src = url;
            var p = video.play();
            if (p && p.catch) p.catch(failOnce);
          },

          /** Al terminar el video => siguiente; seguro por si nunca termina. */
          watchVideo: function (video) {
            var self = this;
            video.onended = function () {
              self.next();
            };
            var d = video.duration;
            this.stopTimer();
            this.timer = setTimeout(
              function () {
                self.next();
              },
              isFinite(d) && d > 0 ? d * 1000 + PLAYER.videoExtraMs : PLAYER.videoMaxMs
            );
          },

          /** Segundo plano: todo parado (incluido el video). */
          pause: function () {
            this.paused = true;
            this.stopTimer();
            if (this.current && this.current.el.tagName === "VIDEO") this.current.el.pause();
          },

          resume: function () {
            if (!this.paused) return;
            this.paused = false;
            this.loading = false;
            if (this.current && this.current.el.tagName === "VIDEO") {
              this.current.el.play();
              this.watchVideo(this.current.el);
            } else if (this.current) {
              this.after(PLAYER.minImageMs);
            }
            this.refresh();
          },
        };

        /* ==================================================================
           7. INICIO Y API PÚBLICA
           ================================================================== */

        /** Releer orientación/tamaño (barato si nada cambió). */
        function refreshLayout() {
          layoutManager.apply(readOrientation(), readScale(KEYS.ownScale));
        }

        /** Idioma de los avisos (solo si cambió). */
        var appliedLanguage = null;
        function refreshLanguage() {
          var language = readLanguage();
          if (language === appliedLanguage) return;
          appliedLanguage = language;
          document.title = I18N[language].title;
          document.documentElement.lang = language;
          if (document.getElementById("notice").className === "show") player.refresh();
        }

        function watch() {
          refreshLayout();
          refreshLanguage();
        }

        window.mirrorSync = function () {
          sync.run();
        };

        window.mirrorStatus = function () {
          var ready = 0;
          for (var i = 0; i < sync.manifest.items.length; i++) {
            if (store.ready[store.keyOf(sync.manifest.items[i])]) ready++;
          }
          return JSON.stringify({
            auth: sync.auth,
            revision: sync.manifest.revision,
            items: sync.manifest.items.length,
            ready: ready,
            downloading: sync.downloading,
            showing: player.current ? player.current.key : null,
            lastError: sync.lastError,
          });
        };

        function init() {
          // Estado inicial sin esperar al servidor: lo último que se supo
          sync.auth = readStorage(KEYS.authorized) !== "1"
            ? "pending"
            : sync.manifest.mediaDisabled
              ? "media_disabled"
              : (+sync.manifest.expiresAt || 0) > Date.now() ? "authorized" : "expired";
          layoutManager.init();
          player.init();
          sync.watchExpiry(); // la vigencia guardada puede vencer sin internet
          watch();
          window.addEventListener("resize", refreshLayout);
          window.addEventListener("orientationchange", refreshLayout);
          window.addEventListener("pageshow", watch);
          window.addEventListener("storage", watch);
          setInterval(watch, WATCH_MS);
          document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
              player.pause();
            } else {
              player.resume();
              sync.run();
            }
          });
          // Primero lo guardado (funciona sin internet), luego el servidor
          store.scan().then(function () {
            player.refresh();
            sync.run();
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
