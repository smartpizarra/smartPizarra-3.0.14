<!--
=====================================================================
  SMART PIZARRA - ACTUALIZADOR EN SEGUNDO PLANO (refresh.html)
  PARA ANDROID WEBVIEW (assets de Kodular: refresh)
=====================================================================
  AL ABRIRSE, AL INSTANTE Y EN ESTE ORDEN (2026-11-15):
    1. Verifica la conexión a internet (si Android dice que no hay red,
       se da por caída sin esperar a la consulta).
    2. Consulta el servidor (api/device.php): actualiza su timestamp.
    3. Si el servidor trae algo distinto, actualiza el localStorage.
    4. Envía UN JSON a Kodular, ya con los datos actualizados.
  Después repite lo mismo cada 30 s.

  PANTALLA: solo el fondo #002B4F (#002B4FFF opaco), sin contenido.
  ÚNICA EXCEPCIÓN (2026-11-15): si HAY internet pero el servidor no
  responde lo esperado, se muestra "Intentando conectar con el servidor…"
  hasta que vuelva a responder bien. Casos:
    - responde con error (5xx, 404, 429, 400, respuesta que no es JSON)
      => hay internet, falla el servidor;
    - no responde nada => se prueba internet con INTERNET_PROBES
      (generate_204 de Google, la misma comprobación que usa Android; no
      envía ningún dato): si contesta, hay internet y falla el servidor;
      si no, NO hay internet (JSON "offline", sin mensaje en pantalla).
  El mensaje respeta orientación e idioma (smartpizarra.orientation /
  .language) y protege la pantalla: cambia de sitio cada DRIFT_MS (60 s),
  sin blanco puro ni animaciones.

  QUÉ HACE
    - Vigila la CONEXIÓN A INTERNET: avisa al momento cuando se cae y
      cuando vuelve (JSON "offline" / "online").
    - Cada CHECK_MS (30 s) consulta smartpizarra.cloud (api/device.php,
      igual que none.html): eso ACTUALIZA EL TIMESTAMP del equipo en el
      servidor ("última conexión" del panel: online_at / last_seen_at).
    - ACTUALIZA EL localStorage con lo que responda el servidor, solo si
      cambió: autorización, ruta, contenido habilitado y nombre.
    - Devuelve a Kodular UN JSON tras cada consulta.

  SETTINGS (localStorage). Los crea loading.html.
    Lee:      "smartpizarra.deviceId" / ".deviceSecret" / ".apiUrl"   para consultar
              "smartpizarra.orientation" / ".language"   giro e idioma del mensaje
              "smartpizarra.version" / ".url" / ".email" / ".scale"   solo en el JSON
    Escribe:  "smartpizarra.authorized"    "1" | "0"
              "smartpizarra.routeUrl"      URL de la ruta (NO_ROUTE_URL = "none" sin ruta)
              "smartpizarra.mediaEnabled"  "true" | "false"
              "smartpizarra.deviceName"    nombre en el panel ("" sin nombre)
    (mismos bloques y reglas que loading, config, connection, fingerprint,
    mirror y none)

  CONTRATO DE SALIDA: UN JSON tras CADA consulta (la primera al abrir):
    {"origin":"refresh",
     "action":"check|update|offline|online",
        check   = consulta normal sin cambios (cada 30 s)
        update  = el servidor cambió algo y se actualizó el localStorage
        offline = se cayó internet (al momento)
        online  = volvió internet (al momento)
     "status":"ok|error",
     "internetStatus":"online|offline",
     "serverStatus":"ok|error|unreachable|unknown",
        ok = respondió lo esperado; error = respondió con error;
        unreachable = no respondió pero hay internet; unknown = sin internet
     "connecting":true|false (se está mostrando el mensaje en pantalla),
     "httpStatus":200|403|500|0...,
     "authorized":true|false,
     "authStatus":"authorized|pending|revoked|conflict|unknown",
     "changed":true|false, "changes":["authorized","routeUrl","mediaEnabled","deviceName"],
     "routeUrl":"none"|"https://...", "hasRoute":true|false,
     "mediaEnabled":true|false, "deviceName":"...",
     "lastCheck": hora de la consulta (ms desde 1970),
     "error":"", "version","url","email","deviceId","orientation",
     "language","scale" (null si no existen)}
    status "error" = sin respuesta válida: no se toca el localStorage y los
    datos del JSON son los guardados.
    Sin deviceId / secreto / apiUrl no hay consulta y no se envía nada.

  ESPERAS
    - Sin internet: 2 fallos seguidos (el 2º a los 3 s), 1 si Android avisa
      de que no hay red, o el primero al abrir. Se comprueba cada
      5 -> 10 -> 20 -> 40 -> 60 s; el JSON "check" sale cada 30 s, no más.
    - Servidor que no responde bien (con internet): 2º intento a los 3 s y
      después 30 s -> 1 -> 2 -> 5 min (cientos de pantallas no lo saturan).
    - Cada espera lleva un margen al azar ±10 %.

  SEGUNDO PLANO: a diferencia de las demás páginas, SIGUE consultando
  aunque la WebView esté oculta (es su trabajo; puede ir en un
  WebViewer invisible de Kodular).

  FUNCIONES PÚBLICAS (la app las llama con RunJavaScript / EvaluateJS)
    refreshCheck()    Consulta ya el servidor y envía el JSON.
    refreshStatus()   Texto JSON con el último estado (sin consultar).

  RENDIMIENTO (TV box): sin animaciones; el mensaje solo se redibuja al
  cambiar de sitio (1 vez/min). Una petición pequeña cada 30 s.
  JavaScript ES5. Sin recursos externos.
=====================================================================
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Smart Pizarra</title>
    <style>
      /* Fondo #002B4FFF (opaco) = #002B4F */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #002b4f;
        font-family: Roboto, "Segoe UI", Tahoma, Arial, sans-serif;
      }

      /* #stage: pantalla girada 0/90/180/270 (el JS fija tamaño, giro y letra
         base = 4 % del lado corto). Oculto mientras no hay mensaje. */
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        display: none;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #stage.show {
        display: flex;
      }

      /* Mensaje (sin blanco puro; se mueve con transform cada minuto) */
      #box {
        text-align: center;
        color: rgba(226, 236, 246, 0.85);
        max-width: 85%;
      }

      #box .icon {
        width: 3.2em;
        height: 3.2em;
        color: #86c7e8;
        margin-bottom: 0.8em;
      }

      #title {
        font-size: 1.5em;
        font-weight: 700;
        line-height: 1.3;
      }

      #detail {
        margin-top: 0.6em;
        font-size: 0.9em;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="box">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 4a8 8 0 0 0-8 8H2l3 3.5L8 12H6a6 6 0 1 1 1.76 4.24l-1.42 1.42A8 8 0 1 0 12 4zm-1 4v5l4.25 2.52.77-1.28L12.5 12.2V8H11z"
          />
        </svg>
        <div id="title"></div>
        <div id="detail"></div>
      </div>
    </div>

    <script>
      // Todo dentro de una IIFE; lo público se publica en window.*
      (function () {
        "use strict";

        /* ==================================================================
           1. CONFIGURACIÓN
           ================================================================== */

        var CHECK_MS = 30000; // consulta al servidor (timestamp) y JSON a la app
        var CHECK_TIMEOUT_MS = 8000; // espera máxima de una consulta
        var CHECK_OFFLINE_MS = 5000; // sin internet: primera re-comprobación
        var CHECK_OFFLINE_MAX_MS = 60000; // ... se duplica hasta 60 s
        var RETRY_MS = 3000; // primer fallo estando conectado: se repite a los 3 s
        var ERROR_MAX_MS = 5 * 60000; // servidor fallando: espera creciente hasta 5 min
        var JITTER = 0.1; // margen aleatorio ±10 % de cada espera
        var FAILURES_TO_OFFLINE = 2; // fallos seguidos para declarar la caída
        // ¿Hay internet aunque el servidor no responda? (respuesta vacía 204, sin datos)
        var INTERNET_PROBES = [
          "https://www.gstatic.com/generate_204",
          "https://connectivitycheck.gstatic.com/generate_204",
        ];
        var PROBE_TIMEOUT_MS = 5000;
        var WATCH_MS = 1000; // relectura de orientación e idioma (con mensaje)
        var DRIFT_MS = 60000; // protección de pantalla: salto del mensaje
        var MAX_SHIFT = 0.12; // salto máximo: 12 % del lado corto
        var MIN_STEP = 0.03; // cada salto mueve al menos un 3 % del lado corto

        /** Claves de localStorage (iguales a CONFIG.settings de loading.html). */
        var KEYS = {
          orientation: "smartpizarra.orientation",
          language: "smartpizarra.language",
          deviceId: "smartpizarra.deviceId",
          deviceSecret: "smartpizarra.deviceSecret", // nunca va en el JSON
          apiUrl: "smartpizarra.apiUrl", // https://smartpizarra.cloud/api/device.php
          authorized: "smartpizarra.authorized",
          version: "smartpizarra.version",
          url: "smartpizarra.url",
          email: "smartpizarra.email",
          appScale: "smartpizarra.scale",
        };
        var ORIENTATIONS = [0, 90, 180, 270];

        /** Textos del mensaje (claves de idioma iguales a I18N de loading.html). */
        var I18N = {
          es: {
            title: "Intentando conectar con el servidor…",
            detail: "Se reintentará automáticamente.",
          },
          en: {
            title: "Trying to connect to the server…",
            detail: "It will retry automatically.",
          },
        };
        var DISPLAY_LANGUAGE = "es"; // si la clave aún no existe

        /* ------------------------------------------------------------------
         * RUTA DEL EQUIPO (2026-11-12). URL de la ruta del usuario con la liga
         * de ESTE equipo dentro; "none" (NO_ROUTE_URL) = sin ruta.
         * MISMO bloque en loading, config, connection, fingerprint, mirror, none
         * y refresh.
         * ---------------------------------------------------------------- */
        var DEVICE_ROUTE_KEY = "smartpizarra.routeUrl";
        var NO_ROUTE_URL = "none";
        var OLD_NO_ROUTE_RE =
          /^https?:\/\/(www\.)?smartpizarra\.cloud\/none\/?$/i;

        /** @returns {string} URL http(s) válida (sin espacios ni comillas, máx. 2000) o "". */
        function cleanRouteUrl(value) {
          var v = typeof value === "string" ? value.trim() : "";
          if (OLD_NO_ROUTE_RE.test(v)) return ""; // antigua página del servidor => NO_ROUTE_URL
          return /^https?:\/\/[^\s"'<>]{1,2000}$/.test(v) ? v : "";
        }

        /** @returns {string} Ruta guardada (NO_ROUTE_URL si no hay o no es válida). */
        function readDeviceRoute() {
          try {
            return (
              cleanRouteUrl(window.localStorage.getItem(DEVICE_ROUTE_KEY)) ||
              NO_ROUTE_URL
            );
          } catch (e) {
            return NO_ROUTE_URL;
          }
        }

        /**
         * Guarda la ruta de una respuesta del servidor (solo si trae deviceRoute:
         * equipos autorizados; null = sin ruta => NO_ROUTE_URL).
         * @returns {boolean} true si cambió.
         */
        function storeDeviceRoute(res) {
          if (
            !res ||
            typeof res !== "object" ||
            !Object.prototype.hasOwnProperty.call(res, "deviceRoute")
          ) {
            return false;
          }
          var url = cleanRouteUrl(res.deviceRoute) || NO_ROUTE_URL;
          try {
            var ls = window.localStorage;
            // Restos de cuando la liga se guardaba aparte (ahora va en la URL)
            ls.removeItem("smartpizarra.league");
            ls.removeItem("smartpizarra.leagues");
            ls.removeItem("smartpizarra.leagueOptions");
            if (ls.getItem(DEVICE_ROUTE_KEY) === url) return false;
            ls.setItem(DEVICE_ROUTE_KEY, url);
          } catch (e) {
            return false;
          }
          return true;
        }

        /* ------------------------------------------------------------------
         * NOMBRE DEL DISPOSITIVO (2026-11-13): "deviceName" de la respuesta
         * ("" = sin nombre) en "smartpizarra.deviceName".
         * MISMO bloque en loading, config, connection, fingerprint, mirror, none
         * y refresh.
         * ---------------------------------------------------------------- */
        var DEVICE_NAME_KEY = "smartpizarra.deviceName";

        /** @returns {boolean} true si cambió. */
        function storeDeviceName(res) {
          if (!res || typeof res !== "object" || typeof res.deviceName !== "string") return false;
          var v = res.deviceName.replace(/[\x00-\x1F\x7F]+/g, " ").trim().slice(0, 100);
          try {
            if (window.localStorage.getItem(DEVICE_NAME_KEY) === v) return false;
            window.localStorage.setItem(DEVICE_NAME_KEY, v);
            return true;
          } catch (e) {
            return false;
          }
        }

        /** @returns {string} Nombre guardado ("" si no tiene). */
        function readDeviceName() {
          try {
            return (window.localStorage.getItem(DEVICE_NAME_KEY) || "").trim();
          } catch (e) {
            return "";
          }
        }

        /* ------------------------------------------------------------------
         * CONTENIDO HABILITADO (2026-11-12): "mediaEnabled" de la respuesta
         * (true/false) en "smartpizarra.mediaEnabled" ("true"/"false").
         * MISMO bloque en loading, config, connection, fingerprint, mirror, none
         * y refresh.
         * ---------------------------------------------------------------- */
        var MEDIA_ENABLED_KEY = "smartpizarra.mediaEnabled";
        // Formato anterior "1"/"0" => "true"/"false" (al abrir cualquier página)
        (function () {
          try {
            var old = window.localStorage.getItem(MEDIA_ENABLED_KEY);
            if (old === "1" || old === "0")
              window.localStorage.setItem(
                MEDIA_ENABLED_KEY,
                old === "1" ? "true" : "false",
              );
          } catch (e) {}
        })();

        /** @returns {boolean} true si cambió. */
        function storeMediaEnabled(res) {
          if (
            !res ||
            typeof res !== "object" ||
            typeof res.mediaEnabled !== "boolean"
          )
            return false;
          var v = res.mediaEnabled ? "true" : "false";
          try {
            if (window.localStorage.getItem(MEDIA_ENABLED_KEY) === v)
              return false;
            window.localStorage.setItem(MEDIA_ENABLED_KEY, v);
            return true;
          } catch (e) {
            return false;
          }
        }

        /** @returns {boolean} Permiso guardado (false si no se sabe). */
        function readMediaEnabled() {
          try {
            var v = window.localStorage.getItem(MEDIA_ENABLED_KEY);
            return v === "true" || v === "1"; // "1" = formato anterior
          } catch (e) {
            return false;
          }
        }

        /* ==================================================================
           2. SETTINGS (localStorage)
           ================================================================== */

        function readStorage(key) {
          try {
            return window.localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }

        /** @returns {boolean} true si el valor cambió. */
        function writeStorageIfChanged(key, value) {
          try {
            if (window.localStorage.getItem(key) === value) return false;
            window.localStorage.setItem(key, value);
            return true;
          } catch (e) {
            return false;
          }
        }

        /** @returns {string|null} Texto sin espacios sobrantes, o null si falta. */
        function readText(key) {
          var raw = readStorage(key);
          var text = raw === null ? "" : String(raw).trim();
          return text !== "" ? text : null;
        }

        /** @returns {number|null} 0/90/180/270, o null. */
        function readOrientation() {
          var degrees = parseInt(readStorage(KEYS.orientation), 10);
          if (isNaN(degrees)) return null;
          degrees = ((degrees % 360) + 360) % 360;
          return ORIENTATIONS.indexOf(degrees) === -1 ? null : degrees;
        }

        /** @returns {string|null} Idioma guardado (clave de I18N) o null. */
        function readLanguage() {
          var code = (readStorage(KEYS.language) || "").trim().toLowerCase();
          return Object.prototype.hasOwnProperty.call(I18N, code) ? code : null;
        }

        /** Escala para la app (10..300 %) como factor, o null. */
        function readAppScale() {
          var p = parseInt(readStorage(KEYS.appScale), 10);
          return p >= 10 && p <= 300 ? p / 100 : null;
        }

        /** Agrega a un mensaje los settings leídos AHORA (null en los que no existen). */
        function withSettings(msg) {
          msg.routeUrl = readDeviceRoute();
          msg.hasRoute = msg.routeUrl !== NO_ROUTE_URL;
          msg.mediaEnabled = readMediaEnabled();
          msg.deviceName = readDeviceName();
          msg.version = readText(KEYS.version);
          msg.url = readText(KEYS.url);
          msg.email = readText(KEYS.email);
          msg.deviceId = readText(KEYS.deviceId);
          msg.orientation = readOrientation();
          msg.language = readLanguage();
          msg.scale = readAppScale();
          return msg;
        }

        /* ==================================================================
           3. COMUNICACIÓN CON LA APP
           ================================================================== */

        /** Envía un texto a la app probando 4 métodos (igual que las demás páginas). */
        function sendToAppInventor(message) {
          try {
            if (window.AppInventor && window.AppInventor.setWebViewString) {
              window.AppInventor.setWebViewString(message); // Kodular / App Inventor
            } else if (window.android && window.android.onReceiveValue) {
              window.android.onReceiveValue(message);
            } else if (
              window.androidInterface &&
              window.androidInterface.onReceiveValue
            ) {
              window.androidInterface.onReceiveValue(message);
            } else {
              window.postMessage(message, "*"); // navegador normal (pruebas)
            }
          } catch (e) {
            console.log("Error enviando a AppInventor:", e);
          }
        }

        /* ==================================================================
           4. MENSAJE "INTENTANDO CONECTAR CON EL SERVIDOR"
           Oculto salvo cuando hay internet y el servidor no responde bien.
           Gira con la orientación, usa el idioma global y cambia de sitio
           cada DRIFT_MS (protección de pantalla, sin animaciones).
           ================================================================== */

        var notice = {
          stage: null,
          box: null,
          shown: false,
          layout: "", // última orientación|tamaño aplicada
          language: "",
          x: 0,
          y: 0,
          watchTimer: null,
          driftTimer: null,

          init: function () {
            this.stage = document.getElementById("stage");
            this.box = document.getElementById("box");
          },

          /** Muestra u oculta el mensaje (los relojes solo corren con él visible). */
          set: function (show) {
            var self = this;
            if (show === this.shown) return;
            this.shown = show;
            this.stage.className = show ? "show" : "";
            clearInterval(this.watchTimer);
            clearInterval(this.driftTimer);
            if (!show) return;
            this.layout = "";
            this.language = "";
            this.watch();
            this.watchTimer = setInterval(function () {
              self.watch();
            }, WATCH_MS);
            this.driftTimer = setInterval(function () {
              self.drift();
            }, DRIFT_MS);
          },

          /** Aplica orientación, tamaño e idioma si cambiaron. */
          watch: function () {
            var lang = readLanguage() || DISPLAY_LANGUAGE;
            if (lang !== this.language) {
              this.language = lang;
              document.documentElement.lang = lang;
              document.getElementById("title").textContent = I18N[lang].title;
              document.getElementById("detail").textContent = I18N[lang].detail;
              this.layout = ""; // el bloque cambió de tamaño: recolocar
            }
            var orientation = readOrientation() || 0;
            var width = window.innerWidth || document.documentElement.clientWidth;
            var height = window.innerHeight || document.documentElement.clientHeight;
            if (!width || !height) return; // WebView aún en 0x0
            var state = orientation + "|" + width + "x" + height;
            if (state === this.layout) return;
            this.layout = state;
            var w = width;
            var h = height;
            var transform = "none";
            if (orientation === 90) {
              w = height;
              h = width;
              transform = "translate(" + width + "px, 0px) rotate(90deg)";
            } else if (orientation === 180) {
              transform = "translate(" + width + "px, " + height + "px) rotate(180deg)";
            } else if (orientation === 270) {
              w = height;
              h = width;
              transform = "translate(0px, " + height + "px) rotate(270deg)";
            }
            var s = this.stage.style;
            s.width = w + "px";
            s.height = h + "px";
            s.transformOrigin = "0 0";
            s.transform = transform;
            s.fontSize = Math.max(10, Math.round(Math.min(w, h) * 0.04)) + "px";
            this.drift();
          },

          /** Salto a una posición al azar dentro del espacio libre. */
          drift: function () {
            var w = this.stage.clientWidth;
            var h = this.stage.clientHeight;
            if (!w || !h) return;
            var short = Math.min(w, h);
            var limX = Math.min(Math.max(0, (w - this.box.offsetWidth) / 2), short * MAX_SHIFT);
            var limY = Math.min(Math.max(0, (h - this.box.offsetHeight) / 2), short * MAX_SHIFT);
            var nx = this.x;
            var ny = this.y;
            for (var i = 0; i < 6; i++) {
              nx = Math.round((Math.random() * 2 - 1) * limX);
              ny = Math.round((Math.random() * 2 - 1) * limY);
              if (Math.abs(nx - this.x) + Math.abs(ny - this.y) >= short * MIN_STEP) break;
            }
            this.x = nx;
            this.y = ny;
            this.box.style.transform = "translate(" + nx + "px," + ny + "px)";
          },
        };

        /* ==================================================================
           5. CONSULTA AL SERVIDOR (api/device.php) = TIMESTAMP + DATOS
           ================================================================== */

        var refresh = {
          timer: null,
          busy: false,
          last: null, // último JSON (para refreshStatus)
          net: "unknown", // unknown | online | offline
          failures: 0, // consultas seguidas sin internet
          lastSent: 0, // hora del último JSON enviado (ms)
          offlineDelay: CHECK_OFFLINE_MS,
          serverErrors: 0, // consultas seguidas con internet en las que el servidor falló

          /** Programa la siguiente consulta (con margen al azar). */
          schedule: function (ms) {
            var self = this;
            clearTimeout(this.timer);
            var wait = Math.round(ms * (1 - JITTER + Math.random() * 2 * JITTER));
            this.timer = setTimeout(function () {
              self.run();
            }, wait);
          },

          /** POST form-urlencoded (sin verificación previa CORS en el WebView). */
          request: function (apiUrl, id, secret) {
            return new Promise(function (resolve) {
              var done = false;
              function finish(http, data) {
                if (done) return;
                done = true;
                resolve({ http: http, data: data });
              }
              try {
                var xhr = new XMLHttpRequest();
                xhr.open("POST", apiUrl, true);
                xhr.timeout = CHECK_TIMEOUT_MS;
                xhr.setRequestHeader(
                  "Content-Type",
                  "application/x-www-form-urlencoded",
                );
                xhr.onload = function () {
                  var data = null;
                  try {
                    data = JSON.parse(xhr.responseText);
                  } catch (e) {
                    data = null;
                  }
                  finish(xhr.status, data);
                };
                xhr.onerror =
                  xhr.ontimeout =
                  xhr.onabort =
                    function () {
                      finish(0, null);
                    };
                xhr.send(
                  "deviceId=" +
                    encodeURIComponent(id) +
                    "&secret=" +
                    encodeURIComponent(secret) +
                    "&version=" +
                    encodeURIComponent(readText(KEYS.version) || ""),
                );
              } catch (e) {
                finish(0, null);
              }
            });
          },

          /**
           * ¿Hay internet? (solo cuando el servidor no respondió nada). Petición
           * "no-cors" a generate_204: cualquier respuesta = hay conexión.
           * @returns {Promise<boolean>}
           */
          probeInternet: function () {
            function one(url) {
              return new Promise(function (resolve) {
                var done = false;
                var t = setTimeout(function () {
                  if (!done) {
                    done = true;
                    resolve(false);
                  }
                }, PROBE_TIMEOUT_MS);
                try {
                  fetch(url + "?t=" + Date.now(), { mode: "no-cors", cache: "no-store" }).then(
                    function () {
                      if (!done) {
                        done = true;
                        clearTimeout(t);
                        resolve(true);
                      }
                    },
                    function () {
                      if (!done) {
                        done = true;
                        clearTimeout(t);
                        resolve(false);
                      }
                    },
                  );
                } catch (e) {
                  done = true;
                  clearTimeout(t);
                  resolve(false);
                }
              });
            }
            return one(INTERNET_PROBES[0]).then(function (ok) {
              return ok ? true : one(INTERNET_PROBES[1]);
            });
          },

          /**
           * Guarda en localStorage lo que respondió el servidor.
           * @returns {string[]} Claves que cambiaron.
           */
          store: function (d, authStatus) {
            var changes = [];
            var authorized = authStatus === "authorized" ? "1" : "0";
            if (writeStorageIfChanged(KEYS.authorized, authorized)) changes.push("authorized");
            if (authStatus === "conflict") return changes; // sin datos del equipo
            if (storeDeviceRoute(d)) changes.push("routeUrl"); // solo autorizados la traen
            if (storeMediaEnabled(d)) changes.push("mediaEnabled");
            if (storeDeviceName(d)) changes.push("deviceName");
            return changes;
          },

          /**
           * Una consulta + el JSON a la app. Nunca dos a la vez.
           * El JSON sale al cambiar la conexión, cuando cambió algo del
           * servidor, cada CHECK_MS en la consulta normal y siempre con force
           * (al abrir y con refreshCheck()).
           * @param {boolean} [force] Enviar el JSON aunque no haya cambios.
           */
          run: function (force) {
            var self = this;
            clearTimeout(this.timer);
            if (this.busy) return;
            var id = readText(KEYS.deviceId);
            var secret = readText(KEYS.deviceSecret);
            var apiUrl = readText(KEYS.apiUrl);
            if (!id || !secret || !apiUrl) {
              this.schedule(CHECK_MS); // sin credenciales: nada que consultar ni enviar
              return;
            }
            this.busy = true;
            // PASO 1: conexión. Si Android ya sabe que no hay red, no se espera
            // a que la consulta falle (hasta CHECK_TIMEOUT_MS): se da por caída.
            // PASO 2: consulta al servidor (actualiza su timestamp).
            var query =
              navigator.onLine === false
                ? Promise.resolve({ http: 0, data: null, skipped: true })
                : this.request(apiUrl, id, secret);
            query
              .then(function (r) {
                // Sin respuesta del servidor: ¿es internet o es el servidor?
                if (r.http !== 0 || r.skipped) {
                  r.internet = r.http !== 0;
                  return r;
                }
                return self.probeInternet().then(function (online) {
                  r.internet = online;
                  return r;
                });
              })
              .then(function (r) {
                self.finish(r, force);
              });
          },

          /** Pasos 3 y 4: localStorage, mensaje en pantalla, JSON y siguiente consulta. */
          finish: function (r, force) {
            var d = r.data;
            var ok = !!(d && d.ok === true);
            var authStatus = "unknown";
            if (r.http === 403 && d && d.error === "secret_mismatch") {
              authStatus = "conflict"; // el ID está registrado con otro secreto
            } else if (ok) {
              authStatus =
                d.authorized === true
                  ? "authorized"
                  : d.status === "revoked"
                    ? "revoked"
                    : "pending";
            }
            var answered = ok || authStatus === "conflict"; // respondió lo esperado
            // PASO 3: localStorage, solo lo que cambió (antes de enviar el JSON)
            var changes = answered ? this.store(d, authStatus) : [];

            var serverStatus = answered
              ? "ok"
              : r.http !== 0
                ? "error"
                : r.internet
                  ? "unreachable"
                  : "unknown";

            // ---- ¿Se cayó o volvió internet? ----
            var change = ""; // "offline" | "online" | ""
            var next = CHECK_MS;
            if (r.internet) {
              this.failures = 0;
              this.offlineDelay = CHECK_OFFLINE_MS;
              if (this.net === "offline") change = "online";
              this.net = "online";
              if (answered) {
                this.serverErrors = 0;
              } else {
                // Hay internet pero el servidor no responde bien: 3 s, y luego
                // 30 s -> 1 -> 2 -> 5 min
                this.serverErrors++;
                next =
                  this.serverErrors === 1
                    ? RETRY_MS
                    : Math.min(ERROR_MAX_MS, CHECK_MS * Math.pow(2, this.serverErrors - 2));
              }
            } else {
              this.failures++;
              this.serverErrors = 0;
              var lost =
                this.net === "unknown" ||
                this.failures >= FAILURES_TO_OFFLINE ||
                navigator.onLine === false;
              if (this.net !== "offline" && lost) {
                change = "offline";
                this.net = "offline";
              }
              if (this.net === "offline") {
                next = this.offlineDelay;
                this.offlineDelay = Math.min(CHECK_OFFLINE_MAX_MS, this.offlineDelay * 2);
              } else {
                next = RETRY_MS; // primer fallo estando conectado: se confirma, sin JSON aún
              }
            }

            // Mensaje en pantalla: solo con internet y el servidor sin responder bien
            var wasShown = notice.shown;
            notice.set(!!r.internet && !answered);

            var due = Date.now() - this.lastSent >= CHECK_MS - 1000; // toca el periódico
            var send =
              force ||
              change !== "" ||
              notice.shown !== wasShown || // el mensaje aparece o se quita: avisar ya
              changes.length > 0 ||
              changes.length > 0 ||
              (due && (r.internet || this.net === "offline"));
            var msg = withSettings({
              origin: "refresh",
              action: change || (changes.length ? "update" : "check"),
              status: answered ? "ok" : "error",
              internetStatus: r.internet ? "online" : "offline",
              serverStatus: serverStatus,
              connecting: notice.shown,
              httpStatus: r.http,
              authorized: answered
                ? authStatus === "authorized"
                : readStorage(KEYS.authorized) === "1",
              authStatus: authStatus,
              changed: changes.length > 0,
              changes: changes,
              lastCheck: Date.now(),
              error: answered
                ? ""
                : r.http
                  ? "HTTP " + r.http
                  : r.internet
                    ? "el servidor no responde"
                    : "sin internet",
            });
            this.last = msg;
            // PASO 4: el JSON a Kodular, ya con el localStorage actualizado
            if (send) {
              sendToAppInventor(JSON.stringify(msg));
              this.lastSent = Date.now();
            }
            this.busy = false;
            this.schedule(next);
          },
        };

        /* ==================================================================
           6. INICIO Y API PÚBLICA
           ================================================================== */

        window.refreshCheck = function () {
          refresh.run(true);
        };

        window.refreshStatus = function () {
          return JSON.stringify(
            refresh.last ||
              withSettings({ origin: "refresh", action: "status", lastCheck: null }),
          );
        };

        function init() {
          notice.init();
          window.addEventListener("resize", function () {
            if (notice.shown) notice.watch();
          });
          // Avisos de red de Android/WebView: comprobar ya (la consulta decide
          // si de verdad se cayó o volvió internet y entonces envía el JSON)
          window.addEventListener("online", function () {
            refresh.run();
          });
          window.addEventListener("offline", function () {
            refresh.run();
          });
          refresh.run(true); // al abrir: conexión -> consulta -> localStorage -> JSON
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
